<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORITURI · 검투장</title>
<link rel="stylesheet" href="theme.css">
<script src="ui.js"></script>
<style>
  /* 디자인 토큰(:root)은 theme.css가 단일 출처 */
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
        font:14px/1.4 var(--font-body); display:flex; flex-direction:column; }
  header{ flex:0 0 auto; padding:8px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1{ font-family:var(--font-display); font-size:14px; margin:0; font-weight:700; letter-spacing:.1em; color:var(--gold); }
  #wrap{ max-width:min(1200px,96vw); width:100%; margin:0 auto; padding:0 16px 10px;
         flex:1; min-height:0; display:flex; flex-direction:column; }
  /* 무대 상자: 남은 세로 공간을 캔버스가 비율 유지로 채운다(JS가 정확한 크기를 준다) */
  #stagebox{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  /* HP 패널 */
  #hud{ flex:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin:8px 0; }
  .fcard{ background:linear-gradient(180deg,rgba(210,171,85,.04),transparent 40%), var(--panel);
          border:1px solid var(--line-soft); border-radius:var(--r2); padding:10px 12px; box-shadow:var(--sh1); }
  .fcard.b{ text-align:right; }
  .fname{ font-family:var(--font-display); font-weight:700; font-size:16px; letter-spacing:.02em; }
  .ftags{ color:var(--dim); font-size:11px; margin-top:2px; }
  .fendow{ color:var(--dim); font-size:10px; margin-top:3px; letter-spacing:.03em; }
  .fendow .grade{ color:var(--gold); font-weight:600; }
  .fendow .stats{ opacity:.75; font-variant-numeric:tabular-nums; }
  .ftraits2{ font-size:10px; margin-top:3px; color:#9bd17a; }
  .ftraits2 .t{ display:inline-block; background:rgba(120,170,90,0.18); border-radius:3px; padding:0 4px; margin:1px 2px 0 0; }
  .bar{ height:12px; border-radius:6px; background:rgba(0,0,0,.45); border:1px solid var(--line-soft); margin-top:6px; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:100%; transition:width .05s linear; }
  .hp.a > i{ background:linear-gradient(90deg,#2e6bb0,var(--a)); }
  .hp.b > i{ background:linear-gradient(90deg,var(--b),#b03e3e); }
  .stam{ height:5px; margin-top:4px; }
  .stam > i{ background:linear-gradient(90deg,var(--gold-deep),var(--gold)); }
  .vs{ color:var(--gold-deep); font-family:var(--font-display); font-weight:700; font-size:13px; text-align:center; }
  .winner{ font-size:11px; margin-top:4px; min-height:14px; }
  /* 캔버스 */
  #stage{ position:relative; }
  /* 경기장 인트로 대사(#5) — 각 모리튜리 줌인 시 하단 자막 */
  #introCap{ position:absolute; left:0; right:0; bottom:7%; text-align:center; pointer-events:none;
    opacity:0; transition:opacity .45s ease; z-index:5; }
  #introCap .ic-name{ font-family:var(--font-display); font-weight:900; font-size:clamp(16px,2.6vw,26px);
    letter-spacing:.08em; text-shadow:0 2px 10px rgba(0,0,0,.9); }
  #introCap .ic-quote{ font-family:'Noto Serif KR',serif; font-style:italic; font-size:clamp(14px,2vw,20px);
    color:#f2e9d2; margin-top:6px; text-shadow:0 2px 8px rgba(0,0,0,.95); word-break:keep-all;
    max-width:80%; margin-left:auto; margin-right:auto; }
  /* 처형전 엄지 판정 — 경기장 안에서 진행(경기결과 창 아님) */
  #execCap{ position:absolute; left:0; right:0; top:26%; text-align:center; pointer-events:none; opacity:0;
    transition:opacity .4s ease; z-index:7; }
  #execCap.on{ opacity:1; }
  #execCap .ex-pre{ font-family:'Noto Serif KR',serif; color:#f2e9d2; font-size:clamp(14px,2vw,20px);
    text-shadow:0 2px 12px #000; word-break:keep-all; }
  #execCap .ex-thumb{ font-size:clamp(44px,9vw,86px); line-height:1.1; margin:6px 0;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.85)); }
  #execCap .ex-thumb.rocking{ display:inline-block; animation:thumbRock .7s ease-in-out infinite; }
  @keyframes thumbRock{ 0%,100%{transform:rotate(-15deg)} 50%{transform:rotate(15deg)} }
  #execCap .ex-verdict{ font-family:var(--font-display); font-weight:900; font-size:clamp(17px,2.8vw,28px);
    letter-spacing:.05em; text-shadow:0 2px 14px #000; word-break:keep-all; }
  #execCap .ex-verdict.spare{ color:#7ec97e; } #execCap .ex-verdict.kill{ color:#e0685f; }
  #execCap .ex-note{ font-size:12px; color:#cbb98d; margin-top:5px; text-shadow:0 1px 6px #000; }
  canvas{ width:100%; height:100%; background:#141009; border-radius:var(--r2); display:block;
          border:1px solid var(--line-soft); box-shadow:var(--sh2); }
  #drop{ position:absolute; inset:0; display:flex; flex-direction:column; gap:8px;
         align-items:center; justify-content:center; text-align:center; color:var(--dim);
         border:2px dashed var(--line); border-radius:var(--r2); cursor:var(--cur-hand); }
  #drop.hidden{ display:none; }
  #drop b{ color:var(--ink); }
  /* 컨트롤 */
  #ctrl{ display:flex; gap:12px; align-items:center; margin-top:10px; }
  /* ── 시네마 모드([15]§10.18) — UI를 걷고 카메라만 남긴다 ──────────────────
     무대가 이미 16:9(940×528)라 대부분의 화면을 레터박스 없이 채운다.
     HP·이름표는 캔버스 위에 그려지므로(unitTag) UI를 걷어도 정보가 다 사라지진 않는다. */
  body.cinema{ overflow:hidden; }
  body.cinema header, body.cinema #hud,
  body.cinema .hint, body.cinema #legend{ display:none !important; }
  body.cinema #wrap{ max-width:none; width:100vw; height:100vh; padding:0; margin:0; }
  body.cinema #stagebox{ width:100vw; height:100vh; }
  body.cinema #cinemaOut{ display:block; }
  /* 나갈 길은 남긴다 — 평소엔 숨고 마우스를 올리면 나타난다 */
  #cinemaOut{ display:none; position:fixed; top:10px; right:12px; z-index:50;
              opacity:.12; transition:opacity .18s; }
  #cinemaOut:hover{ opacity:1; }
  /* ── 시네마가 기본 상태다([15]§10.21) ─────────────────────────────────────
     시네마를 디폴트로 하면 컨트롤을 걷어낼 수 없다 — 걷으면 조작할 방법이 없어진다.
     그래서 문서 흐름에서 **떼어내 화면 위에 띄운다**. 영상 플레이어와 같은 규칙:
     마우스가 멈추면 물러나고 움직이면 돌아온다. 무대는 그동안 한 픽셀도 안 줄어든다. */
  body.devon.cinema #devbar{ display:block; position:fixed; left:50%; bottom:18px;
    transform:translateX(-50%); z-index:60; width:min(940px, calc(100vw - 48px));
    margin:0; padding:10px 14px; border-radius:var(--r2); background:rgba(14,11,8,.74);
    border:1px solid var(--line-soft); box-shadow:var(--sh2);
    -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); }
  body.devon.cinema #ctrl{ margin-top:0; }
  body.cinema #devbar, body.cinema #cinemaOut, body.cinema #devToggle{ transition:opacity .3s; }
  body.cinema #cinemaOut, body.cinema #devToggle{ opacity:.5; }
  body.cinema #cinemaOut:hover, body.cinema #devToggle:hover{ opacity:1; }
  /* idle = 일정 시간 입력이 없었다. pointer-events까지 끊어야 안 보이는 버튼이 안 눌린다 */
  body.cinema.idle #devbar, body.cinema.idle #cinemaOut,
  body.cinema.idle #devToggle{ opacity:0; pointer-events:none; }
  /* ── 개발자 패널([15]§10.24) ────────────────────────────────────────────────
     배속·재생바·하이라이트·시계는 **인게임 완성본에 없다.** 조사 도구지 게임 UI가 아니다.
     기본은 숨김 — D 키 또는 우상단 버튼으로 연다. 인게임 정보(HP·스태미나·가드)는
     캔버스 하단 HUD가 대신한다. */
  #devbar{ display:none; }
  body.devon #devbar{ display:block; }
  /* 시네마 종료와 달리 항상 떠 있다 — 컨트롤로 가는 유일한 입구라 찾을 수 있어야 한다 */
  #devToggle{ position:fixed; top:10px; right:112px; z-index:50; font-size:12px;
              padding:5px 10px; opacity:.3; transition:opacity .18s; }
  #devToggle:hover{ opacity:1; }
  body.devon #devToggle{ opacity:.75; border-color:var(--gold-deep); }
  button{ background:var(--panel2); color:var(--ink); border:1px solid var(--line);
          border-radius:var(--r1); padding:7px 14px; font-size:14px; cursor:pointer;
          transition:border-color .15s, background .15s; }
  button:hover{ border-color:var(--gold-deep); background:var(--panel3); }
  #scrub{ flex:1; accent-color:var(--gold); }
  #clock{ font-variant-numeric:tabular-nums; color:var(--dim); min-width:96px; text-align:right; }
  select{ background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:var(--r1); padding:6px; }
  .hint{ color:var(--dim); font-size:11px; margin-top:10px; }
  code{ background:rgba(0,0,0,.4); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1><svg class="ic"><use href="icons.svg#swords"/></svg> MORITURI · 검투장</h1>
  <span class="hint" id="meta"></span>
</header>

<div id="wrap">
  <div id="hud">
    <div class="fcard a">
      <div class="fname" id="nameA" style="color:var(--a)">—</div>
      <div class="ftags" id="tagsA"></div>
      <div class="fendow" id="endowA"></div>
      <div class="ftraits2" id="traitA"></div>
      <div class="bar hp a"><i id="hpA"></i></div>
      <div class="bar stam"><i id="stA"></i></div>
      <div class="winner" id="winA"></div>
    </div>
    <div class="vs">VS</div>
    <div class="fcard b">
      <div class="fname" id="nameB" style="color:var(--b)">—</div>
      <div class="ftags" id="tagsB"></div>
      <div class="fendow" id="endowB"></div>
      <div class="ftraits2" id="traitB"></div>
      <div class="bar hp b"><i id="hpB"></i></div>
      <div class="bar stam"><i id="stB"></i></div>
      <div class="winner" id="winB"></div>
    </div>
  </div>

  <button id="cinemaOut" onclick="setCinema(false, true)">시네마 종료</button>
  <div id="stagebox"><div id="stage">
    <canvas id="cv" width="940" height="440"></canvas>
    <div id="introCap"></div>
    <div id="execCap"></div>
    <label id="drop">
      <b>viewer.json 을 여기로 끌어다 놓으세요</b>
      <span>또는 클릭해서 파일 선택 · 생성: <code>dotnet run -- viewer arrogant 7</code></span>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </label>
  </div></div>

  <div id="devbar"><div id="ctrl">
    <button id="play">▶ 재생</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" disabled>
    <span class="seg" id="speed"><button data-v="0.25">0.25×</button><button data-v="0.5">0.5×</button><button data-v="1" class="cur">1×</button><button data-v="2">2×</button><button data-v="4">4×</button></span>
    <button id="viewmode" title="기본 ↔ 줌 추적">기본 화면</button>
    <button id="hl" title="임팩트 구간(타격·넉다운·KO)만 점프 재생 — 3분 경기를 ~30초에">{ff} 하이라이트</button>
    <span id="clock">0.0 / 0.0s</span>
  </div>
  <div class="hint">콜로세움 핏(2.5D). 머리 위 = 이름·HP. 가드 파랑끼 · 경직/다운 회색 · 도발 노랑. 발밑 옅은 타원 = 무기 사거리. Space=재생/정지 · D=개발자 패널.</div>
  </div>
  <button id="devToggle" onclick="setDev()">개발자</button>
</div>

<script>
"use strict";
const cv = document.getElementById('cv');
const screenCtx = cv.getContext('2d');
// ctx는 매 프레임 월드층(저해상)과 UI층(풀해상) 사이를 오간다 — 드로우 함수 본문은 그대로 두고
// 참조만 갈아끼우는 방식(아래 PIXEL 주석 참고). 그래서 const가 아니라 let이다.
let ctx = screenCtx;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const W = 940, H = 528, PAD = 70, GROUND = H - 70;   // 논리 좌표계(모든 그리기 기준). 세로는 [15]§2.4 개정으로 440→560

// ── 픽셀 렌더 (M4-c) ──────────────────────────────────────────────────────────
// 월드(아레나·스프라이트·혈흔)는 1/PX 크기의 저해상 캔버스에 그린 뒤 정수배로 확대한다.
// 이러면 스프라이트 배율이 깊이원근 때문에 비정수여도 화면 픽셀은 전부 PX×PX로 균일하다.
// UI·글자는 확대 대상이 아니라 풀해상 본 캔버스에 따로 그린다(안 그러면 이름·데미지가 뭉갠다).
//
// 배율은 FIGH가 아니라 **카메라 줌**으로 만든다. FIGH로 스프라이트만 키우면 아레나는 그대로라
// 비율이 깨지고, 아레나를 같이 키우면 배경 프리렌더(940×440)를 관중석이 넘어가 잘린다.
// 줌은 아레나·스프라이트·배경을 한 변환으로 같이 키우므로 둘 다 공짜로 해결된다.
//
// 저해상 공간에서 스프라이트가 앉는 크기 = (FIGH/PX) × 줌. PX=2·FIGH=120·줌1.6 → 96px,
// 즉 96px 원본과 정확히 1:1. 이 셋은 한 세트로 움직인다.
const _qs = new URLSearchParams(location.search);
let PX   = +(_qs.get('px')   || 2);     // 저해상 월드 캔버스 배율. 1 = 픽셀화 없음(옛 동작)
let FIGH = +(_qs.get('figh') || 120);   // 화면상 검투사 키(px, 줌 1배 기준)
const ZoomFollow = +(_qs.get('zoom') || 1.6);   // 추적 카메라 배율
const SHEET = _qs.get('sheet') || 'sprites.json';   // 스프라이트 시트 교체(룩 비교용)
const wcv = document.createElement('canvas');
const wctx = wcv.getContext('2d');
function fitWorldCanvas(){
  wcv.width  = Math.ceil(W / PX);
  wcv.height = Math.ceil(H / PX);
}
fitWorldCanvas();
// ── 2.5D 핏 투영 (원형 아레나 → 기울인 타원 바닥). 중심 (0,0), Y=깊이 ──
// ▼▼ 카메라 노브(취향껏 조절) ▼▼  CamHeight: 화면상 상하 위치 — 작게(0.45)=위로, 크게(0.62)=아래로.
//    CamTilt: 카메라 기울기 — 작게(0.24)=더 정면(눕힘), 크게(0.45)=더 내려다봄.
// ※ 투영은 단일 출처다([15]§2.3 · 원칙 2). 배경 이미지는 이 값들에서 역산한 정사영 카메라로
//   구워졌으므로(tools/arenabake), 여기를 바꾸면 **배경도 다시 구워야 한다**.
// ※ CamTilt는 스프라이트 베이크의 --elevation과 한 세트다: elevation = asin(CamTilt).
//    0.34→20° · 0.26→15° · 0.20→11.5°. 여기만 눕히고 스프라이트를 그대로 두면 바닥은 눕고
//    캐릭터만 내려다본 각도로 남아 어긋난다. 바꾸면 반드시 다시 굽는다.
// 부각은 **모드별로 다르다** ([15]§2.4): 기본 20°, 줌 추적 15°. 줌 배율에 연동해 연속 보간하므로
// 전환 순간 바닥이 튀지 않는다. 스프라이트는 20° 한 벌만 쓴다 — 96px에서 5° 차이는 윤곽선 위
// 1px 이동으로만 나타나 인지되지 않는다(측정: 차이 픽셀의 전부가 외곽선). 두 벌은 영구 2배
// 유지비와 전환 팝을 부르는데 얻는 게 없다.
const CamHeight = 0.62;
const TiltBasic = +(_qs.get('tilt')     || 0.34);   // 부각 20° — 스프라이트 베이크 각도와 일치
const TiltZoom  = +(_qs.get('tiltzoom') || 0.26);   // 부각 15° — 바닥만 눕는다
let CamTilt = TiltBasic;
let zoomFrac = 0;   // 0=기본 · 1=줌 (배경 크로스페이드와 부각 보간에 공용)
// 줌 추적 시 발밑이 화면 중앙에 오면 머리 위가 답답하다 — 추적 중심을 이만큼 내려 상단 여백을 만든다.
const ZoomLiftPx = +(_qs.get('lift') || 46);
const CX = W/2, CY = H*CamHeight, RX = W/2 - PAD;
let RY = RX*CamTilt;   // 부각이 모드에 따라 변하므로 let
// 캔버스 백킹을 표시 크기×DPR에 맞춤 → 전체화면·리사이즈에서도 크리스프 (좌표계는 W×H 논리 고정)
let CANVAS_S = 1;   // 논리 좌표 → 물리 픽셀 배율. 월드층 합성 후 이 값으로 되돌려야 한다.
function fitCanvas(){
  const rw = cv.clientWidth || W;
  const pw = Math.max(1, Math.round(rw*DPR)), ph = Math.max(1, Math.round(rw*(H/W)*DPR));
  if (cv.width!==pw || cv.height!==ph){ cv.width=pw; cv.height=ph; }
  const s = pw/W;
  CANVAS_S = s;
  screenCtx.setTransform(s,0,0,s,0,0);
}
// 무대 상자에 캔버스를 비율 유지로 앉힌다(contain) — 스크롤 없는 고정 화면
function fitStageBox(){
  const box = document.getElementById('stagebox'), st = document.getElementById('stage');
  if (!box || !st) return;
  const s = Math.min(box.clientWidth / W, box.clientHeight / H);
  if (!(s > 0)) return;
  st.style.width = Math.floor(W * s) + 'px';
  st.style.height = Math.floor(H * s) + 'px';
  fitCanvas();
}
fitStageBox(); fitCanvas();
if (window.ResizeObserver){
  new ResizeObserver(fitCanvas).observe(cv);
  const box = document.getElementById('stagebox');
  if (box) new ResizeObserver(fitStageBox).observe(box);   // 상자 크기 → 캔버스 크기(역방향 없음 = 루프 없음)
}

      // ① 앉은 자리의 그늘 — 사람 밑이 어두워야 좌석에 '얹힌' 것으로 보인다(그늘은 안 흔들린다)
      c.fillStyle = 'rgba(16,12,9,0.42)';
      c.beginPath(); c.ellipse(sx, sy, w * 0.52, h * 0.10, 0, 0, 7); c.fill();
      // ② 몸통(옷)
      c.fillStyle = `rgba(${cr * sh | 0},${cg * sh | 0},${cb * sh | 0},0.95)`;
      c.beginPath(); c.ellipse(px0, py0 - hh * 0.30, w * 0.5, hh * 0.34, 0, 0, 7); c.fill();
      // ③ 머리 — 살빛은 옷보다 밝고 붉다. 이 대비가 '사람'을 만든다
      const sk = 0.9 + q0 * 0.5;
      c.fillStyle = `rgba(${124 * sk | 0},${96 * sk | 0},${76 * sk | 0},0.96)`;
      c.beginPath(); c.arc(px0 + sway * 0.6, py0 - hh * 0.70, hd, 0, 7); c.fill();
      // ④ 역광 림 — 태양이 뒤쪽(좌상)이라 왼쪽 어깨·정수리에만 얇게. 절반만 넣어 줄이 안 서게
      if (q1 < 0.5){
        c.fillStyle = 'rgba(236,206,158,0.42)';
        c.fillRect(px0 - w * 0.48, py0 - hh * 0.84, w * 0.30, Math.max(1, 1.4 * zoom));
      }
    }
  }
  c.restore();
}

// venue·날씨 색보정을 **로드 시 1회** 이미지에 입힌다. 프레임 루프는 무관하다.
// 결정 4에 따라 3D 베이크는 arena 한 벌뿐이고, 나머지 venue는 이 색보정으로 변주한다.
function paintArena(target, img, tilt, zoom){
  const c = target.getContext('2d');
  c.setTransform(1,0,0,1,0,0);
  c.clearRect(0,0,target.width,target.height);
  c.drawImage(img, 0, 0, target.width, target.height);
  // 관중은 여기서 굽지 않는다 — 매 프레임 그린다(§10.19). 구우면 움직일 수 없고,
  // 프레임마다 난수 순서가 달라 옷 색이 튄다.
  c.setTransform(1,0,0,1,0,0);
  for (const g of [VGRADE, WGRADE]){          // venue → 날씨 순으로 곱한다
    if (!g) continue;
    c.save(); c.globalCompositeOperation='multiply';
    c.fillStyle=g; c.fillRect(0,0,target.width,target.height); c.restore();
  }
  if (WHAZE){ c.fillStyle=WHAZE; c.fillRect(0,0,target.width,target.height); }
}
// 이미지가 늦게 와도 첫 프레임이 깨지지 않게 바탕을 미리 깔아둔다(무대 밖 어둠과 같은 색)
for (const t of [bgBasic, bgZoom]){

// 줌 경로 위의 프레임을 미리 구워 두면 부각이 연속으로 낮아지고 **크로스페이드 이중상이
// 사라진다.** 런타임 3D는 0 — 프레임 하나를 골라 drawImage 할 뿐이다.
// 프레임 f 는 tilt = TiltBasic + (TiltZoom−TiltBasic)·frac 로 구워졌으므로,

// 파일이 없으면 조용히 폴백한다 — 자산 없이도 뷰어는 돌아가야 한다.
const dolly = { frames: [], ready: false, want: 24 };
(function loadDolly(){
  let pending = dolly.want, failed = 0;
  for (let f = 0; f < dolly.want; f++){
    const im = new Image();
    const idx = f;
    im.onload = () => {
      // 주의: 캔버스는 **프레임 원본 크기**로 잡는다. mkbg()(1880×1056)를 24장 쓰면
      //   1880·1056·4·24 = 190 MB로 터진다. 940×528이면 45 MB.
      //   돌리 프레임은 줌이 구워져 있어 BGS 배율이 필요 없다 — 이미 확대된 그림이다.
      const c2 = document.createElement('canvas');
      c2.width = im.naturalWidth; c2.height = im.naturalHeight;
      const frac = idx / Math.max(1, dolly.want - 1);
      const fz = 1 + (ZoomFollow - 1) * frac;   // 이 프레임에 구워진 줌
      paintArena(c2, im, TiltBasic + (TiltZoom - TiltBasic) * frac, fz);
      dolly.frames[idx] = c2;
      if (--pending === 0 && failed === 0) dolly.ready = true;
    };
    im.onerror = () => { failed++; pending--; };   // 자산 없음 → 폴백 유지
    im.src = 'dolly_' + String(f).padStart(2, '0') + '.jpg';
  }
})();

function beep(freq, dur, type, vol, slide){
  if (!sndOn()) return;
  const t0=AC.currentTime, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide), t0+dur);
  g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0+dur);
}
function noiseHit(dur, vol, lo, hi){
  if (!sndOn()) return;
  const len=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(1-i/len);
  const src=AC.createBufferSource(); src.buffer=buf;
  const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=(lo+hi)/2; bp.Q.value=0.7;
  const g=AC.createGain(); g.gain.value=vol;
  src.connect(bp); bp.connect(g); g.connect(AC.destination); src.start();
}
function sfx(kind){
  switch(kind){
    case 'hit':   noiseHit(0.06,0.16,600,2500); beep(150,0.05,'triangle',0.10,-80); break;
    case 'crit':  noiseHit(0.10,0.22,900,4000); beep(320,0.12,'sawtooth',0.13,-200); break;
    case 'guard': beep(900,0.05,'square',0.07,300); break;                     // 금속성 챙
    case 'break': noiseHit(0.15,0.22,300,1500); beep(120,0.2,'sawtooth',0.15,-60); break;
    case 'down':  beep(90,0.25,'triangle',0.20,-50); noiseHit(0.2,0.13,100,500); break;
    case 'ko':    beep(70,0.5,'sawtooth',0.24,-40); noiseHit(0.4,0.26,80,600); break;
    case 'crowd': noiseHit(0.8,0.09,200,1200); break;                          // 함성 스웰
    case 'taunt': beep(500,0.1,'square',0.09,200); beep(660,0.1,'square',0.08,0); break;
  }
}
// 재생 t가 지나간 이벤트를 소리로 (스크럽 등 큰 점프는 무음 스킵)
function playSfxRange(t0, t1){
  lastSfxT = t1;
  if (!doc || !sndOn() || t1 - t0 > 1.0) return;
  for (const e of doc.Events){
    if (e.Time <= t0 || e.Time > t1) continue;
    switch(e.type){
      case 'HitLanded':   sfx(e.IsCrit ? 'crit' : e.IsGuarded ? 'guard' : 'hit'); break;
      case 'GuardBroken': case 'PoiseBroken': sfx('break'); break;
      case 'KnockedDown': sfx('down'); sfx('crowd'); break;
      case 'MatchEnded':  if (e.Reason === 'KO'){ sfx('ko'); sfx('crowd'); } break;
      case 'Decision':    if (e.ReasonTag === 'TAUNT') sfx('taunt'); break;
    }
  }
}

    for (const e of doc.Events) if (e.type === 'HitLanded' && !e.IsGuarded) koSlowT = e.Time;
    // 막판 결착(#15): 승자마저 빈사인 채 마지막 일격으로 갈렸다면 슬로모를 더 깊고 길게 (철권식 클러치 피니시)
    if (r.Winner >= 0){

      koClutch = ws && ws.HpRemainPct != null && ws.HpRemainPct <= 0.20;
    }
  }
}

// 이벤트 → 시간창 팝업 (스크럽해도 상태 무관하게 t로부터 재계산)
// 데미지 숫자는 한글 접두어 없이 색·크기·표식만으로 구분(치명/카운터/가드/묵직) — drawDamage가 렌더.
// 상태이상(다운·자세붕괴·가드파괴·탈진)은 떠다니는 글자 대신 롤식 아이콘 스트립(statuses)으로.
function buildPopups(){
  popups = []; decisions = []; statuses = [];
  for (const e of doc.Events){
    switch(e.type){
      case 'HitLanded':
        popups.push({t:e.Time, who:e.Defender, life:0.8, dmg:Math.round(e.Damage),
          crit:!!e.IsCrit, counter:!!e.IsCounter, guard:!!e.IsGuarded, armor:!!e.IsArmored}); break;
      case 'PoiseBroken':      statuses.push({t:e.Time, who:e.FighterId, kind:'poise'}); break;
      case 'GuardBroken':      statuses.push({t:e.Time, who:e.FighterId, kind:'guardbreak'}); break;
      case 'KnockedDown':      statuses.push({t:e.Time, who:e.FighterId, kind:'down'}); break;
      case 'StaminaExhausted': statuses.push({t:e.Time, who:e.FighterId, kind:'stam'}); break;
      case 'Decision': decisions.push({t:e.Time, who:e.FighterId,
          dur:Math.min(Math.max(e.Duration,0.9),2.5), tag:e.ReasonTag, layer:e.SourceLayer}); break;
    }
  }
  assignCutinLevels();
}
// 스킬 컷인 '층' 배정 — 뜰 때 비어 있는 가장 낮은 층을 잡고 사라질 때까지 그 자리를 지킨다.
// 시작 시각만으로 확정하므로 아래 컷인이 먼저 사라져도 위가 내려오지 않는다(그리고 t 무관 → 스크럽 안전).
function assignCutinLevels(){
  const cuts = decisions.filter(d => d.tag && /^(SKILL_|PASV_)/.test(d.tag));
  for (let i=0; i<cuts.length; i++){
    const d = cuts[i], occupied = new Set();
    for (let j=0; j<i; j++){                       // cuts는 이벤트(시간) 순 — j<i면 먼저 시작
      const o = cuts[j];
      if (o.who === d.who && d.t <= o.t + o.dur) occupied.add(o.lvl);   // 내가 뜰 때 아직 살아있다
    }
    let L=0; while (occupied.has(L)) L++;
    d.lvl = L;
  }
}
// 상태이상 표시 규격(발동만 있고 지속시간이 없어 표시용 고정 윈도우) + 카테고리색
const STATDUR = {down:1.6, poise:1.0, guardbreak:1.2, stam:1.6};
const STATCOL = {down:'#ff8a4a', poise:'#b7bfca', guardbreak:'#6fa8dc', stam:'#d9b15a', bleed:'#d0473b'};

// ── 하이라이트 모드: 임팩트 구간만 이어 재생 (조용한 대치는 점프) ──
let hlMode = SET.highlight === true, hlWins = [];
function buildHlWindows(){
  const raw = impacts.map(im=>[Math.max(0,im.t-1.0), im.t+0.9]);
  raw.push([Math.max(0,duration-2.5), duration]);   // 피니시는 항상 포함
  raw.sort((a,b)=>a[0]-b[0]);

  for (const w of raw){
    if (hlWins.length && w[0] <= hlWins[hlWins.length-1][1]+0.4) hlWins[hlWins.length-1][1] = Math.max(hlWins[hlWins.length-1][1], w[1]);
    else hlWins.push([...w]);
  }
}
function hlSkip(cur){   // 윈도우 밖이면 다음 윈도우 시작으로 (없으면 그대로)
  for (const w of hlWins){ if (cur < w[0]) return w[0]; if (cur <= w[1]) return cur; }

function setHl(on){ hlMode = on;

// 이벤트 → 임팩트(흔들림·스파크·히트스톱). t로부터 재계산 → 스크럽 안전.
function buildImpacts(){
  impacts = [];
  for (const e of doc.Events){
    if (e.type==='HitLanded'){
      let mag = Math.min(13, 3 + e.Damage*0.30);
      if (e.IsCrit) mag*=1.6; if (e.IsCounter) mag*=1.35;
      if (e.IsGuarded) mag*=0.30; if (e.IsArmored) mag*=0.45;
      // 약공격은 흔들림을 아주 미세하게만 — 가해자(Attacker)의 현재 스윙 종류로 판별
      const atkKind = e.Attacker===0 ? frameAt(e.Time).f.KindA : frameAt(e.Time).f.KindB;
      if (atkKind==='Light') mag = Math.min(mag, 2.2);
      const big = !e.IsGuarded && (e.IsCrit || e.IsCounter || e.Damage>=20);
      impacts.push({ t:e.Time, who:e.Defender, mag, kind: e.IsGuarded?'guard':'hit',
        col: e.IsGuarded?'#bcdcff': e.IsCrit?'#ff6b6b': e.IsCounter?'#ffe08a':'#fff2db',
        stop: big ? 0.07 : 0 });
    } else if (e.type==='KnockedDown'){
      impacts.push({ t:e.Time, who:e.FighterId, mag:13, kind:'down', col:'#ffb070', stop:0.13 });
    } else if (e.type==='GuardBroken'){
      impacts.push({ t:e.Time, who:e.FighterId, mag:9, kind:'hit', col:'#7fb8ff', stop:0.08 });
    } else if (e.type==='MatchEnded' && doc.Result.Winner>=0){
      impacts.push({ t:e.Time, who:1-doc.Result.Winner, mag:18, kind:'ko', col:'#ffffff', stop:0.22 });
    }
  }
  buildHlWindows();   // 하이라이트 구간 재계산
  setHl(hlMode);      // 버튼 상태 반영(설정 기본값 포함)
  // 혈흔 데칼 사전계산: 가드 안 된 묵직한 타격 → 피격자 위치의 바닥 얼룩 (impacts 파생 = 스크럽 안전)
  stains = [];
  for (const im of impacts){
    if (im.kind==='guard' || im.mag < 5) continue;
    const f0 = frameAt(im.t).f;
    const p = proj(im.who===0 ? f0.Ax : f0.Bx, im.who===0 ? f0.Ay : f0.By);
    stains.push({ t: im.t, x: p.x, y: p.y, r: 3 + im.mag*0.55, seed: (im.t*977|0)+1 });
    if (stains.length >= 60) break;
  }
  // 발자국·끌린 자국([15]§4 A4): 프레임에서 파생 → t 필터로 스크럽 안전(혈흔과 같은 규약).
  // 경기가 갈수록 모래가 밟힌다 = 살아있는 무대. 화면좌표가 아니라 월드좌표로 담는다 —
  // RY가 줌에 따라 변하므로(모드별 부각) 그릴 때 투영해야 어긋나지 않는다.
  tracks = [];
  // 보폭 0.55 m·상한 240으로 뽑으면 경기 말미에 자국이 카펫이 되고 프레임의 55%(2.9 ms)를 먹는다.
  // 성기게 뽑는 편이 보기에도 낫다 — 밟힌 자리가 읽혀야지 바닥이 갈려선 안 된다.
  const STEP = 0.9;    // m — 이 거리마다 한 발
  for (let who=0; who<2; who++){
    let lx=null, ly=null;
    for (let i=0;i<frames.length;i+=2){
      const f0=frames[i], wx=who===0?f0.Ax:f0.Bx, wy=who===0?f0.Ay:f0.By;
      if (lx===null){ lx=wx; ly=wy; continue; }
      if (Math.hypot(wx-lx, wy-ly) < STEP) continue;
      tracks.push({ t:f0.Time, wx, wy, a:Math.atan2(wy-ly, wx-lx) });
      lx=wx; ly=wy;
      if (tracks.length >= 150) break;
    }
  }
  tracks.sort((p0,q0)=>p0.t-q0.t);
}

// 피격 스프라이트 흰색 플래시 강도(0~1) — 최근 임팩트가 이 선수를 때렸으면 잠깐 하얘진다.
function hitFlashAt(who){
  let v=0;
  for (const im of impacts){ if (im.who!==who) continue;
    const age=t-im.t; if (age<0||age>0.13) continue;
    v=Math.max(v, (1-age/0.13)*(im.kind==='guard'?0.45:0.9)); }
  return v;
}

// 거리싸움 중 0.2s 의사결정 틱 사이의 미세 정지가 걷기↔정지 모션을 초당 3회씩 깜빡이게 한다("방정맞음").
// 짧은 Idle 블립(측정상 평균 0.13s)을 걷기로 메워 떨림을 흡수 — 진짜 멈춤(긴 Idle)만 정지 포즈로 떨군다.
// 스크럽 안전: t·frames로만 결정(무상태). 다리 케이던스는 buildWalkPhase가 정지 시 위상 동결로 처리.
const IDLE_BRIDGE = 0.28;  // 이보다 짧은 Idle 런은 걷기로 흡수
function smoothMoveState(who, rawSt){
  if (rawSt!=='Idle' || !frames) return rawSt;
  const F = frames, key = who===0 ? 'StateA' : 'StateB';
  let lo=0, hi=F.length-1;
  if (t<=F[0].Time) lo=0;
  else if (t>=F[hi].Time) lo=hi;
  else { while (lo+1<hi){ const m=(lo+hi)>>1; if (F[m].Time<=t) lo=m; else hi=m; } }
  if (F[lo][key]!=='Idle') return rawSt;
  let a=lo, b=lo;
  while (a>0 && F[a-1][key]==='Idle') a--;
  while (b<F.length-1 && F[b+1][key]==='Idle') b++;
  const runDur = (b<F.length-1 ? F[b+1].Time : F[b].Time) - F[a].Time;
  const before = a>0 ? F[a-1][key] : null;
  const after  = b<F.length-1 ? F[b+1][key] : null;
  // 짧은 블립이면서 걷기 사이에 낀 경우만 흡수(공격·피격 사이 정지는 그대로 둔다)
  if (runDur < IDLE_BRIDGE && (before==='Move' || after==='Move')) return 'Move';
  return rawSt;
}

// 공격(Windup→Active→Recovery)·피격(HitStun/Stagger) 연속 구간의 진행률(0~1)을 각 프레임에 미리 계산.
// 한 번 휘두르는 동안 스프라이트 시트를 한 번 재생(루프 없음)하기 위함.
function buildPhaseProgress(){
  const grpOf = s => (s==='Windup'||s==='Active'||s==='Recovery') ? 'atk'
                   : (s==='HitStun'||s==='Stagger') ? 'hurt' : null;
  for (const who of ['A','B']){
    let i=0;
    while (i<frames.length){
      const grp = grpOf(frames[i]['State'+who]);
      if (!grp){ frames[i]['_ph'+who]=null; i++; continue; }
      let j=i; while (j<frames.length && grpOf(frames[j]['State'+who])===grp) j++;
      const span=j-i;
      for (let m=i;m<j;m++) frames[m]['_ph'+who] = { grp, p: span<=1?0:(m-i)/(span-1) };
      i=j;
    }
  }
}

// 거리싸움 중 접근↔후퇴가 0.2s 틱마다 반복돼 앞걸음↔뒷걸음 모션이 뒤집혀 방정맞게 보임.
// 걷기 방향을 dwell 히스테리시스로 커밋: 분명한 순변위(>DEAD)가 최소 DWELL초 이상 지속될 때만 전환.
// 프레임별로 미리 계산(스크럽 안전·무상태). 계측: 전술가 방향전환 1.7/s → 0.4/s.
function buildWalkDir(){
  const F=frames; if(!F.length) return;
  const fps = F.length>1 ? (F.length-1)/(F[F.length-1].Time-F[0].Time) : 15;
  const Wf = Math.max(1, Math.round(0.18*fps));   // 순변위 측정 창(프레임)
  const DEAD=0.15, DWELL=0.55;                     // 전환 임계 순변위(m) / 최소 커밋(s)
  for (const who of ['A','B']){
    const px = who==='A'?'Ax':'Bx', ox = who==='A'?'Bx':'Ax', out='_wdir'+who;
    let dir=1, heldT=-99;
    for (let i=0;i<F.length;i++){
      const t=F[i].Time;
      const lo=Math.max(0,i-Wf), hi=Math.min(F.length-1,i+Wf);
      // 그려진 facing(_faceA, 히스테리시스)과 일치하는 방향 — 즉석 (ox-px)를 쓰면 미세 교차마다 fwd/bwd가
      // 뒤집혀 후퇴 중인데 forward walk가 나온다. A는 _faceA, B는 -_faceA(faceB).
      const face = who==='A' ? F[i]._faceA : -F[i]._faceA;
      const net = F[hi][px]-F[lo][px];                 // 창 내 순수평변위
      const inst = Math.abs(net)>DEAD ? ((net*face)>=0?1:-1) : 0;  // +1=전진(상대쪽) -1=후퇴 0=모호
      if (inst!==0 && inst!==dir && (t-heldT)>=DWELL){ dir=inst; heldT=t; }
      F[i][out]=dir;
    }
  }
}

// 걷기 다리 위상을 누적으로 미리 계산. floor(시간×dynFps)는 dynFps가 프레임마다 출렁이면(접전 직후
// 풀스피드 이탈 등 velMs 급변) 비단조가 돼 프레임이 앞뒤로 튄다(43s대 "빠른 반복" 버그의 원인).
// 누적(위상 += dt×fps)은 항상 단조증가 → 역행 불가. 속도는 2D 실이동(ΔBx만 쓰면 대각이동 과소평가).
// 정지 구간은 위상 동결 → 다리 멈춤. fps·baseSpeed는 walk_fwd/bwd 시트값(10 / 2.0)과 일치.
function buildWalkPhase(){
  const F=frames; if(!F.length) return;
  const FPS=10, BASE=2.0, MINF=4, MAXF=24, SMW=3;  // SMW: 다리 케이던스 속도 평활 창(±프레임 ≈ ±0.2s)
  for (const who of ['A','B']){
    const px=who==='A'?'Ax':'Bx', py=who==='A'?'Ay':'By', out='_wph'+who;
    // 프레임별 순간속도(2D 실이동)
    const sp=new Array(F.length).fill(0);
    for (let i=1;i<F.length;i++){ const dt=F[i].Time-F[i-1].Time;
      sp[i] = dt>0 ? Math.hypot(F[i][px]-F[i-1][px], F[i][py]-F[i-1][py])/dt : 0; }
    // 다리 케이던스를 '이동평균 속도'로 구동: 추격 중 두 선수가 0.2s씩 번갈아 치고나가/멈추는(풀스피드↔정지)
    // 패턴을 평균내 다리가 '멈췄다-빨라졌다'(풋 스케이팅) 하지 않고 매끄럽게 걷게 한다. 몸은 클램프로 등속 활주 →
    // 둘이 나란히 걸어가는 모양. 진짜 정지(clinch 등 긴 0)는 창 전체가 0이라 그대로 다리 멈춤.
    let ph=0; F[0][out]=0;
    for (let i=1;i<F.length;i++){
      let acc=0,n=0; for (let j=Math.max(1,i-SMW); j<=Math.min(F.length-1,i+SMW); j++){ acc+=sp[j]; n++; }
      const s=acc/n;
      const dt=F[i].Time-F[i-1].Time;
      const fps = s>0.15 ? Math.max(MINF, Math.min(MAXF, FPS*s/BASE)) : 0;  // 진짜 정지=위상 동결
      ph += dt*fps;
      F[i][out]=ph;
    }
  }
}

// 좌우 위치·바라보기 히스테리시스(연출 전용 — sim 위치·승패 무변경, 스크럽 안전): 동속 락스텝(추격-후퇴 동시
// 슬라이드)에서 두 선수의 X가 0.2s 틱마다 미세 교차하면 facing(좌우 미러)과 화면 좌우배치가 매번 뒤집혀
// "자리가 계속 바뀐다"로 보인다. X차가 데드밴드(DEAD)를 넘어 DWELL초 이상 지속될 때만 좌우 관계를 전환 →
// 미세 교차는 무시. +1 = A가 좌(상대가 우), faceB = -faceA. (buildWalkDir의 dwell 방식과 동일)
function buildFacing(){
  const F=frames; if(!F.length) return;
  const DEAD=0.22, DWELL=0.45, TURN=0.60;   // 데드밴드(m) / 최소 커밋(s) / 좌우 교차 이징 길이(s)
  let face = (F[0].Bx - F[0].Ax) >= 0 ? 1 : -1, heldT = -99;
  const flips=[];
  for (let i=0;i<F.length;i++){
    const dx = F[i].Bx - F[i].Ax;                            // +면 B가 A의 오른쪽
    const want = Math.abs(dx) > DEAD ? (dx>=0?1:-1) : face;  // 데드밴드 안이면 현 상태 유지 (위치 충실 — 접촉 동결 없음)
    if (want !== face && (F[i].Time - heldT) >= DWELL){ face = want; heldT = F[i].Time; flips.push({t:F[i].Time, to:face}); }
    F[i]._faceA = face;
  }
  // _faceLerp: 클램프 좌우순서를 즉석 ±1 대신 전환 ±TURN/2에서 old→0→new로 이징한다. 화면 분리가 0을 거쳐
  // 반대로 벌어져 두 선수가 '걸어서 자리를 바꾸는' 교차가 됨(13s 65px 순간이동 방지). 스프라이트 미러는 즉석 _faceA.
  const h=TURN/2;
  for (let i=0;i<F.length;i++){
    let lerp = F[i]._faceA;
    for (const fl of flips){ const d=F[i].Time-fl.t;
      if (d>=-h && d<=h){ lerp = Math.max(-1, Math.min(1, d/h)) * fl.to; break; } }
    F[i]._faceLerp = lerp;
  }
}

// 밀착 교착 연출(연출 전용 — sim 위치·승패 무변경, 스크럽 안전): 카운터 매치업의 간격 싸움은 sim상 정상이나,
// 충돌 핀(0.8m)에서 양쪽이 거의 안 움직이며 milling(Move/Idle)을 반복하면 '제자리 비비기'(걷기 모션만 헛돔)로 보인다.
// 근접(gap≤GAP) + 양쪽 실이동 속도 거의 0(≤SPD) + 공격 없음을 MIN초 이상 지속하는 '얼어붙은 핀'만 대치로 표시 →
// 렌더에서 걷기 대신 idle 스탠스로 그린다. 실제로 선회 이동(16~18s처럼 ~1m 이동) 중이면 SPD를 넘어 걷기 애니 유지.
function buildClinch(){
  const F=frames; if(!F.length) return;
  const GAP=1.35, MIN=0.45, SPD=0.25;   // 근접(m) / 최소 지속(s) / 정지로 볼 속도(m/s). GAP는 충돌 최소거리(2×CollisionRadius=1.2) 위로 — 핀 프레임이 걷기 대신 idle로
  const mill = s => s==='Move' || s==='Idle';   // 공격·피격·다운·가드가 아닌 '간 보는' 상태
  const gapAt = i => Math.hypot(F[i].Bx-F[i].Ax, F[i].By-F[i].Ay);
  const spd = (i,px,py) => { const a = i>0 ? i-1 : 0, b = i>0 ? i : 1;
    if (b>=F.length) return 0; const dt=F[b].Time-F[a].Time;
    return dt>0 ? Math.hypot(F[b][px]-F[a][px], F[b][py]-F[a][py])/dt : 0; };
  const pinned = i => mill(F[i].StateA) && mill(F[i].StateB) && gapAt(i)<=GAP
                   && spd(i,'Ax','Ay')<SPD && spd(i,'Bx','By')<SPD;
  let i=0;
  while (i<F.length){
    if (!pinned(i)){ F[i]._clinch=false; i++; continue; }
    let j=i; while (j<F.length && pinned(j)) j++;
    const dur=(j<F.length?F[j].Time:F[j-1].Time)-F[i].Time;
    const val = dur>=MIN;   // 짧은 정지(<MIN)는 실제 교전 흐름 → 그대로 둔다
    for (let m=i;m<j;m++) F[m]._clinch=val;
    i=j;
  }
}

// ── 프레임 조회 (시간 정렬 이진 탐색 + 위치 보간) ──
function frameAt(time){
  const F = frames; let lo=0, hi=F.length-1;
  if (time <= F[0].Time) return {f:F[0], g:F[0], k:0};
  if (time >= F[hi].Time) return {f:F[hi], g:F[hi], k:0};
  while (lo+1 < hi){ const m=(lo+hi)>>1; if (F[m].Time <= time) lo=m; else hi=m; }
  const a=F[lo], b=F[hi], span=b.Time-a.Time;
  return {f:a, g:b, k: span>0 ? (time-a.Time)/span : 0};
}
// 카메라 노브(CamHeight/CamTilt)와 CX/CY/RX/RY는 배경 프리렌더보다 먼저 필요해 상단으로 옮겼다. [15]§2.3
const R = () => doc.Meta.ArenaRadius;
const proj = (sx, sy) => ({ x: CX + (sx/R())*RX, y: CY + (sy/R())*RY });
const mPx = () => RX/R();              // 가로 m→px
const depthN = sy => (sy/R()+1)/2;     // 0 뒤 ~ 1 앞 (원근·정렬)
// 근접 간격 가독성: 화면 x간격 g(px)를 비선형으로 벌려 표시 — 겹침 방지(근접일수록 +OFF로 띄움) +
// 차이 보존(0.9m·1.1m가 구분됨). 멀면(≥TAPER) 실제 그대로. 옛 하드클램프(모든 근접을 65px로 납작)를 대체.
// 1.8m(≈60px)에서 표시 간격이 캐릭터 키(스프라이트 120px)와 비슷해지도록: gapShow(60)≈120.
const GAP_OFF = 85, GAP_TAPER = 200;   // 띄움량 / 0으로 수렴하는 간격(px) — 과장 강도 조절 노브
const gapShow = g => g + GAP_OFF*Math.max(0, 1 - g/GAP_TAPER);

function poseColor(state){
  if (state==='Guard') return '#6fa8dc';
  if (state==='Stagger'||state==='HitStun'||state==='Down'||state==='GetUp') return '#9aa3af';
  if (state==='Taunt') return '#ffd24a';
  return null;
}

// ── 스프라이트 시스템 (M4-b): sprites/sprites.json + PNG 시트가 있으면 실루엣 대신 그림을 그린다.
//    상태(12종) → 포즈(8종) 매핑. 시트는 오른쪽 향함 기준, 발(바닥)이 앵커. 없으면 실루엣 폴백.
// 무기별 시트(M4-b 확장): 선수마다 무기 ID로 다른 외형. sprites/<무기ID>.json 있으면 그걸, 없으면 공유 sprites.json.
let defaultSprite = null;     // sprites.json (공유 폴백)
const spriteSets = {};        // 무기ID → 스프라이트 세트 (시도 후 캐시; 없으면 defaultSprite)
function spriteFor(weapon){ return spriteSets[weapon] || defaultSprite; }
// 상태(+스윙 종류) → 9포즈. 강공은 예비(텔레그래프)와 타격이 갈린다 — 수싸움 가독성의 핵심.
function poseFor(state, kind){
  const heavy = kind==='Heavy';
  switch(state){
    case 'Move': case 'Dodge': return 'walk';
    case 'Guard': return 'guard';
    case 'Windup': return heavy?'heavy_windup':'light_attack';
    case 'Active': case 'Recovery': return heavy?'heavy_attack':'light_attack';
    case 'HitStun': case 'Stagger': return 'hurt';
    case 'Down': case 'GetUp': return 'down';
    case 'Taunt': return 'taunt';
    default: return 'idle';
  }
}
// 시트 한 세트 로드 (정적 포즈 + 애니). 실패 시 null → 호출부에서 폴백 결정.
async function loadSpriteSet(jsonFile){
  try{
    const cfg = await (await fetch('sprites/'+jsonFile+'?'+Date.now())).json();
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src='sprites/'+cfg.image; });
    // 애니메이션 시트 로드 (이미지 중복 없이 캐시)
    const anims = {}, imgCache = {};
    for (const [name, a] of Object.entries(cfg.animations||{})){
      if (!imgCache[a.image]){
        const ai = new Image();
        await new Promise((res,rej)=>{ ai.onload=res; ai.onerror=rej; ai.src='sprites/'+a.image; });
        imgCache[a.image] = ai;
      }
      // holds: 프레임별 지속 가중치(선택). 특정 포즈(임팩트 프레임 등)를 더 오래 유지하려 비균등 타이밍 부여.
      const holds = Array.isArray(a.holds) && a.holds.length===a.frames.length ? a.holds : null;
      anims[name] = { img: imgCache[a.image], fps: a.fps||12, frames: a.frames, refH: a.refH, baseSpeed: a.baseSpeed||0,
                      holds, holdTot: holds ? holds.reduce((s,x)=>s+x,0) : 0 };
    }
    return { img, frames: cfg.frames, srcFlip: cfg.facing === 'left', anims };
  }catch(e){ return null; } // 시트 없음
}
// 공유 기본 시트 로드 (sprites.json). 없으면 실루엣 폴백.
async function loadDefaultSprites(){ defaultSprite = await loadSpriteSet(SHEET); }
// 두 선수 무기의 전용 시트 확보. 무기 ID당 한 번만 시도하고, 없으면 기본 시트로 폴백 등록.
async function ensureWeaponSprites(weapons){
  for (const w of weapons){
    if (!w || w in spriteSets) continue;
    spriteSets[w] = (await loadSpriteSet(w + '.json')) || defaultSprite;
  }
}
// 바닥 장식 (사거리 링 + 그림자 + 팀색 글로우) — 스프라이트 경로용 (실루엣은 자체 보유)
function drawGround(fx, fy, scale, reach, col){
  ctx.save(); ctx.globalAlpha=.20; ctx.fillStyle=col;       // 팀색 글로우 (같은 시트라도 구분)
  ctx.beginPath(); ctx.ellipse(fx, fy, 16*scale, 6*scale, 0,0,7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha=.18; ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(fx, fy, reach*mPx(), reach*mPx()*(RY/RX), 0,0,7); ctx.stroke(); ctx.restore();
  // 접지 그림자([15]§9 결정4 대체안): 발밑 정원이 아니라 빛 반대쪽(우하)으로 눕는다.
  // 고도 41°라 그림자가 길다 — 장축을 방위각에 맞추고 그만큼 늘린다.
  ctx.save(); ctx.globalAlpha=.3; ctx.fillStyle='#000';
  ctx.translate(fx - LDIR.x*5*scale, fy - LDIR.y*5*scale);
  ctx.rotate(Math.atan2(-LDIR.y, -LDIR.x));
  ctx.beginPath(); ctx.ellipse(0, 0, 13*scale, 4*scale, 0,0,7); ctx.fill(); ctx.restore();
}
function drawSprite(spr, fx, fy, scale, state, kind, facing, velX, who, velMs, ph, flash, walkDir, walkPhase){
  // 상태별 다중프레임 애니 선택 (이동·공격·피격). 없으면 정적 포즈 폴백.
  let anim = null;
  if (spr.anims){
    if (state==='Move'||state==='Dodge'){
      // 걷기 방향: dwell 히스테리시스로 커밋된 _wdir(전진+1/후퇴-1, facing 반영됨) 사용 — 앞↔뒤 떨림 방지.
      const fwd = (walkDir!=null) ? walkDir>0 : (velX===0 ? true : (velX*facing)>0);
      if (state==='Move') anim = fwd ? spr.anims.walk_fwd : spr.anims.walk_bwd;
      else                anim = spr.anims.dash_bwd; // Dodge = 뒷회피 고정 (앞대쉬는 추후 Dash 기능용)
    } else if (state==='Windup'||state==='Active'||state==='Recovery'){
      anim = kind==='Heavy' ? spr.anims.heavy_attack : spr.anims.light_attack;
    } else if (state==='HitStun'||state==='Stagger'){
      anim = state==='Stagger' ? spr.anims.hurt_heavy : spr.anims.hurt_light; // 자세붕괴=강피격
    } else {
      // 정지 계열(대기·방어·도발·다운)도 애니가 있으면 쓴다 — 호흡·가드 흔들림이 살아난다.
      // 없으면 아래 정적 포즈로 조용히 폴백(옛 손그림 시트 호환).
      anim = spr.anims[poseFor(state, kind)] || null;
    }
  }
  // 걷기 위상은 이동 상태에서만 의미가 있다. 정지 계열에 그대로 넘기면 위상이 안 늘어 프레임이 얼어붙는다.
  const moving = (state==='Move'||state==='Dodge');
  if (!moving) walkPhase = null;
  // 다운은 반복 재생하면 시체가 계속 쓰러진다 — 마지막(무너진) 프레임에서 정지.
  const holdLast = (state==='Down'||state==='GetUp');
  let fr, srcImg;
  if (anim?.frames?.length){
    let fi;
    if (holdLast){
      fi = anim.frames.length - 1;   // 쓰러진 마지막 자세로 정지
    } else if (ph && ph.grp){
      // 공격/피격: 구간 진행률로 시트를 한 번 재생 (루프 없음). holds 있으면 프레임별 가중 타이밍(임팩트 포즈 유지).
      if (anim.holds){
        const target = ph.p * anim.holdTot; let acc=0, idx=0;
        for (idx=0; idx<anim.holds.length; idx++){ acc+=anim.holds[idx]; if (target < acc) break; }
        fi = Math.min(anim.frames.length-1, idx);
      } else {
        fi = Math.min(anim.frames.length-1, Math.max(0, Math.round(ph.p*(anim.frames.length-1))));
      }
    } else if (walkPhase!=null){
      // 이동: 누적 걷기 위상(buildWalkPhase, 단조증가) → 프레임 역행 없음. 정지 시 위상 동결=다리 멈춤.
      fi = Math.floor(walkPhase) % anim.frames.length;
    } else {
      // 폴백(구 json): 속도 연동 fps 루프 — 위상 비연속이라 프레임 튐 가능
      const dynFps = (anim.baseSpeed>0 && velMs>0.1)
        ? Math.max(4, Math.min(24, anim.fps * velMs / anim.baseSpeed))
        : (anim.fps||12);
      fi = Math.floor((t + who*0.4) * dynFps) % anim.frames.length;
    }
    fr = anim.frames[fi]; srcImg = anim.img;
  } else {
    fr = spr.frames[poseFor(state,kind)] || spr.frames.idle; srcImg = spr.img;
  }
  if(!fr) return false;
  // refH(직립 환산 키) 우선순위: 애니 > 포즈별 > idle. 화면 키 일관성의 핵심.
  const refH = (anim?.refH) || fr.refH || spr.frames.idle.h;
  const k = (FIGH*scale)/refH;
  const w = fr.w*k, h = fr.h*k;
  const flip = (facing<0) !== spr.srcFlip;
  ctx.save(); ctx.translate(fx, fy); if(flip) ctx.scale(-1,1);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(srcImg, fr.x,fr.y,fr.w,fr.h, -w/2, -h, w, h);
  // 림라이트([15]§9 결정4 대체안 · A4): 스프라이트 노멀맵 대신 이걸 쓴다.
  // 실루엣을 빛 반대쪽으로 밀어 지우면 광원 쪽 가장자리만 초승달로 남는다.
  // ※ 이 컨텍스트는 facing에 따라 좌우 반전돼 있다 — 밀어내는 방향의 x를 로컬 기준으로 뒤집어야
  //   왼쪽을 볼 때 림이 반대편에 붙지 않는다.
  {
    const iw2=Math.max(1,Math.ceil(w)), ih2=Math.max(1,Math.ceil(h));
    _rcv.width=iw2; _rcv.height=ih2;                       // 크기 재설정 = 클리어
    _rctx.drawImage(srcImg, fr.x,fr.y,fr.w,fr.h, 0,0, w,h);
    _rctx.globalCompositeOperation='destination-out';
    _rctx.drawImage(srcImg, fr.x,fr.y,fr.w,fr.h,
      (flip? LDIR.x : -LDIR.x)*RIMPX, -LDIR.y*RIMPX, w,h);
    _rctx.globalCompositeOperation='source-in';
    _rctx.fillStyle=RIMCOL; _rctx.fillRect(0,0,iw2,ih2);
    _rctx.globalCompositeOperation='source-over';
    ctx.drawImage(_rcv, -w/2,-h, w, h);
  }
  // 피격 흰색 플래시: 오프스크린에 스프라이트만 그려 거기서 source-atop(스프라이트 픽셀=유일한 목적지) →
  // 실루엣 내부만 하얘진다. 본 캔버스에서 직접 하면 바닥까지 덮여 박스로 번짐.
  if (flash>0){
    const iw=Math.max(1,Math.ceil(w)), ih=Math.max(1,Math.ceil(h));
    _fcv.width=iw; _fcv.height=ih;            // 크기 재설정 = 클리어
    _fctx.drawImage(srcImg, fr.x,fr.y,fr.w,fr.h, 0,0, w, h);

  CHARGE:'bolt', FLURRY:'swords', MIRAGE:'eye', SMASH:'impact', EXECUTE:'skull',
  ENTANGLE:'lock', ZONELOCK:'target', SHIELDBASH:'shield', GUARDSTANCE:'shield',
  REACHPUSH:'target', LASH:'bolt', CARRY:'fist', WALLSLAM:'impact',
  COMPOSE:'mind', READ:'eye', FERVOR:'flame', LASTSTAND:'heart', LEISURE:'wine',
  IMPERIAL:'crown', FAIRFIGHT:'handshake', CHIVALRY:'dove', SURVIVE:'heart',
  BACKSTAB:'blood', CROWD:'laurel', SHOWTIME:'masks', EXPLOIT:'search',
  VULTURE:'skull', BLOODLUST:'blood', TERROR:'skull', NERVE:'star',
  COMEBACK:'star', GUARDED:'shield', FORESEE:'eye' };

// ── 스킬 쿨타임은 **이벤트에서 역산한다**([15]§10.26) ──────────────────────────
// 프레임마다 쿨 잔량을 실어 보내면 프레임 1400장 × 슬롯 수만큼 JSON이 불어난다.
// 발동은 이미 Decision("SKILL_"/"PASV_"+태그)로 나가고 있고 쿨타임 초는 정적이다 —
// 마지막 발동 시각만 알면 t에서 바로 계산된다. 스크럽에도 자동으로 안전하다.
let skillUses = [{}, {}];
function buildSkillUses(){
  skillUses = [{}, {}];
  for (const d of decisions){
    const m = /^(?:SKILL|PASV)_(.+)$/.exec(d.tag || '');
    if (!m) continue;
    (skillUses[d.who][m[1]] || (skillUses[d.who][m[1]] = [])).push(d.t);
  }
}
function readyFrac(who, tag, cd){          // 1 = 준비 완료, 0 = 방금 씀
  if (!(cd > 0)) return 1;
  const arr = skillUses[who] && skillUses[who][tag];
  if (!arr) return 1;
  for (let i = arr.length - 1; i >= 0; i--)
    if (arr[i] <= t) return Math.min(1, (t - arr[i]) / cd);
  return 1;
}

// ── 섀시는 **한 번만 굽는다**([15]§10.25) ────────────────────────────────────
// 판·테두리·메달리온·이름은 경기 내내 안 변한다. 그런데 그림자(shadowBlur)는 프레임마다
// 다시 흐려진다 — 실측 **프레임당 12.2 ms**, 전체 비용의 대부분이었다.
// 정적인 부분을 오프스크린에 한 번 굽고 매 프레임 drawImage 한 장으로 얹는다.
// ── 하단 HUD([15]§10.26) — 대칭 대형 바 두 개는 **90년대 격투 게임의 문법**이다 ──
// 현대 액션 RPG는 다르게 짠다: 초상 하나로 정체성을 못박고, 자원 바는 길이를 달리해
// 층으로 쌓고, 그 아래 장비·스킬을 아이콘 행으로 늘어놓는다. 시간은 화면 중앙 하단에 둔다.
// 좌우 대칭 거대 바는 "누가 이기고 있나"만 말하지만, 이 구성은 "지금 무엇을 쓸 수 있나"까지 말한다.
const HUD_BY = H - 92;            // 선수 블록 상단
function diamond(cx, cy, r){
  ctx.beginPath();
  ctx.moveTo(cx, cy - r); ctx.lineTo(cx + r, cy); ctx.lineTo(cx, cy + r); ctx.lineTo(cx - r, cy);
  ctx.closePath();
}
// 초상 — 스프라이트 idle 프레임의 **머리 부근만** 잘라 쓴다.
// 스프라이트가 확정되면 그 시트가 그대로 초상이 된다(따로 그릴 필요가 없다).
// 아직 없으면 머리글자로 폴백한다 — 자산 없이도 HUD는 돌아가야 한다.
// 머리 상자를 **알파에서 자동 검출한다**. 좌표를 박아두면 스프라이트가 바뀔 때마다 다시 맞춰야 하는데,
// 라니스타 지시대로 시트는 아직 확정 전이다. 프레임 상단 45%의 불투명 경계상자를 잡아
// 어깨가 조금 걸리도록 1.5배 정사각으로 넓힌다. 세트당 한 번만 계산하고 캐시한다.
function headBox(spr){
  if (spr._head !== undefined) return spr._head;
  const fr = spr && spr.frames && spr.frames.idle;
  if (!fr || !spr.img || !spr.img.complete || !spr.img.naturalWidth) return null;   // 아직 — 다음에 다시
  const hh = Math.round(fr.h * 0.45);
  const c2 = document.createElement('canvas'); c2.width = fr.w; c2.height = hh;
  const x2 = c2.getContext('2d');
  x2.drawImage(spr.img, fr.x, fr.y, fr.w, hh, 0, 0, fr.w, hh);
  const d = x2.getImageData(0, 0, fr.w, hh).data;
  // **맨 위 픽셀 = 머리가 아니다.** 이 시트는 무기를 세워 들고 있어서 최상단이 칼끝이다.
  // 얇은 무기와 머리를 가르는 것은 폭이 아니라 **행별 불투명 픽셀 수**다 —
  // 칼날은 행당 몇 px, 머리는 행당 프레임 폭의 15% 안팎이 찍힌다.
  const need = Math.max(3, fr.w * 0.13);
  let minY = -1;
  for (let y = 0; y < hh && minY < 0; y++){
    let n = 0;
    for (let x = 0; x < fr.w; x++) if (d[(y * fr.w + x) * 4 + 3] > 40) n++;
    if (n >= need) minY = y;
  }
  if (minY < 0) return (spr._head = null);
  // 가로 중심은 머리 높이의 행에서만 잡는다(뻗은 팔·무기가 중심을 끌고 가지 않도록)
  const headRows = Math.max(4, Math.round(fr.h * 0.08));
  let minX = 1e9, maxX = -1;
  for (let y = minY; y < Math.min(hh, minY + headRows); y++)
    for (let x = 0; x < fr.w; x++) if (d[(y * fr.w + x) * 4 + 3] > 40){
      if (x < minX) minX = x; if (x > maxX) maxX = x;
    }
  if (maxX < 0) return (spr._head = null);
  const side = Math.min(hh, fr.h * 0.30);        // 머리~어깨가 들어가는 정사각
  const cxl = (minX + maxX) / 2;
  return (spr._head = { x: fr.x + Math.max(0, Math.min(fr.w - side, cxl - side / 2)),
                        y: fr.y + Math.max(0, minY - fr.h * 0.035), s: side });
}
function drawPortrait(cx, cy, r, spr, name, col, flip){
  ctx.save();
  diamond(cx, cy, r); ctx.clip();
  // 배경은 순검정이 아니라 **따뜻한 돌빛 그러데이션**이다. 검투사 스프라이트가 어두워서
  // 검정 위에 얹으면 실루엣이 안 갈린다 — 초판이 새까맣게 보인 이유가 이것이었다.
  const bg = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  bg.addColorStop(0, 'rgba(74,58,40,0.96)'); bg.addColorStop(1, 'rgba(16,11,7,0.96)');
  ctx.fillStyle = bg; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  const rg = ctx.createRadialGradient(cx, cy + r * 0.2, 2, cx, cy, r * 1.2);
  rg.addColorStop(0, col + '55'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = rg; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  const hb = headBox(spr);
  if (hb){
    ctx.save();
    if (flip){ ctx.translate(cx * 2, 0); ctx.scale(-1, 1); }
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(spr.img, hb.x, hb.y, hb.s, hb.s, cx - r * 1.05, cy - r * 1.05, r * 2.1, r * 2.1);
    ctx.restore();
  } else {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '900 ' + Math.round(r * 0.95) + 'px ' + getCSS('--font-display');
    ctx.fillStyle = '#e6dcc6'; ctx.fillText([...name][0] || '?', cx, cy + 1);
    ctx.textBaseline = 'alphabetic';
  }
  ctx.restore();
  // 테두리 두 겹 — 청동 바깥 + 진영색 안쪽
  ctx.lineWidth = 2.5; ctx.strokeStyle = getCSS('--bronze'); diamond(cx, cy, r); ctx.stroke();
  ctx.lineWidth = 1;   ctx.strokeStyle = col; ctx.globalAlpha = 0.8;
  diamond(cx, cy, r - 3.5); ctx.stroke(); ctx.globalAlpha = 1;
}
// 아이콘 칸. ready<1이면 **12시부터 시계방향으로** 밝은 부채꼴이 차오른다 = 쿨타임 진행.
function iconSlot(x, y, sz, id, col, ready, hot){
  ctx.fillStyle = 'rgba(8,6,4,0.85)'; roundRect(x, y, sz, sz, 3); ctx.fill();
  ctx.strokeStyle = ready >= 1 ? getCSS('--gold-deep') : 'rgba(120,100,70,0.5)';
  ctx.lineWidth = 1; roundRect(x + 0.5, y + 0.5, sz - 1, sz - 1, 3); ctx.stroke();
  const im = iconImg(id, col);
  if (!im || !im.complete || !im.naturalWidth) return;
  const p = 3, s = sz - p * 2;
  if (ready >= 1){
    ctx.globalAlpha = 1; ctx.drawImage(im, x + p, y + p, s, s);
    if (hot){                                     // 방금 발동 — 금빛 테두리로 알린다
      ctx.strokeStyle = getCSS('--gold'); ctx.lineWidth = 1.5;
      roundRect(x - 1, y - 1, sz + 2, sz + 2, 4); ctx.stroke();
    }
    return;
  }
  ctx.globalAlpha = 0.26; ctx.drawImage(im, x + p, y + p, s, s);   // 식은 상태
  ctx.save();                                                      // 차오른 만큼만 밝게
  ctx.beginPath();
  ctx.moveTo(x + sz / 2, y + sz / 2);
  ctx.arc(x + sz / 2, y + sz / 2, sz, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * ready);
  ctx.closePath(); ctx.clip();
  ctx.globalAlpha = 1; ctx.drawImage(im, x + p, y + p, s, s);
  ctx.restore();
  ctx.globalAlpha = 1;
}
function fighterPlate(ox, dir, s){
  // ox = 화면 바깥쪽 x · dir = +1이면 내용이 오른쪽으로 자란다(A), −1이면 왼쪽(B)
  const BY = HUD_BY, sk = SK * dir;
  const X = (x0, w) => dir > 0 ? ox + x0 : ox - x0 - w;
  const BX = 76, HPW = 224, STW = 206, GDW = 188;   // 길이를 달리해 층을 만든다(위계 = 크기)
  const crit = s.hp > 0 && s.hp < 0.25;
  const pulse = 0.6 + 0.4 * Math.sin(t * 6.0);

  drawPortrait(X(0, 64) + 32, BY + 30, 31, s.spr, s.name, s.col, dir < 0);

  // 이름 — 바 위 한 줄. 로마 비문체에 자간을 벌린다
  ctx.textAlign = dir > 0 ? 'left' : 'right';
  ctx.font = '700 12px ' + getCSS('--font-display');
  if (ctx.letterSpacing !== undefined) ctx.letterSpacing = '1.6px';
  ctx.fillStyle = '#e6dcc6';
  // 긴 이름은 바 폭을 넘어 중앙 시계까지 밀고 들어온다 — 넘치면 자른다
  let nm = s.name;
  while (nm.length > 3 && ctx.measureText(nm).width > HPW - 26) nm = nm.slice(0, -1);
  ctx.fillText(nm === s.name ? nm : nm + '…', dir > 0 ? ox + BX : ox - BX, BY + 2);
  ctx.letterSpacing = '0px';

  // HP — 홈 → 잔상 → 현재 → 새김선 → 베벨
  const hx = X(BX, HPW), hy = BY + 8, hh = 14;
  slot(hx, hy, HPW, hh, sk);
  const ghost = Math.max(0, Math.min(1, s.ghost));
  if (ghost > s.hp + 0.002) skewFill(hx, hy, HPW, hh, sk, ghost, 'rgba(255,231,196,0.58)', dir > 0);
  const gr = ctx.createLinearGradient(0, hy, 0, hy + hh);
  gr.addColorStop(0, s.col); gr.addColorStop(1, s.colDeep);
  skewFill(hx, hy, HPW, hh, sk, s.hp, gr, dir > 0);
  ctx.save(); skewPath(hx, hy, HPW, hh, sk); ctx.clip();
  ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1;
  for (let i = 1; i < 4; i++){ const gx = hx + HPW * i / 4;
    ctx.beginPath(); ctx.moveTo(gx + sk, hy); ctx.lineTo(gx, hy + hh); ctx.stroke(); }
  ctx.restore();
  bevel(hx, hy, HPW, hh, sk);
  if (crit){                                   // 위급 — 3겹 테두리 맥동(shadowBlur 없이)
    ctx.strokeStyle = getCSS('--blood-bright');
    for (let i = 0; i < 3; i++){
      ctx.lineWidth = 1.5; ctx.globalAlpha = pulse * (0.55 - i * 0.16);
      skewPath(hx - 1 - i * 1.6, hy - 1 - i * 1.6, HPW + 2 + i * 3.2, hh + 2 + i * 3.2, sk); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // 스태미나 · 가드 — 조금씩 짧아진다. 길이가 다르면 '같은 것이 아니다'라는 뜻이 된다
  const ssk = sk * 0.5;
  const sy1 = hy + hh + 4, sy2 = sy1 + 11;
  slot(X(BX, STW), sy1, STW, 8, ssk);
  skewFill(X(BX, STW), sy1, STW, 8, ssk, s.st, '#d8a23c', dir > 0);
  slot(X(BX, GDW), sy2, GDW, 8, ssk);
  if (s.gd <= 0.02) hatch(X(BX, GDW), sy2, GDW, 8, ssk, getCSS('--blood-bright'));
  else skewFill(X(BX, GDW), sy2, GDW, 8, ssk, s.gd, '#7fa5c8', dir > 0);

  // 아이콘 행 — 무기 · 전술 · 스킬(쿨타임 부채꼴). 초상 아래가 아니라 바 아래로 뺐다:
  // 초상 밑은 좁아 4칸도 안 들어가는데 스킬은 최대 6칸까지 온다
  const SZ = 22, GAP = 5, iy = sy2 + 13;
  let n = 0;
  const put = (id, col, ready, hot) => {
    const gx = dir > 0 ? ox + BX + n * (SZ + GAP) : ox - BX - SZ - n * (SZ + GAP);
    iconSlot(gx, iy, SZ, id, col, ready, hot); n++;
  };
  put(WPN_ICON[s.weapon] || 'sword', getCSS('--ink'), 1, false);
  put(TAC_ICON[s.tactic] || 'scales', getCSS('--dim'), 1, false);
  for (const sk2 of (s.skills || []).slice(0, 5)){
    const rf = readyFrac(s.who, sk2.Tag, sk2.Cd);
    put(SKILL_ICON[sk2.Tag] || (sk2.Passive ? 'star' : 'bolt'),
        sk2.Passive ? getCSS('--grn') : getCSS('--gold'), rf, rf >= 1 && s.hotTag === sk2.Tag);
  }
  // 출혈 — 이름 옆 마름모 스택
  for (let i = 0; i < s.bleed; i++){
    const dx = (dir > 0 ? ox + BX + HPW - 6 : ox - BX - HPW + 6) - dir * i * 11;
    ctx.fillStyle = getCSS('--blood-bright');
    ctx.beginPath(); ctx.moveTo(dx, BY - 6); ctx.lineTo(dx + 3.5, BY - 1.5);
    ctx.lineTo(dx, BY + 3); ctx.lineTo(dx - 3.5, BY - 1.5); ctx.closePath(); ctx.fill();
  }
}
// 중앙 하단 시계 — 남은 제한 시간. 두 선수 사이를 가르는 축이자 긴장의 계기판이다.
function drawClock(){
  const lim = doc.Meta.MatchTimeSec || 180;
  const left = Math.max(0, lim - t);
  const cx = W / 2, cy = H - 58;
  const urgent = left <= 15;
  const pulse = 0.72 + 0.28 * Math.sin(t * 5.0);
  ctx.save();
  ctx.textAlign = 'center';
  // 받침 — 아래로 좁아지는 사다리꼴. 좌우 판과 다른 실루엣이라 눈이 구분한다
  ctx.beginPath();
  ctx.moveTo(cx - 58, cy - 26); ctx.lineTo(cx + 58, cy - 26);
  ctx.lineTo(cx + 40, cy + 30); ctx.lineTo(cx - 40, cy + 30); ctx.closePath();
  ctx.fillStyle = 'rgba(14,10,6,0.82)'; ctx.fill();
  ctx.strokeStyle = getCSS('--bronze'); ctx.globalAlpha = 0.55; ctx.lineWidth = 1;
  ctx.stroke(); ctx.globalAlpha = 1;
  // 날개 — 좌우로 뻗는 갈매기 두 겹
  ctx.strokeStyle = getCSS('--gold-deep'); ctx.lineWidth = 1.5;
  for (const d of [-1, 1]) for (let i = 0; i < 2; i++){
    const x0 = cx + d * (60 + i * 13), y0 = cy - 22 + i * 5;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0 + d * 26, y0 + 9); ctx.lineTo(x0, y0 + 18);
    ctx.stroke();
  }
  // 경과 호 — 남은 시간이 줄면 테두리가 함께 닫힌다
  const frac = Math.max(0, Math.min(1, left / lim));
  ctx.strokeStyle = urgent ? getCSS('--blood-bright') : getCSS('--gold-deep');
  ctx.globalAlpha = urgent ? pulse : 0.85; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(cx, cy + 1, 33, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac);
  ctx.stroke(); ctx.globalAlpha = 1;
  // 숫자
  ctx.font = '900 34px ' + getCSS('--font-display');
  ctx.fillStyle = urgent ? getCSS('--blood-bright') : '#f2e8d4';
  if (urgent) ctx.globalAlpha = pulse;
  ctx.fillText(String(Math.ceil(left)), cx, cy + 12);
  ctx.globalAlpha = 1;
  ctx.fillStyle = getCSS('--gold'); ctx.beginPath();
  ctx.moveTo(cx, cy + 20); ctx.lineTo(cx + 5, cy + 25); ctx.lineTo(cx, cy + 30);
  ctx.lineTo(cx - 5, cy + 25); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawBottomHud(fr){
  const f = fr.f, g = fr.g, k = fr.k;
  const ip = (a, b) => a + (b - a) * k;
  const MA = doc.Meta.A, MB = doc.Meta.B;
  // 최근 0.9초 안에 발동한 스킬 — 아이콘을 금빛으로 띄운다.
  // decisions는 시간순이므로 창을 벗어나면 **끊는다**. continue로 흘리면 매 프레임 전체를 훑는다.
  const hot = who => {
    for (let i = decisions.length - 1; i >= 0; i--){
      const d = decisions[i];
      if (d.t > t) continue;
      if (t - d.t > 0.9) break;
      if (d.who !== who) continue;
      const m = /^(?:SKILL|PASV)_(.+)$/.exec(d.tag || ''); if (m) return m[1];
    }
    return null;
  };
  ctx.save();
  scrim(H - 116, H, 0, 0.66);
  fighterPlate(24, +1, { who:0, name:MA.Name, col:getCSS('--a'), colDeep:'#2f5f96',
    weapon:MA.Weapon, tactic:MA.Tactic, skills:MA.Skills, spr:spriteFor(MA.Weapon), hotTag:hot(0),
    hp:ip(f.HpPctA, g.HpPctA), st:ip(f.StamPctA, g.StamPctA),
    gd:ip(f.GuardPctA ?? 1, g.GuardPctA ?? 1), ghost:hpGhost('HpPctA'), bleed:f.BleedA||0 });
  fighterPlate(W - 24, -1, { who:1, name:MB.Name, col:getCSS('--b'), colDeep:'#93362f',
    weapon:MB.Weapon, tactic:MB.Tactic, skills:MB.Skills, spr:spriteFor(MB.Weapon), hotTag:hot(1),
    hp:ip(f.HpPctB, g.HpPctB), st:ip(f.StamPctB, g.StamPctB),
    gd:ip(f.GuardPctB ?? 1, g.GuardPctB ?? 1), ghost:hpGhost('HpPctB'), bleed:f.BleedB||0 });
  drawClock();
  ctx.restore();
}

// 출혈 표시: 발밑에 떨어지는 핏방울(스택 수만큼) + 스택 점. t로 애니메이션(스크럽 안전).
function drawBleed(fx, fy, sc, stacks){
  ctx.save();
  for(let i=0;i<stacks;i++){
    const ph=((t*1.4 + i*0.37) % 1);          // 0→1 낙하 위상
    const dx=fx + (i-(stacks-1)/2)*9*sc;
    const dy=fy - 46*sc + ph*46*sc;            // 몸통에서 바닥으로
    ctx.globalAlpha=0.85*(1-ph*0.5);
    ctx.fillStyle='#c0241c';
    ctx.beginPath(); ctx.ellipse(dx, dy, 2.0*sc, 3.0*sc, 0,0,7); ctx.fill();
  }
  // (머리 위 핏색 도트는 제거 — 스택 수는 HP바 아래 디버프 아이콘이 보여준다)
  ctx.restore();
}

// ── 전투 피드백 픽토그램·표식 (캔버스 벡터, 스크럽 안전) ──
// 데미지 숫자: 한글 없이 색·크기·표식·스파크만으로 종류 구분
function glyphShield(cx,cy,r,col){ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(cx,cy-r); ctx.lineTo(cx+0.75*r,cy-0.6*r); ctx.lineTo(cx+0.6*r,cy+0.5*r);
  ctx.quadraticCurveTo(cx,cy+1.05*r,cx-0.6*r,cy+0.5*r); ctx.lineTo(cx-0.75*r,cy-0.6*r); ctx.closePath(); ctx.stroke(); ctx.restore(); }
function glyphSwords(cx,cy,r,col){ ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=1.8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(cx-r,cy-r); ctx.lineTo(cx+r,cy+r); ctx.moveTo(cx+r,cy-r); ctx.lineTo(cx-r,cy+r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-r,cy+0.5*r); ctx.lineTo(cx-0.5*r,cy+r); ctx.moveTo(cx+r,cy+0.5*r); ctx.lineTo(cx+0.5*r,cy+r); ctx.stroke(); ctx.restore(); }
function drawDamage(x, y, age, life, p){
  const u = age/life; if (u>=1) return;
  const fade = u<0.7 ? 1 : (1-u)/0.3;              // 끝 30%에서만 페이드 — 포물선 낙하가 보이게
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.lineJoin='round';
  // 전체적으로 작고 반투명 — 눈에 거슬리지 않게. 윤곽선(strokeText) 없이 부드러운 그림자로만 가독성.
  let size=13, col='#f4ecdd', glyph=null, gcol, alpha=0.72;
  if (p.crit){ size=17; col='#ff5d5d'; }
  else if (p.counter){ size=13; col='#ffd24a'; glyph='swords'; gcol='#ffe08a'; }
  else if (p.guard){ size=11; col='#6fa8dc'; glyph='shield'; gcol='#9bc4ec'; alpha=0.6; }
  else if (p.armor){ size=12; col='#9aa3af'; }
  ctx.globalAlpha = fade*alpha;
  let scl=1; if (p.crit && u<0.12) scl = 1 + (0.12-u)/0.12*0.2;    // 치명타 스케일 펀치(등장 순간)
  const txt='−'+p.dmg;
  ctx.font='bold '+Math.round(size*scl)+'px "Pretendard Variable",system-ui';
  if (glyph){ const w=ctx.measureText(txt).width, glx=x-w/2-size*0.5, gly=y-size*0.34;
    if (glyph==='swords') glyphSwords(glx,gly,size*0.44,gcol); else glyphShield(glx,gly,size*0.42,gcol); }
  ctx.shadowColor='rgba(0,0,0,0.38)'; ctx.shadowBlur=3; ctx.shadowOffsetY=1;   // 윤곽선 대신 최소 그림자
  if (p.crit){ ctx.shadowColor='rgba(255,80,80,0.35)'; ctx.shadowBlur=5; }
  ctx.fillStyle=col; ctx.fillText(txt, x, y);
  ctx.restore();
}
// 상태이상·무기 픽토그램 — 중심(cx,cy), 반경 r, 색 col
function statGlyph(kind, cx, cy, r, col){ ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1.8; ctx.lineCap='round'; ctx.lineJoin='round';
  switch(kind){
    case 'down':
      ctx.beginPath(); ctx.moveTo(cx,cy-0.85*r); ctx.lineTo(cx,cy+0.3*r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-0.5*r,cy-0.15*r); ctx.lineTo(cx,cy+0.4*r); ctx.lineTo(cx+0.5*r,cy-0.15*r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-0.8*r,cy+0.85*r); ctx.lineTo(cx+0.8*r,cy+0.85*r); ctx.stroke(); break;
    case 'bleed':
      ctx.beginPath(); ctx.moveTo(cx,cy-0.95*r);
      ctx.bezierCurveTo(cx+0.9*r,cy+0.15*r, cx+0.55*r,cy+0.95*r, cx,cy+0.95*r);
      ctx.bezierCurveTo(cx-0.55*r,cy+0.95*r, cx-0.9*r,cy+0.15*r, cx,cy-0.95*r); ctx.fill(); break;
    case 'guardbreak':
      ctx.beginPath(); ctx.moveTo(cx,cy-0.9*r); ctx.lineTo(cx+0.72*r,cy-0.55*r); ctx.lineTo(cx+0.58*r,cy+0.5*r);
      ctx.quadraticCurveTo(cx,cy+1.02*r,cx-0.58*r,cy+0.5*r); ctx.lineTo(cx-0.72*r,cy-0.55*r); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-0.12*r,cy-0.6*r); ctx.lineTo(cx+0.16*r,cy-0.05*r); ctx.lineTo(cx-0.14*r,cy+0.22*r); ctx.lineTo(cx+0.1*r,cy+0.7*r); ctx.stroke(); break;
    case 'poise':
      ctx.beginPath(); ctx.moveTo(cx-0.6*r,cy-0.35*r); ctx.lineTo(cx,cy-0.85*r); ctx.lineTo(cx+0.6*r,cy-0.35*r); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx-0.6*r,cy+0.4*r); ctx.lineTo(cx,cy-0.1*r); ctx.lineTo(cx+0.6*r,cy+0.4*r); ctx.stroke(); break;
    case 'stam':
      for (let i=-1;i<=1;i++){ const yy=cy+i*0.5*r; ctx.beginPath(); ctx.moveTo(cx-0.85*r,yy); ctx.lineTo(cx+0.45*r,yy);
        ctx.arc(cx+0.45*r,yy-0.2*r,0.2*r,1.57,-1.57,true); ctx.stroke(); } break;
  }
  ctx.restore(); }
function wpnGlyph(w, cx, cy, r, col){ ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=1.7; ctx.lineCap='round'; ctx.lineJoin='round';
  const L=(a,b,c,d)=>{ctx.beginPath();ctx.moveTo(cx+a*r,cy+b*r);ctx.lineTo(cx+c*r,cy+d*r);ctx.stroke();};
  switch(w){
    case 'WPN_HAMMER': ctx.beginPath(); ctx.rect(cx-0.75*r,cy-0.95*r,1.5*r,0.55*r); ctx.fill(); L(0,-0.4,0,0.95); break;
    case 'WPN_AXE': ctx.beginPath(); ctx.moveTo(cx-0.05*r,cy-0.95*r); ctx.quadraticCurveTo(cx+0.95*r,cy-0.7*r,cx+0.5*r,cy+0.1*r);
      ctx.lineTo(cx-0.05*r,cy-0.05*r); ctx.closePath(); ctx.fill(); L(-0.05,-0.95,-0.05,0.95); break;
    case 'WPN_SWORD': L(0,-0.95,0,0.5); L(-0.4,0.5,0.4,0.5); L(0,0.5,0,0.95); break;
    case 'WPN_GREATSWORD': ctx.lineWidth=2.6; L(0,-0.98,0,0.45); ctx.lineWidth=1.7; L(-0.5,0.45,0.5,0.45); L(0,0.45,0,0.98); break;
    case 'WPN_DUALBLADES': L(-0.65,-0.9,-0.65,0.55); L(0.65,-0.9,0.65,0.55); break;
    case 'WPN_SPEAR': L(0,-0.98,0,0.98); ctx.beginPath(); ctx.moveTo(cx,cy-0.98*r); ctx.lineTo(cx-0.28*r,cy-0.55*r); ctx.lineTo(cx+0.28*r,cy-0.55*r); ctx.closePath(); ctx.fill(); break;
    case 'WPN_WHIP': ctx.beginPath(); ctx.moveTo(cx-0.8*r,cy-0.6*r); ctx.quadraticCurveTo(cx+0.65*r,cy-0.3*r,cx-0.15*r,cy+0.3*r);
      ctx.quadraticCurveTo(cx-0.85*r,cy+0.7*r,cx+0.75*r,cy+0.9*r); ctx.stroke(); break;
    case 'WPN_SHIELD': ctx.beginPath(); ctx.moveTo(cx,cy-0.9*r); ctx.lineTo(cx+0.72*r,cy-0.55*r); ctx.lineTo(cx+0.58*r,cy+0.5*r);
      ctx.quadraticCurveTo(cx,cy+1.02*r,cx-0.58*r,cy+0.5*r); ctx.lineTo(cx-0.72*r,cy-0.55*r); ctx.closePath(); ctx.stroke(); break;
    case 'star': ctx.beginPath(); for(let i=0;i<10;i++){ const ang=-1.5708+i*Math.PI/5, rr=(i%2?0.42:1)*r;
      ctx.lineTo(cx+Math.cos(ang)*rr, cy+Math.sin(ang)*rr);} ctx.closePath(); ctx.fill(); break;
    default: ctx.beginPath(); ctx.arc(cx,cy,0.4*r,0,7); ctx.fill();
  }
  ctx.restore(); }
// 롤식 디버프 아이콘 스트립 (HP바 아래) — 방사형 쿨다운 스윕 + 스택 + 카테고리 테두리색
function drawStatusStrip(cx, hpTopY, bleed, who){
  const list=[];
  for (const s of statuses){ if (s.who!==who) continue; const age=t-s.t, dur=STATDUR[s.kind]||1.2;
    if (age<0||age>dur) continue; list.push({kind:s.kind, rem:1-age/dur, age}); }
  if (bleed>0) list.push({kind:'bleed', rem:-1, stack:bleed, age:1});
  if (!list.length) return;
  const sz=15, gap=3, total=list.length*sz+(list.length-1)*gap;
  let x=Math.round(cx-total/2), y=Math.round(hpTopY+11);
  ctx.save(); ctx.textBaseline='alphabetic';
  for (const it of list){ const col=STATCOL[it.kind];
    const pop = it.age<0.2 ? 1+(1-it.age/0.2)*0.6 : 1;   // 등장 슬램
    const s2=sz*pop, ox=x-(s2-sz)/2, oy=y-(s2-sz)/2;
    ctx.fillStyle='#160f08'; roundRect(ox,oy,s2,s2,3); ctx.fill();
    ctx.save(); roundRect(ox,oy,s2,s2,3); ctx.clip();
    statGlyph(it.kind, ox+s2/2, oy+s2/2, s2*0.42, col);
    if (it.rem>=0){ const el=1-it.rem; ctx.beginPath(); ctx.moveTo(ox+s2/2,oy+s2/2);
      ctx.arc(ox+s2/2, oy+s2/2, s2, -1.5708, -1.5708+el*6.2832); ctx.closePath();
      ctx.fillStyle='rgba(6,4,2,0.60)'; ctx.fill(); }
    ctx.restore();
    ctx.lineWidth=1.5; ctx.strokeStyle=col; roundRect(ox+0.75,oy+0.75,s2-1.5,s2-1.5,2.5); ctx.stroke();
    if (it.stack>1){ ctx.textAlign='right'; ctx.font='bold 9px "Pretendard Variable",system-ui';
      ctx.lineWidth=2.4; ctx.strokeStyle='#000'; ctx.strokeText(it.stack, ox+s2, oy+s2+1);
      ctx.fillStyle='#fff'; ctx.fillText(it.stack, ox+s2, oy+s2+1); }
    x+=sz+gap;
  }
  ctx.restore(); }
// CC 발생 순간 — 아이콘이 크게 터진다(글자 없음). 상체 위치에서 링과 함께.
function drawStatusBurst(px_, py_, who){
  for (const s of statuses){ if (s.who!==who) continue; const age=t-s.t; if (age<0||age>0.5) continue;
    const col=STATCOL[s.kind]; if (!col) continue;
    const pr=age/0.5, al=(1-pr)*0.95;
    ctx.save(); ctx.globalAlpha=al; ctx.strokeStyle=col; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(px_, py_, 9+pr*26, 0, 7); ctx.stroke();
    statGlyph(s.kind, px_, py_, 16*(0.5+pr*0.8), col);
    ctx.restore();
  } }
// 스킬 컷인 — 각진 플레이트 + 무기 다이아 배지 + 금빛 와이프 (Zone 4, 시전자 위)
// ax=어깨 바깥 앵커, side=+1이면 오른쪽으로 뻗음.
// 강조는 장식(글로우·섬광)이 아니라 '진입 모션 자체'로 — 더 멀리서·더 길게·감속하며 들어오고,
// 투명하게 시작해 도착하면서 또렷해진다(이동이 눈에 밟히게).
function drawCutin(ax, yTop, side, name, weapon, pasv, age, dur){
  const travelT=0.34;                                   // 진입 시간(길수록 잘 보인다)
  const inP=Math.min(1, age/travelT), ease=1-Math.pow(1-inP,3);   // 감속(ease-out)
  const fadeIn=Math.min(1, age/0.14);                   // 투명 → 또렷
  const outP=age>dur-0.35?Math.max(0,(dur-age)/0.35):1;
  const al=Math.min(fadeIn,outP)*(0.55+0.45*ease);      // 이동 중엔 살짝 투명, 도착하면 100%
  if (al<=0) return;
  const acc = pasv?'#9bc4ec':'#d2ab55', h = pasv?18:22, skew=5;
  const nameFont='bold '+(pasv?10:11.5)+'px "Noto Serif KR","Pretendard Variable",serif';
  ctx.save(); ctx.globalAlpha=al; ctx.textBaseline='alphabetic';
  ctx.font=nameFont;
  const nameW=ctx.measureText(name).width, badgeW=h, padL=7, padR=11;
  const plateW=padL+nameW+padR, totalW=badgeW+plateW;
  const slide=(1-ease)*46*side;                         // 바깥 먼 곳에서 스윽 (20 → 46px)
  const x0=Math.round((side>0 ? ax : ax-totalW) + slide);
  const bcx=x0+badgeW/2, bcy=yTop+h/2, px0=x0+badgeW-1;
  ctx.fillStyle='#161009'; ctx.strokeStyle=acc; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(bcx,yTop-2); ctx.lineTo(x0+badgeW+2,bcy); ctx.lineTo(bcx,yTop+h+2); ctx.lineTo(x0-2,bcy); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(px0+skew,yTop); ctx.lineTo(px0+plateW+skew,yTop);
  ctx.lineTo(px0+plateW-skew,yTop+h); ctx.lineTo(px0-skew,yTop+h); ctx.closePath();
  ctx.fillStyle='rgba(20,14,7,0.95)'; ctx.fill(); ctx.strokeStyle=acc; ctx.lineWidth=1.5; ctx.stroke();
  wpnGlyph(pasv?'star':weapon, bcx, bcy, h*0.26, acc);
  ctx.textAlign='left';
  if (pasv){                                            // 패시브는 이름만(작게) — 청색이 이미 종류를 말한다
    ctx.textBaseline='middle'; ctx.fillStyle='#f4ecdd'; ctx.font=nameFont;
    ctx.fillText(name, px0+padL, bcy); ctx.textBaseline='alphabetic';
  } else {
    ctx.globalAlpha=al*0.85; ctx.fillStyle=acc; ctx.font='bold 7px "Pretendard Variable",system-ui';
    ctx.fillText(WPN[weapon]||'무기', px0+padL, yTop+8);
    ctx.globalAlpha=al; ctx.fillStyle='#f4ecdd'; ctx.font=nameFont;
    ctx.fillText(name, px0+padL, yTop+h-5);
  }
  const wipeW=(plateW-4)*Math.min(1, age/0.4);
  ctx.strokeStyle=acc; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(px0-skew+2,yTop+h-1); ctx.lineTo(px0-skew+2+wipeW,yTop+h-1); ctx.stroke();
  ctx.restore(); }
// 감정 색 분류 — 공격/자신=붉음, 위축/신중=청, 과시/기회=금, 그 외=바랜 오커
function emoColor(tag){
  if (/ENRAGED|RAGED|RECKLESS|CRUEL|NEMESIS|HUNT|VENGE|CONFIDENT/.test(tag)) return '#e0685f';
  if (/FEAR|FLINCH|WARY|DREAD|PRESSURE|INFERIOR|TRAUMA/.test(tag))           return '#9bc4ec';
  if (/SHOWTIME|BOLD|EXPLOIT|TAUNT|RIVAL|ENVY|OBSESSION|HUBRIS|MOTIVATED/.test(tag)) return '#d2ab55';
  return '#c9b189';
}
// 감정·의도 칩 (Zone 3) — 머리 위 작은 반투명 칩, 감정색 도트. 최하 우선순위(작고 조용).
function drawEmotionChip(cx, topY, text, tag, age, dur){
  const inP=Math.min(1, age/0.18), outP=age>dur-0.3?Math.max(0,(dur-age)/0.3):1, al=Math.min(inP,outP)*0.92;
  if (al<=0) return;
  const col=emoColor(tag), rise=(1-inP)*5;
  ctx.save(); ctx.globalAlpha=al; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font='bold 11px "Pretendard Variable",system-ui';
  const tw=ctx.measureText(text).width, dot=5, padL=8, gap=4, padR=9, h=17, w=padL+dot+gap+tw+padR;
  const x0=Math.round(cx-w/2), y0=Math.round(topY-rise), cyc=y0+h/2;
  ctx.fillStyle='rgba(20,14,7,0.72)'; roundRect(x0,y0,w,h,8); ctx.fill();
  ctx.globalAlpha=al*0.7; ctx.strokeStyle=col; ctx.lineWidth=1; roundRect(x0+0.5,y0+0.5,w-1,h-1,7.5); ctx.stroke();
  ctx.globalAlpha=al; ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x0+padL+dot/2, cyc, dot/2, 0, 7); ctx.fill();
  ctx.fillStyle='#e8dcc4'; ctx.fillText(text, x0+padL+dot+gap, cyc+0.5);
  ctx.restore();
}
// 전술 배너 — 라니스타 지시(order, 금·강조) / 적 AI 전술 전환(adapt, 강철청). 커맨드 이중 셰브런.
function drawTacticBanner(cx, yTop, kind, tacName, age, dur){
  const inP=Math.min(1, age/0.16), outP=age>dur-0.35?Math.max(0,(dur-age)/0.35):1, al=Math.min(inP,outP);
  if (al<=0) return;
  const order = kind==='order', acc = order?'#e6c063':'#8fb0cf', kindTxt = order?'라니스타 지시':'전술 전환';
  const h=26, leftPad=10, chevW=11, textGap=8, rightPad=14, slide=(1-inP)*-8;
  ctx.save(); ctx.globalAlpha=al; ctx.textBaseline='alphabetic';
  ctx.font='bold 13px "Noto Serif KR","Pretendard Variable",serif'; const nameW=ctx.measureText(tacName).width;
  ctx.font='bold 8px "Pretendard Variable",system-ui'; const kindW=ctx.measureText(kindTxt).width;
  const w=leftPad+chevW+textGap+Math.max(nameW,kindW)+rightPad, x0=Math.round(cx-w/2), y0=Math.round(yTop+slide);
  ctx.fillStyle='rgba(18,12,6,0.95)'; roundRect(x0,y0,w,h,5); ctx.fill();
  ctx.strokeStyle=acc; ctx.lineWidth=1.5; roundRect(x0+0.75,y0+0.75,w-1.5,h-1.5,4.5); ctx.stroke();
  ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round'; const cvx=x0+leftPad, cvy=y0+h/2;
  for (let i=0;i<2;i++){ const ox=cvx+i*5; ctx.beginPath(); ctx.moveTo(ox,cvy-4); ctx.lineTo(ox+4,cvy); ctx.lineTo(ox,cvy+4); ctx.stroke(); }
  const tx=x0+leftPad+chevW+textGap;
  ctx.textAlign='left'; ctx.globalAlpha=al*0.9; ctx.fillStyle=acc; ctx.font='bold 8px "Pretendard Variable",system-ui';
  ctx.fillText(kindTxt, tx, y0+10);
  ctx.globalAlpha=al; ctx.fillStyle='#f4ecdd'; ctx.font='bold 13px "Noto Serif KR","Pretendard Variable",serif';
  ctx.fillText(tacName, tx, y0+h-6);
  ctx.restore();
}

// ── 렌더 ──
function render(){
  ctx.clearRect(0,0,W,H);
  // 타격 임팩트 → 화면 흔들림 + 좌우 기울기(틸트) (t로부터 결정 — 스크럽 안전). 장면 전체에 적용.
  let shx=0, shy=0, tilt=0;
  const CAMSHAKE = SET.camzoom !== false;   // 설정 '카메라 흔들림'에서 끌 수 있음 (mor_settings.camzoom=false)
  for (const im of impacts){ const age=t-im.t;
    if (age>=0 && age<=0.22){ const d=1-age/0.22, m=im.mag*d*d;
      shx += Math.sin(age*185+im.t*31)*m;
      shy += Math.cos(age*152+im.t*27)*m*0.55; }
    // 피격 카메라 틸트 — 좌우로 기울었다 감쇠 진동으로 복귀. 약공(mag 작음)은 제곱 스케일로 매우 작게.
    if (CAMSHAKE){
      const life=0.34;
      if (age>=0 && age<=life){ const d=1-age/life;
        const amp=Math.min(1, im.mag/13); const strength=amp*amp;    // 강타 13→1.0 · 약공 2.2→0.03
        const dir=((im.t*971|0)&1)?1:-1;                             // 피격마다 좌/우 방향 교차
        tilt += Math.sin(age*38) * 0.055 * strength * d * dir;        // 최대 ~3°, age=0에서 0으로 시작(부드러운 진입)
      }
    }
  }
  // ── 카메라 (연출 전용): 줌 모드는 ZOOM배 확대하며 두 선수 중점을 화면 중앙(CX,CY)에 두고 부드럽게 추적.
  //    기본 모드는 아레나 중심 고정·등배. sim 위치/밸런스 무관. (피격 연출=틸트, 줌 아님)
  {
    const cf=frameAt(t), ck=cf.k;
    let mx, my;
    if (focusIdx!==null){   // #11 쓰러진 패자 한 명에게 카메라 고정·확대
      mx = focusIdx===0 ? cf.f.Ax+(cf.g.Ax-cf.f.Ax)*ck : cf.f.Bx+(cf.g.Bx-cf.f.Bx)*ck;
      my = focusIdx===0 ? cf.f.Ay+(cf.g.Ay-cf.f.Ay)*ck : cf.f.By+(cf.g.By-cf.f.By)*ck;
    } else {
      mx=((cf.f.Ax+(cf.g.Ax-cf.f.Ax)*ck)+(cf.f.Bx+(cf.g.Bx-cf.f.Bx)*ck))/2;
      my=((cf.f.Ay+(cf.g.Ay-cf.f.Ay)*ck)+(cf.f.By+(cf.g.By-cf.f.By)*ck))/2;
    }
    const tgt = (focusIdx!==null||viewMode==='zoom') ? proj(mx,my) : {x:CX,y:CY};
    const zTgt = focusIdx!==null ? (introMode?2.3:2.9) : viewMode==='zoom' ? ZoomFollow : 1.0;   // 인트로는 조금 넉넉히
    const lerp = focusIdx!==null ? 0.06 : 0.12;   // 줌인은 더 천천히
    // ▼ 줌인 프레이밍 노브: 발밑(바닥점)이 아니라 전신이 담기게 타겟을 위로. 값=발이 화면 중앙에서 내려갈 px.
    const FocusLiftPx = introMode ? 100 : 55;
    camLift = focusIdx!==null ? FocusLiftPx : (viewMode==='zoom' ? ZoomLiftPx : 0);
    if (camX===null){ camX=tgt.x; camY=tgt.y; camZoom=zTgt; }
    camZoom += (zTgt-camZoom)*lerp;
    // 부각을 줌 배율에 연동 — 줌이 부드럽게 들어가는 동안 바닥도 같이 눕는다(전환 팝 없음).
    // 패자 줌인(2.9배)은 1로 클램프되어 가장 낮은 시점이 된다.
    zoomFrac = Math.max(0, Math.min(1, (camZoom - 1) / Math.max(0.001, ZoomFollow - 1)));
    CamTilt = TiltBasic + (TiltZoom - TiltBasic) * zoomFrac;
    RY = RX * CamTilt;
    camX += (tgt.x-camX)*lerp; camY += (tgt.y-camY)*lerp;
    // 화면 밖(아레나 void)이 과하게 보이지 않게 추적 중심을 아레나 안으로 클램프
    const halfW=(W/2)/camZoom, halfH=(H/2)/camZoom;
    const mgnX=Math.max(0, RX-halfW+30), mgnY=Math.max(0, RY-halfH+20);
    camX=Math.min(CX+mgnX, Math.max(CX-mgnX, camX));
    camY=Math.min(CY+mgnY, Math.max(CY-mgnY, camY));
  }
  // ── 월드층 시작 (PIXEL): ctx를 저해상 캔버스로 돌린다. 기본 변환에 1/PX을 걸어두므로
  //    아래 드로우 코드는 지금까지처럼 화면 좌표(W·H·CX·CY)를 그대로 쓰면 된다.
  ctx = wctx;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, wcv.width, wcv.height);
  ctx.scale(1/PX, 1/PX);
  // ── 경기장 배경 ──────────────────────────────────────────────────────────
  // 돌리 시퀀스가 있으면 그걸 쓴다([15]§10.17). 없으면 옛 방식(2장 크로스페이드)으로 폴백.
  // **돌리 프레임은 줌이 이미 구워져 있다** — 그래서 scale(camZoom)을 걸면 두 번 확대된다.
  // 카메라 변환을 직접 조립하되 배율만 빼고 팬(pan)은 줌만큼 곱해 넣는다.
  if (dolly.ready){
    const N = dolly.frames.length;
    const fi = Math.min(N - 1, Math.max(0, Math.round(zoomFrac * (N - 1))));
    const fr = dolly.frames[fi];
    // 프레임에 구워진 줌과 실제 camZoom의 **잔여 배율**을 보정한다. 두 가지를 한꺼번에 푼다:
    //  ① 프레임이 24단계로 양자화돼 생기는 오차
    //  ② 패자 줌인(2.9배)처럼 ZoomFollow를 넘어서는 구간 — 보정이 없으면 배경만 1.6에서 멈춘다
    const frameZoom = 1 + (ZoomFollow - 1) * (fi / Math.max(1, N - 1));
    const ex = camZoom / frameZoom;
    ctx.save();
    ctx.translate(shx, shy);
    ctx.translate(CX, CY); if (tilt) ctx.rotate(tilt);
    ctx.translate(camZoom * (CX - camX), camZoom * (CY - camY) + camLift);
    ctx.scale(ex, ex);
    // 프레임이 가로로 오버스캔돼 있으면(카메라 팬 대비) 그만큼 넓게, 중심을 맞춰 그린다.
    // 세로는 오버스캔이 없다 — 팬이 0이라 필요 없었다.
    // 오버스캔은 가로·세로 각각 붙는다(가로=팬 대비, 세로=camLift 대비, §10.19).
    // 베이크가 `--res 940`(= W)으로 굽히므로 **프레임 픽셀 = 논리 px**다. 그래서 그대로 쓴다.
    // ※ 베이크 해상도를 바꾸면 이 등식이 깨진다 — blockout.py의 --res는 W와 같아야 한다.
    const fw = fr.width, fh = fr.height;
    ctx.drawImage(fr, -CX - (fw - W) / 2, -CY - (fh - H) / 2, fw, fh);
    // 관중은 배경 위에 **매 프레임** 그린다(§10.19). 위 변환의 원점이 이미 아레나 중심이다:
    //   프레임 좌상단이 (-CX-(fw-W)/2, -CY-(fh-H)/2)이고 그 안에서 아레나 중심은
    //   ((fw-W)/2 + CX, (fh-H)/2 + CY) 이므로 합치면 정확히 (0, 0).
    // 배율은 frameZoom이다 — 이 변환에는 이미 scale(ex)가 걸려 있고 ex·frameZoom = camZoom이다.
    // camZoom을 넘기면 두 번 곱해진다.
    paintCrowd(ctx, CamTilt, frameZoom, t, fw / 2, fh / 2);
    ctx.restore();
  }
  ctx.save(); ctx.translate(shx, shy);
  ctx.translate(CX, CY); if (tilt) ctx.rotate(tilt); ctx.scale(camZoom, camZoom); ctx.translate(-camX, -camY + camLift/camZoom);
  if (!dolly.ready){
    // 부각별 프리렌더 2장을 zoomFrac으로 겹친다(전환 중 중간 각도 근사)
    ctx.drawImage(bgBasic, 0, 0, W, H);
    if (zoomFrac > 0.001){
      ctx.save(); ctx.globalAlpha = zoomFrac; ctx.drawImage(bgZoom, 0, 0, W, H); ctx.restore();
    }
    // 폴백에서도 관중은 매 프레임. 이 변환에는 scale(camZoom)이 이미 걸려 있으므로 배율은 1이다.
    ctx.save(); ctx.translate(CX, CY);
    paintCrowd(ctx, CamTilt, 1, t, W / 2, H / 2);
    ctx.restore();
  }
  // 혈흔 데칼: 유효 타격이 떨어진 자리의 모래 얼룩 — t 필터(스크럽 안전), 시간이 갈수록 전장이 물든다
  // 발자국: 파인 자국(어둡게) + 광원 쪽 둔덕(밝게). 방향은 LDIR 하나에서만 나온다
  if (tracks.length){
    ctx.save();
    for (const s of tracks){ if (s.t > t) continue;
      const p = proj(s.wx, s.wy), sc = 0.75+0.5*depthN(s.wy);
      ctx.globalAlpha = 0.15; ctx.fillStyle = '#6b4f2e';
      ctx.beginPath(); ctx.ellipse(p.x, p.y, 3.4*sc, 1.5*sc, s.a, 0, 7); ctx.fill();
      ctx.globalAlpha = 0.09; ctx.fillStyle = '#f2e0ba';
      ctx.beginPath(); ctx.ellipse(p.x+LDIR.x*1.3*sc, p.y+LDIR.y*1.3*sc, 3.0*sc, 1.2*sc, s.a, 0, 7); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (stains.length){
    ctx.save();
    for (const s of stains){ if (s.t > t) continue;
      const age = Math.min(1, (t-s.t)/0.5);
      ctx.globalAlpha = 0.15*age;
      ctx.fillStyle = '#5c1210';
      let sd2 = s.seed; const rnd2 = ()=>{ sd2=(sd2*1103515245+12345)&0x7fffffff; return (sd2%1000)/1000; };
      for (let i=0;i<4;i++){
        ctx.beginPath();
        ctx.ellipse(s.x+(rnd2()-0.5)*s.r*2.2, s.y+(rnd2()-0.5)*s.r*0.8,
                    s.r*(0.4+rnd2()*0.6), s.r*(0.15+rnd2()*0.2), 0, 0, 7);
        ctx.fill();
      }
    }
    ctx.restore(); ctx.globalAlpha = 1;
  }

  const fr=frameAt(t), f=fr.f, g=fr.g, k=fr.k;
  const ax=f.Ax+(g.Ax-f.Ax)*k, ay=f.Ay+(g.Ay-f.Ay)*k;
  const bx=f.Bx+(g.Bx-f.Bx)*k, by=f.By+(g.By-f.By)*k;
  const gap=Math.hypot(ax-bx, ay-by);

  // 바라보기: 동속 락스텝의 미세 X교차로 매 틱 뒤집히지 않게 히스테리시스 적용(buildFacing). +1 = A가 좌·상대가 우.
  const faceA = f._faceA ?? (bx>=ax ? 1 : -1), faceB = -faceA;
  // 위치 충실: 각자 진짜 투영 좌표로 그린다. (옛 중점대칭 gapShow 과장은 고정 선수가 상대 따라 움직이는
  // 아티팩트를 만들어 제거 — 위치 충실 우선.) 스프라이트 미러(facing)만 히스테리시스로 안정.
  const tpa = proj(ax, ay), tpb = proj(bx, by);
  // 완전히 겹칠 때만 최소 분리 넛지(두 스프라이트가 뭉쳐 보이는 것 방지). 그 외엔 실제 좌표 그대로.
  // 넛지는 '안 움직이는 쪽(이번 프레임 Move 아님 — 도발·경직 등)'을 고정하고 움직이는 쪽만 밀어 → 고정 선수는 화면서도 고정.
  { const dxs = tpb.x - tpa.x, MINSEP = 22, ad = Math.abs(dxs);
    if (ad < MINSEP){ const s=(dxs>=0?1:-1), aMove=f.StateA==='Move', bMove=f.StateB==='Move';
      if (!aMove && bMove)      tpb.x = tpa.x + s*MINSEP;            // A 고정 → B만 밀기
      else if (!bMove && aMove) tpa.x = tpb.x - s*MINSEP;            // B 고정 → A만 밀기
      else { const mid=(tpa.x+tpb.x)/2; tpa.x = mid - s*MINSEP/2; tpb.x = mid + s*MINSEP/2; } } } // 둘 다 → 대칭
  // B. 상대 공격 시 시각 반응 — 피격 측이 교전선 방향으로 살짝 밀림
  if (f.StateA==='Active' && gap<2.5) tpb.x += faceA*12;
  if (f.StateB==='Active' && gap<2.5) tpa.x -= faceA*12;
  // 대치(clinch) 판정 — 얼어붙은 핀 구간을 걷기 대신 idle 스탠스로 그리기 위함 (연출 전용)
  const clinch = f._clinch === true && !postGame;

  // 위치 스무딩 — 잔여 떨림 흡수 (disc로 큰 점프는 이미 없음)
  if (!vScrA){ vScrA={x:tpa.x,y:tpa.y}; vScrB={x:tpb.x,y:tpb.y}; }
  const SM = 0.3;
  vScrA.x+=(tpa.x-vScrA.x)*SM; vScrA.y+=(tpa.y-vScrA.y)*SM;
  vScrB.x+=(tpb.x-vScrB.x)*SM; vScrB.y+=(tpb.y-vScrB.y)*SM;
  const pa={x:vScrA.x,y:vScrA.y}, pb={x:vScrB.x,y:vScrB.y};

  // (간격선은 UI층으로 옮겼다 — 아래 합성 이후)

  // 깊이 정렬 (뒤→앞 그려 앞쪽이 위에) + 유닛별 플로팅 HUD
  const frameDt = Math.max(g.Time - f.Time, 0.016);
  // 대치 구간은 걷기(제자리 비비기) 대신 idle 스탠스로 — 두 선수가 간 보며 맞선 연출. 공격하면 clinch=false라 정상 복귀.
  const smA = clinch ? 'Idle' : smoothMoveState(0, f.StateA);
  const smB = clinch ? 'Idle' : smoothMoveState(1, f.StateB);
  const wphA = (f._wphA??0) + (((g._wphA??0)-(f._wphA??0))*k);  // 누적 걷기 위상 보간(단조)
  const wphB = (f._wphB??0) + (((g._wphB??0)-(f._wphB??0))*k);
  const A={p:pa, sy:ay, st:smA, kind:f.KindA, face:faceA, wdir:f._wdirA, wph:wphA, col:getCSS('--a'), reach:doc.Meta.A.Range, who:0, name:doc.Meta.A.Name, hp:f.HpPctA, velX:g.Ax-f.Ax, velMs:Math.abs(g.Ax-f.Ax)/frameDt, ph:f._phA, flash:hitFlashAt(0), spr:spriteFor(doc.Meta.A.Weapon), bleed:(f.BleedA||0), size:(doc.Meta.A.SizeScale||1)};
  const B={p:pb, sy:by, st:smB, kind:f.KindB, face:faceB, wdir:f._wdirB, wph:wphB, col:getCSS('--b'), reach:doc.Meta.B.Range, who:1, name:doc.Meta.B.Name, hp:f.HpPctB, velX:g.Bx-f.Bx, velMs:Math.abs(g.Bx-f.Bx)/frameDt, ph:f._phB, flash:hitFlashAt(1), spr:spriteFor(doc.Meta.B.Weapon), bleed:(f.BleedB||0), size:(doc.Meta.B.SizeScale||1)};
  // postGame: 승자 도발 · 패자 다운 포즈
  if (postGame && doc.Result.Winner >= 0){
    if (doc.Result.Winner === 0){ A.st='Taunt'; B.st='Down'; }
    else { A.st='Down'; B.st='Taunt'; }
  }
  // 깊이 정렬은 한 번만 하고 월드층·UI층이 같은 순서를 쓴다.
  const drawOrder = [A,B].sort((m,n)=>m.sy-n.sy);
  const FS = FIGH/120;   // 그림자·혈흔 등 '캐릭터 단위' 장식은 키가 커진 만큼 같이 커져야 한다
  for (const u of drawOrder){

    u._sc = sc;
    if (u.spr){ drawGround(u.p.x, u.p.y, sc*FS, u.reach, u.col); drawSprite(u.spr, u.p.x, u.p.y, sc, u.st, u.kind, u.face, u.velX, u.who, u.velMs, u.ph, u.flash, u.wdir, u.wph); }
    else drawFighter(u.p.x, u.p.y, sc*FS, u.st, u.face, u.col, u.reach);
    if (u.bleed > 0) drawBleed(u.p.x, u.p.y, sc*FS, u.bleed);
  }

  // ── 월드층 끝 → 화면에 정수배 확대 합성. 이후 UI는 풀해상으로 같은 카메라 변환 위에 그린다.
  ctx.restore();
  ctx = screenCtx;
  ctx.setTransform(CANVAS_S, 0, 0, CANVAS_S, 0, 0);   // fitCanvas가 걸어둔 DPR 배율로 복원
