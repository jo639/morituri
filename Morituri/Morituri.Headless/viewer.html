<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORITURI · 검투장</title>
<style>
  :root{ --a:#5b9be0; --b:#e0685f; --bg:#231a12; --panel:#2f2418; --ink:#f0e6d6; --dim:#a89576; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink);
        font:14px/1.4 system-ui,"Segoe UI","Malgun Gothic",sans-serif; }
  header{ padding:10px 16px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1{ font-size:15px; margin:0; font-weight:600; letter-spacing:.5px; color:var(--dim); }
  #wrap{ max-width:980px; margin:0 auto; padding:0 16px 32px; }
  /* HP 패널 */
  #hud{ display:grid; grid-template-columns:1fr auto 1fr; gap:12px; align-items:center; margin:8px 0; }
  .fcard{ background:var(--panel); border-radius:10px; padding:10px 12px; }
  .fcard.b{ text-align:right; }
  .fname{ font-weight:700; font-size:16px; }
  .ftags{ color:var(--dim); font-size:11px; margin-top:2px; }
  .bar{ height:12px; border-radius:6px; background:#0c0f14; margin-top:6px; overflow:hidden; }
  .bar > i{ display:block; height:100%; width:100%; transition:width .05s linear; }
  .hp.a > i{ background:linear-gradient(90deg,#2e6bb0,var(--a)); }
  .hp.b > i{ background:linear-gradient(90deg,var(--b),#b03e3e); }
  .stam{ height:5px; margin-top:4px; }
  .stam > i{ background:#d9b15a; }
  .vs{ color:var(--dim); font-weight:700; font-size:13px; text-align:center; }
  .winner{ font-size:11px; margin-top:4px; min-height:14px; }
  /* 캔버스 */
  #stage{ position:relative; }
  canvas{ width:100%; height:auto; background:#1a130c; border-radius:10px; display:block; }
  #drop{ position:absolute; inset:0; display:flex; flex-direction:column; gap:8px;
         align-items:center; justify-content:center; text-align:center; color:var(--dim);
         border:2px dashed #2c3340; border-radius:10px; cursor:pointer; }
  #drop.hidden{ display:none; }
  #drop b{ color:var(--ink); }
  /* 컨트롤 */
  #ctrl{ display:flex; gap:12px; align-items:center; margin-top:10px; }
  button{ background:var(--panel); color:var(--ink); border:1px solid #2c3340;
          border-radius:8px; padding:7px 14px; font-size:14px; cursor:pointer; }
  button:hover{ border-color:#3a4452; }
  #scrub{ flex:1; accent-color:var(--a); }
  #clock{ font-variant-numeric:tabular-nums; color:var(--dim); min-width:96px; text-align:right; }
  select{ background:var(--panel); color:var(--ink); border:1px solid #2c3340; border-radius:8px; padding:6px; }
  .hint{ color:var(--dim); font-size:11px; margin-top:10px; }
  code{ background:#0c0f14; padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>⚔ MORITURI · 검투장</h1>
  <span class="hint" id="meta"></span>
</header>

<div id="wrap">
  <div id="hud">
    <div class="fcard a">
      <div class="fname" id="nameA" style="color:var(--a)">—</div>
      <div class="ftags" id="tagsA"></div>
      <div class="bar hp a"><i id="hpA"></i></div>
      <div class="bar stam"><i id="stA"></i></div>
      <div class="winner" id="winA"></div>
    </div>
    <div class="vs">VS</div>
    <div class="fcard b">
      <div class="fname" id="nameB" style="color:var(--b)">—</div>
      <div class="ftags" id="tagsB"></div>
      <div class="bar hp b"><i id="hpB"></i></div>
      <div class="bar stam"><i id="stB"></i></div>
      <div class="winner" id="winB"></div>
    </div>
  </div>

  <div id="stage">
    <canvas id="cv" width="940" height="440"></canvas>
    <label id="drop">
      <b>viewer.json 을 여기로 끌어다 놓으세요</b>
      <span>또는 클릭해서 파일 선택 · 생성: <code>dotnet run -- viewer arrogant 7</code></span>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </label>
  </div>

  <div id="ctrl">
    <button id="play">▶ 재생</button>
    <input type="range" id="scrub" min="0" max="1000" value="0" step="1" disabled>
    <select id="speed">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="2">2×</option>
      <option value="4">4×</option>
    </select>
    <span id="clock">0.0 / 0.0s</span>
  </div>
  <div class="hint">콜로세움 핏(2.5D). 머리 위 = 이름·HP. 가드 파랑끼 · 경직/다운 회색 · 도발 노랑. 발밑 옅은 타원 = 무기 사거리. Space=재생/정지.</div>
</div>

<script>
"use strict";
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const W = 940, H = 440, PAD = 70, GROUND = H - 70;
cv.width = W * DPR; cv.height = H * DPR;
ctx.scale(DPR, DPR);
// 피격 흰색 플래시용 오프스크린 — 스프라이트만 격리해 틴트(바닥까지 박스로 번지는 것 방지)
const _fcv = document.createElement('canvas'), _fctx = _fcv.getContext('2d');
let doc = null, frames = null, popups = [], decisions = [], impacts = [], duration = 0;
let t = 0, playing = false, speed = 1, lastWall = 0, hitstopUntil = 0;
let postGame = false, postGameElapsed = 0;
const TAUNT_DUR = 3.0;
let vScrA = null, vScrB = null; // 최종 화면 위치 스무딩 (잔여 떨림 흡수)

// ── 로드 ──
function load(json){
  doc = JSON.parse(json);
  frames = doc.Frames;
  duration = frames.length ? frames[frames.length-1].Time : 0;
  buildPopups();
  buildImpacts();
  buildPhaseProgress();
  document.getElementById('meta').textContent =
    `시드 ${doc.Seed} · 원형 핏 지름 ${(doc.Meta.ArenaRadius*2).toFixed(0)}m · ${frames.length}프레임 · ${duration.toFixed(1)}초`;
  const A = doc.Meta.A, B = doc.Meta.B;
  document.getElementById('nameA').textContent = A.Name;
  document.getElementById('nameB').textContent = B.Name;
  document.getElementById('tagsA').textContent = label(A);
  document.getElementById('tagsB').textContent = label(B);
  const r = doc.Result, wtext = r.Winner < 0 ? '무승부'
      : (r.Winner === 0 ? A.Name : B.Name) + ' 승 · ' + r.Reason;
  document.getElementById('winA').textContent = r.Winner === 0 ? '🏆 ' + wtext : '';
  document.getElementById('winB').textContent = r.Winner === 1 ? '🏆 ' + wtext : '';
  if (r.Winner < 0){ document.getElementById('winA').textContent = wtext; }
  const sc = document.getElementById('scrub');
  sc.disabled = false; sc.value = 0;
  document.getElementById('drop').classList.add('hidden');
  t = 0; postGame = false; postGameElapsed = 0; vScrA = null; vScrB = null; hitstopUntil = 0; setPlaying(true);
}
const TAC = {TAC_BALANCED:'균형',TAC_BRAWLER:'난전',TAC_COUNTER:'카운터',TAC_DECISION:'결단',
  TAC_DEFENDER:'수비',TAC_EVADER:'회피',TAC_GAMBLER:'도박',TAC_HUNTER:'사냥',TAC_PRESSURE:'압박',TAC_ZONER:'견제'};
const PER = {PER_ARROGANT:'오만',PER_BOLD:'대담',PER_CALM:'냉철',PER_COWARD:'겁쟁이',PER_CRUEL:'잔혹',
  PER_HONORABLE:'명예',PER_OBSESSIVE:'집착',PER_OPTIMIST:'낙관',PER_PESSIMIST:'비관',
  PER_RECKLESS:'충동',PER_VENGEFUL:'복수',PER_WARY:'신중'};
const WPN = {WPN_AXE:'도끼',WPN_DUALBLADES:'쌍검',WPN_GREATSWORD:'대검',WPN_HAMMER:'망치',
  WPN_SPEAR:'창',WPN_SWORD:'검',WPN_SWORDSHIELD:'검방패',WPN_WHIP:'채찍'};
function label(f){ return `${WPN[f.Weapon]||f.Weapon} · ${TAC[f.Tactic]||f.Tactic} · ${PER[f.Personality]||f.Personality}`; }

// 이벤트 → 시간창 팝업 (스크럽해도 상태 무관하게 t로부터 재계산)
function buildPopups(){
  popups = []; decisions = [];
  const flavor = e => e.IsArmored ? ['🪨',' #9aa3af'] : e.IsGuarded ? ['🛡','#6fa8dc']
        : e.IsCounter ? ['⚡','#ffd24a'] : e.IsCrit ? ['💢','#ff5d5d'] : ['','#ffffff'];
  for (const e of doc.Events){
    switch(e.type){
      case 'HitLanded':{ const [ic,col]=flavor(e);
        popups.push({t:e.Time, who:e.Defender, life:0.8, rise:34,
          text:`${ic}-${Math.round(e.Damage)}`, col}); break; }
      case 'PoiseBroken':  popups.push({t:e.Time, who:e.FighterId, life:1.0, rise:26, text:'자세붕괴', col:'#cbd2dc'}); break;
      case 'GuardBroken':  popups.push({t:e.Time, who:e.FighterId, life:1.0, rise:26, text:'가드파괴!', col:'#6fa8dc'}); break;
      case 'KnockedDown':  popups.push({t:e.Time, who:e.FighterId, life:1.2, rise:26, text:'다운!', col:'#ff8a4a'}); break;
      case 'StaminaExhausted': popups.push({t:e.Time, who:e.FighterId, life:1.0, rise:26, text:'탈진', col:'#d9b15a'}); break;
      case 'Decision': decisions.push({t:e.Time, who:e.FighterId,
          dur:Math.min(Math.max(e.Duration,0.9),2.5), tag:e.ReasonTag, layer:e.SourceLayer}); break;
    }
  }
}

// 이벤트 → 임팩트(흔들림·스파크·히트스톱). t로부터 재계산 → 스크럽 안전.
function buildImpacts(){
  impacts = [];
  for (const e of doc.Events){
    if (e.type==='HitLanded'){
      let mag = Math.min(13, 3 + e.Damage*0.30);
      if (e.IsCrit) mag*=1.6; if (e.IsCounter) mag*=1.35;
      if (e.IsGuarded) mag*=0.30; if (e.IsArmored) mag*=0.45;
      // 약공격은 흔들림을 아주 미세하게만 — 가해자(Attacker)의 현재 스윙 종류로 판별
      const atkKind = e.Attacker===0 ? frameAt(e.Time).f.KindA : frameAt(e.Time).f.KindB;
      if (atkKind==='Light') mag = Math.min(mag, 2.2);
      const big = !e.IsGuarded && (e.IsCrit || e.IsCounter || e.Damage>=20);
      impacts.push({ t:e.Time, who:e.Defender, mag, kind: e.IsGuarded?'guard':'hit',
        col: e.IsGuarded?'#bcdcff': e.IsCrit?'#ff6b6b': e.IsCounter?'#ffe08a':'#fff2db',
        stop: big ? 0.07 : 0 });
    } else if (e.type==='KnockedDown'){
      impacts.push({ t:e.Time, who:e.FighterId, mag:13, kind:'down', col:'#ffb070', stop:0.13 });
    } else if (e.type==='GuardBroken'){
      impacts.push({ t:e.Time, who:e.FighterId, mag:9, kind:'hit', col:'#7fb8ff', stop:0.08 });
    } else if (e.type==='MatchEnded' && doc.Result.Winner>=0){
      impacts.push({ t:e.Time, who:1-doc.Result.Winner, mag:18, kind:'ko', col:'#ffffff', stop:0.22 });
    }
  }
}

// 피격 스프라이트 흰색 플래시 강도(0~1) — 최근 임팩트가 이 선수를 때렸으면 잠깐 하얘진다.
function hitFlashAt(who){
  let v=0;
  for (const im of impacts){ if (im.who!==who) continue;
    const age=t-im.t; if (age<0||age>0.13) continue;
    v=Math.max(v, (1-age/0.13)*(im.kind==='guard'?0.45:0.9)); }
  return v;
}

// 공격(Windup→Active→Recovery)·피격(HitStun/Stagger) 연속 구간의 진행률(0~1)을 각 프레임에 미리 계산.
// 한 번 휘두르는 동안 스프라이트 시트를 한 번 재생(루프 없음)하기 위함.
function buildPhaseProgress(){
  const grpOf = s => (s==='Windup'||s==='Active'||s==='Recovery') ? 'atk'
                   : (s==='HitStun'||s==='Stagger') ? 'hurt' : null;
  for (const who of ['A','B']){
    let i=0;
    while (i<frames.length){
      const grp = grpOf(frames[i]['State'+who]);
      if (!grp){ frames[i]['_ph'+who]=null; i++; continue; }
      let j=i; while (j<frames.length && grpOf(frames[j]['State'+who])===grp) j++;
      const span=j-i;
      for (let m=i;m<j;m++) frames[m]['_ph'+who] = { grp, p: span<=1?0:(m-i)/(span-1) };
      i=j;
    }
  }
}

// ── 프레임 조회 (시간 정렬 이진 탐색 + 위치 보간) ──
function frameAt(time){
  const F = frames; let lo=0, hi=F.length-1;
  if (time <= F[0].Time) return {f:F[0], g:F[0], k:0};
  if (time >= F[hi].Time) return {f:F[hi], g:F[hi], k:0};
  while (lo+1 < hi){ const m=(lo+hi)>>1; if (F[m].Time <= time) lo=m; else hi=m; }
  const a=F[lo], b=F[hi], span=b.Time-a.Time;
  return {f:a, g:b, k: span>0 ? (time-a.Time)/span : 0};
}
// ── 2.5D 핏 투영 (원형 아레나 → 기울인 타원 바닥). 중심 (0,0), Y=깊이 ──
const CX = W/2, CY = H*0.58, RX = W/2 - PAD, RY = (W/2 - PAD)*0.34;
const R = () => doc.Meta.ArenaRadius;
const proj = (sx, sy) => ({ x: CX + (sx/R())*RX, y: CY + (sy/R())*RY });
const mPx = () => RX/R();              // 가로 m→px
const depthN = sy => (sy/R()+1)/2;     // 0 뒤 ~ 1 앞 (원근·정렬)

function poseColor(state){
  if (state==='Guard') return '#6fa8dc';
  if (state==='Stagger'||state==='HitStun'||state==='Down'||state==='GetUp') return '#9aa3af';
  if (state==='Taunt') return '#ffd24a';
  return null;
}

// ── 스프라이트 시스템 (M4-b): sprites/sprites.json + PNG 시트가 있으면 실루엣 대신 그림을 그린다.
//    상태(12종) → 포즈(8종) 매핑. 시트는 오른쪽 향함 기준, 발(바닥)이 앵커. 없으면 실루엣 폴백.
let sprite = null; // { img, frames:{pose:{x,y,w,h}} }
// 상태(+스윙 종류) → 9포즈. 강공은 예비(텔레그래프)와 타격이 갈린다 — 수싸움 가독성의 핵심.
function poseFor(state, kind){
  const heavy = kind==='Heavy';
  switch(state){
    case 'Move': case 'Dodge': return 'walk';
    case 'Guard': return 'guard';
    case 'Windup': return heavy?'heavy_windup':'light_attack';
    case 'Active': case 'Recovery': return heavy?'heavy_attack':'light_attack';
    case 'HitStun': case 'Stagger': return 'hurt';
    case 'Down': case 'GetUp': return 'down';
    case 'Taunt': return 'taunt';
    default: return 'idle';
  }
}
async function loadSprites(){
  try{
    const cfg = await (await fetch('sprites/sprites.json?'+Date.now())).json();
    const img = new Image();
    await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src='sprites/'+cfg.image; });
    // 애니메이션 시트 로드 (이미지 중복 없이 캐시)
    const anims = {}, imgCache = {};
    for (const [name, a] of Object.entries(cfg.animations||{})){
      if (!imgCache[a.image]){
        const ai = new Image();
        await new Promise((res,rej)=>{ ai.onload=res; ai.onerror=rej; ai.src='sprites/'+a.image; });
        imgCache[a.image] = ai;
      }
      anims[name] = { img: imgCache[a.image], fps: a.fps||12, frames: a.frames, refH: a.refH, baseSpeed: a.baseSpeed||0 };
    }
    sprite = { img, frames: cfg.frames, srcFlip: cfg.facing === 'left', anims };
  }catch(e){ sprite=null; } // 시트 없음 → 실루엣 폴백
}
// 바닥 장식 (사거리 링 + 그림자 + 팀색 글로우) — 스프라이트 경로용 (실루엣은 자체 보유)
function drawGround(fx, fy, scale, reach, col){
  ctx.save(); ctx.globalAlpha=.20; ctx.fillStyle=col;       // 팀색 글로우 (같은 시트라도 구분)
  ctx.beginPath(); ctx.ellipse(fx, fy, 16*scale, 6*scale, 0,0,7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha=.18; ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(fx, fy, reach*mPx(), reach*mPx()*(RY/RX), 0,0,7); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha=.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(fx, fy, 10*scale, 4*scale, 0,0,7); ctx.fill(); ctx.restore();
}
function drawSprite(fx, fy, scale, state, kind, facing, velX, who, velMs, ph, flash){
  // 상태별 다중프레임 애니 선택 (이동·공격·피격). 없으면 정적 포즈 폴백.
  let anim = null;
  if (sprite.anims){
    if (state==='Move'||state==='Dodge'){
      const fwd = velX===0 ? true : (velX*facing)>0;
      if (state==='Move') anim = fwd ? sprite.anims.walk_fwd : sprite.anims.walk_bwd;
      else                anim = sprite.anims.dash_bwd; // Dodge = 뒷회피 고정 (앞대쉬는 추후 Dash 기능용)
    } else if (state==='Windup'||state==='Active'||state==='Recovery'){
      anim = kind==='Heavy' ? sprite.anims.heavy_attack : sprite.anims.light_attack;
    } else if (state==='HitStun'||state==='Stagger'){
      anim = state==='Stagger' ? sprite.anims.hurt_heavy : sprite.anims.hurt_light; // 자세붕괴=강피격
    }
  }
  let fr, srcImg;
  if (anim?.frames?.length){
    let fi;
    if (ph && ph.grp){
      // 공격/피격: 구간 진행률로 시트를 한 번 재생 (루프 없음)
      fi = Math.min(anim.frames.length-1, Math.max(0, Math.round(ph.p*(anim.frames.length-1))));
    } else {
      // 이동: 속도 연동 fps 루프 — 느리면 발 느리게, 빠르면 빠르게 (문워크 방지)
      const dynFps = (anim.baseSpeed>0 && velMs>0.1)
        ? Math.max(4, Math.min(24, anim.fps * velMs / anim.baseSpeed))
        : (anim.fps||12);
      fi = Math.floor((t + who*0.4) * dynFps) % anim.frames.length;
    }
    fr = anim.frames[fi]; srcImg = anim.img;
  } else {
    fr = sprite.frames[poseFor(state,kind)] || sprite.frames.idle; srcImg = sprite.img;
  }
  if(!fr) return false;
  // refH(직립 환산 키) 우선순위: 애니 > 포즈별 > idle. 화면 키 일관성의 핵심.
  const refH = (anim?.refH) || fr.refH || sprite.frames.idle.h;
  const k = (120*scale)/refH;
  const w = fr.w*k, h = fr.h*k;
  const flip = (facing<0) !== sprite.srcFlip;
  ctx.save(); ctx.translate(fx, fy); if(flip) ctx.scale(-1,1);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(srcImg, fr.x,fr.y,fr.w,fr.h, -w/2, -h, w, h);
  // 피격 흰색 플래시: 오프스크린에 스프라이트만 그려 거기서 source-atop(스프라이트 픽셀=유일한 목적지) →
  // 실루엣 내부만 하얘진다. 본 캔버스에서 직접 하면 바닥까지 덮여 박스로 번짐.
  if (flash>0){
    const iw=Math.max(1,Math.ceil(w)), ih=Math.max(1,Math.ceil(h));
    _fcv.width=iw; _fcv.height=ih;            // 크기 재설정 = 클리어
    _fctx.drawImage(srcImg, fr.x,fr.y,fr.w,fr.h, 0,0, w, h);
    _fctx.globalCompositeOperation='source-atop';
    _fctx.fillStyle='#fff'; _fctx.globalAlpha=Math.min(1,flash);
    _fctx.fillRect(0,0,iw,ih);
    _fctx.globalCompositeOperation='source-over'; _fctx.globalAlpha=1;
    ctx.drawImage(_fcv, -w/2,-h, w, h);
  }
  ctx.restore(); return true;
}
// 채워진 작은 검투사: 투영된 바닥점(fx,fy)에서 위로 선다. scale = 깊이 원근.
function shade(hex, f){ // 색 밝기 조정 (f<1 어둡게)
  const n=parseInt(hex.slice(1),16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  return `rgb(${r*f|0},${g*f|0},${b*f|0})`;
}
function drawFighter(fx, fy, scale, state, facing, baseCol, reach){
  const col = poseColor(state) || baseCol;
  const dark = shade(col.startsWith('#')?col:'#888888', 0.62);
  // 사거리 링 (바닥 타원)
  ctx.save(); ctx.globalAlpha=.18; ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(fx, fy, reach*mPx(), reach*mPx()*(RY/RX), 0, 0, 7); ctx.stroke(); ctx.restore();
  // 발 그림자
  ctx.save(); ctx.globalAlpha=.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(fx, fy, 10*scale, 4*scale, 0,0,7); ctx.fill(); ctx.restore();

  if (state==='Down'){
    ctx.fillStyle=col; ctx.strokeStyle=dark; ctx.lineWidth=1.5*scale;
    ctx.save(); ctx.translate(fx,fy-5*scale); ctx.scale(facing,1);
    roundRect(-20*scale,-5*scale,34*scale,10*scale,5*scale); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-22*scale,0,7*scale,0,7); ctx.fill(); ctx.stroke(); ctx.restore(); return;
  }
  const H0 = 80*scale;
  let lean=0, crouch=0;
  if (state==='HitStun'||state==='Stagger') lean=-facing*0.30;
  if (state==='Dodge') lean=-facing*0.45;
  if (state==='GetUp') crouch=0.5;
  const cy = v => v + crouch*H0*0.28;
  const hip = cy(fy - H0*0.42), sh = cy(fy - H0*0.80), hd = cy(fy - H0*0.95);
  const sx = fx + lean*16*scale;

  ctx.lineCap='round'; ctx.lineJoin='round';
  // 다리 (두꺼운 선)
  ctx.strokeStyle=dark; ctx.lineWidth=5*scale;
  ctx.beginPath(); ctx.moveTo(fx, hip); ctx.lineTo(fx-6*scale, fy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx, hip); ctx.lineTo(fx+6*scale, fy); ctx.stroke();
  // 몸통 (채워진 캡슐)
  ctx.strokeStyle=dark; ctx.lineWidth=2*scale; ctx.fillStyle=col;
  ctx.save();
  const bw=11*scale, bx0=Math.min(fx,sx)-bw/2, bw2=bw+Math.abs(sx-fx);
  roundRect(bx0, sh, bw2, hip-sh, bw/2); ctx.fill(); ctx.stroke();
  ctx.restore();
  // 무기 팔 (몸통보다 먼저 — 뒤로 든 자세)
  let arm;
  switch(state){
    case 'Windup': arm=-2.3; break; case 'Active': arm=0; break;
    case 'Recovery': arm=0.5; break; case 'Guard': arm=-1.2; break;
    case 'Taunt': arm=-2.0; break; case 'Stagger': case 'HitStun': arm=-2.6; break;
    default: arm=0.9;
  }
  const aL=(state==='Active'?22:16)*scale;
  const ax=sx+facing*Math.cos(arm)*aL, ay=sh+Math.sin(arm)*aL;
  ctx.strokeStyle=col; ctx.lineWidth=4*scale;
  ctx.beginPath(); ctx.moveTo(sx,sh+2*scale); ctx.lineTo(ax,ay); ctx.stroke();
  // 무기 블레이드
  const wl=(state==='Active'? reach*mPx()*0.6 : 16*scale);
  ctx.strokeStyle='#d8cdb8'; ctx.lineWidth=2.5*scale; ctx.globalAlpha=(state==='Active')?1:.85;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+facing*Math.cos(arm)*wl, ay+Math.sin(arm)*wl); ctx.stroke();
  ctx.globalAlpha=1;
  // 머리
  ctx.fillStyle=col; ctx.strokeStyle=dark; ctx.lineWidth=2*scale;
  ctx.beginPath(); ctx.arc(sx+lean*4, hd, 8.5*scale, 0,7); ctx.fill(); ctx.stroke();
  // 공격 섬광
  if (state==='Active'){ ctx.save(); ctx.globalAlpha=.6; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(ax+facing*Math.cos(arm)*wl, ay+Math.sin(arm)*wl, 4*scale,0,7); ctx.stroke(); ctx.restore(); }
}

// 유닛별 플로팅 HUD (머리 위 이름 + 세그먼트 HP바) — TFM 시그니처
function unitTag(sx, topY, name, hpPct, col){
  const w=66, x=sx-w/2, y=topY;
  ctx.textAlign='center'; ctx.font='bold 11px system-ui';
  ctx.fillStyle='rgba(15,10,6,0.55)'; roundRect(x-3,y-13,w+6,12,3); ctx.fill();
  ctx.fillStyle='#f4ecdd'; ctx.fillText(name, sx, y-3);
  ctx.fillStyle='rgba(15,10,6,0.65)'; roundRect(x,y,w,6,2); ctx.fill();
  ctx.fillStyle=col; roundRect(x, y, Math.max(0,Math.min(1,hpPct))*w, 6, 2); ctx.fill();
  ctx.strokeStyle='rgba(15,10,6,0.5)'; ctx.lineWidth=1;
  for(let i=1;i<4;i++){ const segx=x+w*i/4|0; ctx.beginPath(); ctx.moveTo(segx,y); ctx.lineTo(segx,y+6); ctx.stroke(); }
}

// ── 렌더 ──
function render(){
  ctx.clearRect(0,0,W,H);
  // 타격 임팩트 → 화면 흔들림 (t로부터 결정 — 스크럽 안전). 장면 전체에 적용.
  let shx=0, shy=0;
  // let zoom=1; // 결정타·KO 카메라 줌 — 보류(주석처리)
  for (const im of impacts){ const age=t-im.t;
    if (age>=0 && age<=0.22){ const d=1-age/0.22, m=im.mag*d*d;
      shx += Math.sin(age*185+im.t*31)*m;
      shy += Math.cos(age*152+im.t*27)*m*0.55; }
    // 결정타·KO에 카메라 살짝 당겨찍기 — 보류(주석처리)
    // const big = im.kind==='ko' || im.kind==='down' || im.stop>=0.07;
    // if (big){ const life=im.kind==='ko'?0.6:0.34; if(age>=0&&age<=life){
    //   zoom = Math.max(zoom, 1 + (im.kind==='ko'?0.17:0.07)*(1-age/life)); } }
  }
  ctx.save(); ctx.translate(shx, shy);
  // if (zoom!==1){ const z0=frameAt(t).f, fo=proj((z0.Ax+z0.Bx)/2, (z0.Ay+z0.By)/2);
  //   ctx.translate(fo.x, fo.y); ctx.scale(zoom, zoom); ctx.translate(-fo.x, -fo.y); }
  // 모래 핏 바닥 — 따뜻한 콜로세움
  ctx.save();
  ctx.fillStyle='#5a4129'; ctx.beginPath(); ctx.ellipse(CX,CY+4,RX+7,RY+7,0,0,7); ctx.fill(); // 흙벽 두께감
  const grd=ctx.createRadialGradient(CX,CY-RY*0.3,8,CX,CY,RX);
  grd.addColorStop(0,'#e9cda2'); grd.addColorStop(1,'#c49a6b');
  ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(CX,CY,RX,RY,0,0,7); ctx.fill();
  ctx.strokeStyle='#6e4f31'; ctx.lineWidth=4; ctx.stroke();
  const edge=(R()-1.5)/R();
  ctx.strokeStyle='rgba(110,79,49,0.4)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(CX,CY,RX*edge,RY*edge,0,0,7); ctx.stroke();
  ctx.restore();

  const fr=frameAt(t), f=fr.f, g=fr.g, k=fr.k;
  const ax=f.Ax+(g.Ax-f.Ax)*k, ay=f.Ay+(g.Ay-f.Ay)*k;
  const bx=f.Bx+(g.Bx-f.Bx)*k, by=f.By+(g.By-f.By)*k;
  const gap=Math.hypot(ax-bx, ay-by);
  const MIN_SCR = 65;

  // Disc 충돌이 시뮬에서 통과·위치교환을 막으므로, 시뮬 위치를 충실히 투영한다(연출 트릭 불필요).
  // 방향은 위치 벡터 기준 — 좌우 교차가 물리적으로 없어 안정적이고, 돌아가면 자연히 따라 바뀐다.
  const faceA = bx>=ax ? 1 : -1, faceB = -faceA;
  const tpa = proj(ax, ay), tpb = proj(bx, by);
  // 화면 최소 분리: 충돌 거리(0.8m)가 화면상 너무 가까우면 겹쳐 보이므로 살짝 벌림
  const dxs = tpb.x - tpa.x;
  if (Math.abs(dxs) < MIN_SCR){ const s=dxs>=0?1:-1, push=(MIN_SCR-Math.abs(dxs))/2; tpa.x-=s*push; tpb.x+=s*push; }
  // B. 상대 공격 시 시각 반응 — 피격 측이 교전선 방향으로 살짝 밀림
  if (f.StateA==='Active' && gap<2.5) tpb.x += faceA*12;
  if (f.StateB==='Active' && gap<2.5) tpa.x -= faceA*12;
  // C. 독립 Idle 미세 애니 — 위상 차로 각자 "숨쉬는" 느낌
  if (f.StateA==='Idle') tpa.y -= Math.abs(Math.sin(t*2.8))*3;
  if (f.StateB==='Idle') tpb.y -= Math.abs(Math.sin(t*2.8+1.3))*3;

  // 위치 스무딩 — 잔여 떨림 흡수 (disc로 큰 점프는 이미 없음)
  if (!vScrA){ vScrA={x:tpa.x,y:tpa.y}; vScrB={x:tpb.x,y:tpb.y}; }
  const SM = 0.3;
  vScrA.x+=(tpa.x-vScrA.x)*SM; vScrA.y+=(tpa.y-vScrA.y)*SM;
  vScrB.x+=(tpb.x-vScrB.x)*SM; vScrB.y+=(tpb.y-vScrB.y)*SM;
  const pa={x:vScrA.x,y:vScrA.y}, pb={x:vScrB.x,y:vScrB.y};

  // 간격선
  ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle='#5a4129'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke(); ctx.restore();
  ctx.fillStyle='#6e4f31'; ctx.font='11px system-ui'; ctx.textAlign='center';
  ctx.fillText(`${gap.toFixed(1)}m`, (pa.x+pb.x)/2, (pa.y+pb.y)/2-6);

  // 깊이 정렬 (뒤→앞 그려 앞쪽이 위에) + 유닛별 플로팅 HUD
  const frameDt = Math.max(g.Time - f.Time, 0.016);
  const A={p:pa, sy:ay, st:f.StateA, kind:f.KindA, face:faceA, col:getCSS('--a'), reach:doc.Meta.A.Range, who:0, name:doc.Meta.A.Name, hp:f.HpPctA, velX:g.Ax-f.Ax, velMs:Math.abs(g.Ax-f.Ax)/frameDt, ph:f._phA, flash:hitFlashAt(0)};
  const B={p:pb, sy:by, st:f.StateB, kind:f.KindB, face:faceB, col:getCSS('--b'), reach:doc.Meta.B.Range, who:1, name:doc.Meta.B.Name, hp:f.HpPctB, velX:g.Bx-f.Bx, velMs:Math.abs(g.Bx-f.Bx)/frameDt, ph:f._phB, flash:hitFlashAt(1)};
  // postGame: 승자 도발 · 패자 다운 포즈
  if (postGame && doc.Result.Winner >= 0){
    if (doc.Result.Winner === 0){ A.st='Taunt'; B.st='Down'; }
    else { A.st='Down'; B.st='Taunt'; }
  }
  for (const u of [A,B].sort((m,n)=>m.sy-n.sy)){
    const sc=0.8+0.4*depthN(u.sy);
    if (sprite){ drawGround(u.p.x, u.p.y, sc, u.reach, u.col); drawSprite(u.p.x, u.p.y, sc, u.st, u.kind, u.face, u.velX, u.who, u.velMs, u.ph, u.flash); }
    else drawFighter(u.p.x, u.p.y, sc, u.st, u.face, u.col, u.reach);
    unitTag(u.p.x, u.p.y - 100*sc - 16, u.name, u.hp, u.col);
  }
  // 승리 오버레이
  if (postGame && doc.Result.Winner >= 0){
    const winner = doc.Result.Winner;
    const prog = Math.min(postGameElapsed / 0.8, 1);
    const wname = winner===0 ? doc.Meta.A.Name : doc.Meta.B.Name;
    const wcol  = winner===0 ? getCSS('--a') : getCSS('--b');
    ctx.save();
    ctx.globalAlpha = prog * 0.40; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = prog; ctx.textAlign='center';
    ctx.font='bold 42px system-ui'; ctx.fillStyle=wcol;
    ctx.fillText(wname+' 승리!', W/2, H*0.38);
    ctx.font='18px system-ui'; ctx.fillStyle='#f0e6d6'; ctx.globalAlpha=prog*0.8;
    ctx.fillText(doc.Result.Reason, W/2, H*0.38+36);
    ctx.restore();
  }

  // 팝업 / Decision 핀 (HUD 위로)
  const sp = who => who===0?pa:pb;
  ctx.textAlign='center';
  for (const p of popups){ const age=t-p.t; if(age<0||age>p.life)continue;
    const a=1-age/p.life, s=sp(p.who);
    ctx.globalAlpha=a; ctx.fillStyle=p.col; ctx.font='bold 15px system-ui';
    ctx.fillText(p.text, s.x, s.y-96-(p.rise*(1-a))); ctx.globalAlpha=1; }
  for (const d of decisions){ if(t<d.t||t>d.t+d.dur)continue; const s=sp(d.who);
    ctx.fillStyle=d.who===0?getCSS('--a'):getCSS('--b'); ctx.globalAlpha=.95;
    const txt='🧠 '+d.tag; ctx.font='bold 12px system-ui'; const w=ctx.measureText(txt).width+14;
    roundRect(s.x-w/2, s.y-124, w, 19, 6); ctx.fill();
    ctx.fillStyle='#1a130c'; ctx.fillText(txt, s.x, s.y-110); ctx.globalAlpha=1; }

  // 타격 스파크/플래시 (피격 측 몸통에서 터짐). 무게 있는 타격일수록 크게.
  for (const im of impacts){ const age=t-im.t, life=im.kind==='ko'?0.5:0.26; if(age<0||age>life) continue;
    const s=sp(im.who), cy=s.y-46, a=1-age/life, gr=0.5+age*2.8;
    const big = im.kind==='ko'?54 : im.kind==='down'?38 : im.kind==='guard'?15 : 30;
    ctx.save(); ctx.lineCap='round';
    ctx.globalAlpha=a*a*0.7; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x, cy, big*0.42*gr, 0, 7); ctx.fill();       // 흰 코어 플래시
    ctx.globalAlpha=a*0.5; ctx.fillStyle=im.col;
    ctx.beginPath(); ctx.arc(s.x, cy, big*0.6*gr, 0, 7); ctx.fill();        // 색 플래시
    ctx.globalAlpha=a; ctx.strokeStyle=im.col; ctx.lineWidth=im.kind==='guard'?2:3.5;
    const n = im.kind==='ko'?11 : im.kind==='guard'?4 : 7, r0=5, r1=big*gr;
    for(let i=0;i<n;i++){ const ang=im.t*7.3+i*(6.283/n);
      ctx.beginPath();
      ctx.moveTo(s.x+Math.cos(ang)*r0, cy+Math.sin(ang)*r0*0.7);
      ctx.lineTo(s.x+Math.cos(ang)*r1, cy+Math.sin(ang)*r1*0.7); ctx.stroke(); }
    ctx.restore(); }
  ctx.globalAlpha=1;

  ctx.restore(); // 화면 흔들림 종료

  setBar('hpA', f.HpPctA); setBar('hpB', f.HpPctB);
  setBar('stA', f.StamPctA); setBar('stB', f.StamPctB);
  document.getElementById('scrub').value = duration>0 ? (t/duration*1000)|0 : 0;
  document.getElementById('clock').textContent = `${t.toFixed(1)} / ${duration.toFixed(1)}s`;
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function setBar(id,p){ document.getElementById(id).style.width = Math.max(0,Math.min(1,p))*100+'%'; }
function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// ── 재생 루프 ──
function tick(now){
  if (playing && frames){
    const dt = (now-lastWall)/1000; lastWall = now;
    if (now >= hitstopUntil){            // 히트스톱 중이 아니면 진행
      let adv = dt*speed;
      // 무게 있는 타격 직전까지만 전진 → 그 지점에서 짧게 정지(임팩트에 눈을 멈추게).
      for (const im of impacts){ if (im.stop>0 && im.t>t && im.t<=t+adv){ adv=im.t-t; hitstopUntil=now+im.stop; break; } }
      t += adv;
      if (t >= duration){
        t = duration; setPlaying(false);
        if (doc?.Result?.Winner >= 0){ postGame=true; postGameElapsed=0; }
      }
    }
  } else if (postGame && frames){
    const dt = (now-lastWall)/1000; lastWall = now;
    postGameElapsed += dt;
    if (postGameElapsed >= TAUNT_DUR) postGame = false;
  } else lastWall = now;
  if (frames) render();
  requestAnimationFrame(tick);
}
function setPlaying(p){ playing = p && t < duration;
  document.getElementById('play').textContent = playing ? '⏸ 일시정지' : '▶ 재생';
  if (playing && t>=duration) t=0; }

// ── 입력 ──
document.getElementById('play').onclick = ()=>{ if (t>=duration) t=0; setPlaying(!playing); };
document.getElementById('scrub').oninput = e=>{ t = e.target.value/1000*duration; setPlaying(false); };
document.getElementById('speed').onchange = e=>{ speed = parseFloat(e.target.value); };
const fileEl = document.getElementById('file');
document.getElementById('drop').onclick = ()=> fileEl.click();
fileEl.onchange = e=>{ const f=e.target.files[0]; if(f) f.text().then(load); };
const stage = document.getElementById('stage');
stage.ondragover = e=>{ e.preventDefault(); };
stage.ondrop = e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) f.text().then(load); };
window.onkeydown = e=>{ if(e.code==='Space'){ e.preventDefault(); document.getElementById('play').click(); } };

// 스프라이트 시트(있으면) + 매치 데이터 자동 로드 (http일 때만; file://에선 조용히 실패 → 실루엣/드롭)
loadSprites().finally(()=>
  fetch('viewer.json').then(r=>r.ok?r.text():Promise.reject()).then(load).catch(()=>{}));
requestAnimationFrame(tick);
</script>
