  ctx.drawImage(wcv, 0, 0, W, H);
  ctx.imageSmoothingEnabled = true;           // UI·글자는 다시 부드럽게
  ctx.save(); ctx.translate(shx, shy);
  ctx.translate(CX, CY); if (tilt) ctx.rotate(tilt); ctx.scale(camZoom, camZoom); ctx.translate(-camX, -camY + camLift/camZoom);
  // 간격선 — 11px 글자라 저해상으로 내려가면 못 읽는다. 월드층에서 UI층으로 옮겼다(선이 발밑 위로 온다).
  ctx.save(); ctx.globalAlpha=.35; ctx.strokeStyle='#5a4129'; ctx.setLineDash([4,4]); ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(pa.x,pa.y); ctx.lineTo(pb.x,pb.y); ctx.stroke(); ctx.restore();
  ctx.fillStyle='#6e4f31'; ctx.font='11px system-ui'; ctx.textAlign='center';
  ctx.fillText(`${gap.toFixed(1)}m`, (pa.x+pb.x)/2, (pa.y+pb.y)/2-6);
  // 이름표·상태 스트립은 글자라 저해상으로 내려가면 못 읽는다 → UI층
  for (const u of drawOrder){
    const top = u.p.y - (FIGH*0.83)*u._sc - 16;
    unitTag(u.p.x, top, u.name, u.hp, u.col);
    drawStatusStrip(u.p.x, top, u.bleed, u.who);   // 롤식 디버프 아이콘 스트립 (HP바 아래)
  }
  // 승리 오버레이
  if (postGame && doc.Result.Winner >= 0){
    const winner = doc.Result.Winner;
    const prog = Math.min(postGameElapsed / 0.8, 1);
    const wname = winner===0 ? doc.Meta.A.Name : doc.Meta.B.Name;
    const wcol  = winner===0 ? getCSS('--a') : getCSS('--b');
    ctx.save();
    ctx.globalAlpha = prog * 0.45; ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = prog; ctx.textAlign='center';
    ctx.font='900 44px Cinzel,"Noto Serif KR","Pretendard Variable",serif'; ctx.fillStyle=wcol;
    ctx.shadowColor='rgba(0,0,0,.6)'; ctx.shadowBlur=18; ctx.shadowOffsetY=2;
    ctx.fillText(wname, W/2, H*0.36);
    ctx.shadowBlur=0; ctx.shadowOffsetY=0;
    ctx.font='700 20px "Noto Serif KR","Pretendard Variable",serif'; ctx.fillStyle=getCSS('--gold');
    ctx.fillText('— 승리 —', W/2, H*0.36+30);
    ctx.font='14px "Pretendard Variable",system-ui'; ctx.fillStyle='#f0e6d6'; ctx.globalAlpha=prog*0.8;
    ctx.fillText(doc.Result.Reason, W/2, H*0.36+54);
    ctx.restore();
  }

  // 팝업 / Decision 핀 (HUD 위로)
  const sp = who => who===0?pa:pb;
  ctx.textAlign='center';
  // CC 발생 순간 아이콘 폭발(글자 없음) — 상체 위치
  for (const who of [0,1]){ const s=sp(who); drawStatusBurst(s.x, s.y-58, who); }
  // 데미지 숫자 — 한글 없이 색·크기·표식만. 캐릭터를 가리지 않게 '바깥쪽 어깨'에서 시작해
  // 포물선으로 솟았다 낙하. 시작 방향 = 상대 기준 서 있는 쪽(상대 좌측이면 좌측 어깨). u로만 위치 → 스크럽 안전.
  for (const p of popups){ const age=t-p.t; if(age<0||age>p.life)continue;
    const s=sp(p.who), other=(p.who===0?pb:pa), u=age/p.life;
    const side = (s.x>=other.x) ? 1 : -1;
    const jit = ((p.t*137.5)%1) - 0.5;                    // 연타 겹침 방지(결정론적 미세 산개)
    const shX = s.x + side*(28 + u*15 + jit*7);           // 어깨 → 바깥으로 드리프트
    const up  = 239*u - 284*u*u;                          // 투사체 포물선(솟았다 낙하)
    const shY = s.y - 72 - up + jit*5;
    drawDamage(shX, shY, age, p.life, p); }
  for (const d of decisions){ if(t<d.t||t>d.t+d.dur)continue; const s=sp(d.who), age=t-d.t;
    const isSkill=d.tag&&d.tag.startsWith('SKILL_');   // 무기 액티브([7]) 자동 발동
    const isPasv=d.tag&&d.tag.startsWith('PASV_');    // 성격 패시브([7]§5) proc
    // 스킬·패시브 = 각진 컷인 플레이트(무기 다이아 배지). 지시·전환·감정과 시각 언어를 분리.
    if (isSkill || isPasv){
      const wpn = d.who===0?doc.Meta.A.Weapon:doc.Meta.B.Weapon;
      const nm  = isSkill ? (SKILLKR[d.tag.slice(6)]||d.tag.slice(6)) : (SKILLKR[d.tag.slice(5)]||d.tag.slice(5));
      const other = d.who===0?pb:pa, side = (s.x>=other.x) ? 1 : -1;   // 상대 반대편 = 어깨 바깥
      // 층은 buildPopups에서 시작 시각 기준으로 확정(assignCutinLevels) — 아래가 사라져도 내려오지 않는다.
      const up = d.lvl || 0;
      drawCutin(s.x + side*34, s.y-92 - up*27, side, nm, wpn, isPasv, t-d.t, d.dur); ctx.globalAlpha=1; continue;
    }
    if (d.tag && d.tag.startsWith('TACTIC_')){   // 라니스타 지시 — 눈에 띄는 커맨드 배너
      drawTacticBanner(s.x, s.y-146, 'order', (TAC[d.tag.slice(7)]||d.tag.slice(7)), age, d.dur); ctx.globalAlpha=1; continue; }
    if (d.tag && d.tag.startsWith('ADAPT_')){    // 적 진영 자기 판단 — 같은 배너·강철청으로 구분
      drawTacticBanner(s.x, s.y-146, 'adapt', (TAC['TAC_'+d.tag.slice(6)]||d.tag.slice(6)), age, d.dur); ctx.globalAlpha=1; continue; }
    // 감정·의도(+관계) — 머리 위 작은 반투명 칩(최하 우선순위)
    drawEmotionChip(s.x, s.y-130, (TAGKR[d.tag]||d.tag), d.tag, age, d.dur); ctx.globalAlpha=1; }

  // 타격 스파크/플래시 (피격 측 몸통에서 터짐). 무게 있는 타격일수록 크게.
  for (const im of impacts){ const age=t-im.t, life=im.kind==='ko'?0.5:0.26; if(age<0||age>life) continue;
    const s=sp(im.who), cy=s.y-46, a=1-age/life, gr=0.5+age*2.8;
    const big = im.kind==='ko'?54 : im.kind==='down'?38 : im.kind==='guard'?15 : 30;
    ctx.save(); ctx.lineCap='round';
    ctx.globalAlpha=a*a*0.7; ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(s.x, cy, big*0.42*gr, 0, 7); ctx.fill();       // 흰 코어 플래시
    ctx.globalAlpha=a*0.5; ctx.fillStyle=im.col;
    ctx.beginPath(); ctx.arc(s.x, cy, big*0.6*gr, 0, 7); ctx.fill();        // 색 플래시
    ctx.globalAlpha=a; ctx.strokeStyle=im.col; ctx.lineWidth=im.kind==='guard'?2:3.5;
    const n = im.kind==='ko'?11 : im.kind==='guard'?4 : 7, r0=5, r1=big*gr;
    for(let i=0;i<n;i++){ const ang=im.t*7.3+i*(6.283/n);
      ctx.beginPath();
      ctx.moveTo(s.x+Math.cos(ang)*r0, cy+Math.sin(ang)*r0*0.7);
      ctx.lineTo(s.x+Math.cos(ang)*r1, cy+Math.sin(ang)*r1*0.7); ctx.stroke(); }
    ctx.restore(); }
  ctx.globalAlpha=1;

  ctx.restore(); // 화면 흔들림 종료

  // KO 슬로모 비네트: 결정타의 시간이 느려지는 동안 화면 가장자리가 어두워진다 (t 파생 — 스크럽 안전). 막판 결착=더 짙게·오래.
  if (koSlowT >= 0){
    const d = t - koSlowT;
    const span = koClutch ? 1.1 : 0.7, depth = koClutch ? 0.72 : 0.5, ir = koClutch ? 0.24 : 0.32;
    if (d > -0.15 && d < span){
      const a = d < 0 ? (d+0.15)/0.15 : 1-(d/span);
      const vg = ctx.createRadialGradient(W/2, H/2, H*ir, W/2, H/2, H*0.78);
      vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,`rgba(18,4,2,${(depth*a).toFixed(3)})`);
      ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
      if (koClutch && d > -0.05 && d < 0.5){   // 결정적 순간 백색 섬광
        ctx.fillStyle = `rgba(255,248,232,${(0.28*(1-Math.abs(d)/0.5)).toFixed(3)})`; ctx.fillRect(0,0,W,H);
      }
    }
  }

  drawCrowdMeter(fr);
  drawBottomHud(fr);

  setBar('hpA', f.HpPctA); setBar('hpB', f.HpPctB);
  setBar('stA', f.StamPctA); setBar('stB', f.StamPctB);
  document.getElementById('scrub').value = duration>0 ? (t/duration*1000)|0 : 0;
  document.getElementById('clock').textContent = `${t.toFixed(1)} / ${duration.toFixed(1)}s`;
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function setBar(id,p){ document.getElementById(id).style.width = Math.max(0,Math.min(1,p))*100+'%'; }
// 토큰 조회는 getComputedStyle이라 싸지 않다. HUD가 프레임당 수십 번 읽으므로 1회만 캐시한다.
const _cssMemo = {};
function getCSS(v){
  let x = _cssMemo[v];
  if (x === undefined) x = _cssMemo[v] = getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  return x;
}

// ── 재생 루프 ──
function tick(now){
  if (playing && frames){
    const dt = (now-lastWall)/1000; lastWall = now;
    if (now >= hitstopUntil){            // 히트스톱 중이 아니면 진행
      let adv = dt*speed;
      // KO 슬로모션: 결정타 전후 구간은 시간이 느려진다 (마지막 일격의 무게). 막판 결착=더 깊고 길게.
      if (koSlowT >= 0){
        const pre = koClutch ? 0.35 : 0.15, post = koClutch ? 0.9 : 0.5, scl = koClutch ? 0.14 : 0.25;
        if (t > koSlowT - pre && t < koSlowT + post) adv *= scl;
      }
      // 무게 있는 타격 직전까지만 전진 → 그 지점에서 짧게 정지(임팩트에 눈을 멈추게).
      for (const im of impacts){ if (im.stop>0 && im.t>t && im.t<=t+adv){ adv=im.t-t; hitstopUntil=now+im.stop; break; } }
      const prevT = t;
      t += adv;
      // 하이라이트: 임팩트 구간 밖이면 다음 구간으로 점프 (사이의 대치는 생략)
      if (hlMode && hlWins.length){
        const jumped = hlSkip(t);
        if (jumped > t + 0.01){ t = jumped; lastSfxT = t; }   // 점프 구간의 밀린 sfx 폭주 방지
      }
      playSfxRange(prevT > t ? t : prevT, t);   // 지나간 이벤트 효과음 (합성)
      if (t >= duration){
        t = duration; setPlaying(false);
        revealWinner();   // 재생 완료 — 이제 승자 공개 (스포일러 방지)
        postMatchEnded(); // 게임 셸에 통지 → 결과창
        if (doc?.Result?.Winner >= 0){ postGame=true; postGameElapsed=0; }
      }
    }
  } else if (postGame && frames){
    const dt = (now-lastWall)/1000; lastWall = now;
    postGameElapsed += dt;
    if (postGameElapsed >= TAUNT_DUR) postGame = false;
  } else lastWall = now;
  if (frames) render();
  // 실시간 재생 시각을 부모 셸에 보고 (라이브 화면의 실시간 전술 변경이 현재 시각을 알도록) — 10Hz 스로틀
  if (frames && window.parent !== window && now - lastLiveReport > 100){
    lastLiveReport = now; window.parent.postMessage({liveNow: t}, '*');
  }
  requestAnimationFrame(tick);
}
let lastLiveReport = 0;
function setPlaying(p){ playing = p && t < duration;
  document.getElementById('play').textContent = playing ? '{pause} 일시정지' : '▶ 재생';
  if (playing && t>=duration) t=0; }

// ── 입력 ──
document.getElementById('play').onclick = ()=>{ if (introMode){ endIntro(); return; } if (t>=duration) t=0; setPlaying(!playing); };
cv.addEventListener('click', ()=>{ if (introMode) endIntro(); });   // 인트로 중 클릭 = 건너뛰고 전투 시작
document.getElementById('scrub').oninput = e=>{ t = e.target.value/1000*duration; setPlaying(false);
  if (t >= duration - 0.01){ revealWinner(); postMatchEnded(); } };   // 끝까지 스크럽 = 관전 종료 취급
document.getElementById('speed').onchange = e=>{ speed = parseFloat(e.target.value); };
// 설정: 기본 배속 적용 (index.html 설정 모달 → localStorage)
if (SET.speed){ speed = parseFloat(SET.speed) || 1;
  const sel = document.getElementById('speed'); if ([...sel.querySelectorAll('button')].some(o=>o.dataset.v==String(SET.speed))) sel.value = String(SET.speed); }
document.getElementById('viewmode').onclick = e=>{ viewMode = viewMode==='basic' ? 'zoom' : 'basic';
  e.target.textContent = viewMode==='zoom' ? '줌 추적' : '기본 화면'; };
// 기본이 줌 추적이라 버튼 라벨도 초기 상태에 맞춘다
document.getElementById('viewmode').textContent = viewMode==='zoom' ? '줌 추적' : '기본 화면';
const fileEl = document.getElementById('file');
document.getElementById('drop').onclick = ()=> fileEl.click();
fileEl.onchange = e=>{ const f=e.target.files[0]; if(f) f.text().then(load); };
const stage = document.getElementById('stage');
stage.ondragover = e=>{ e.preventDefault(); };
stage.ondrop = e=>{ e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) f.text().then(load); };
// 시네마 모드([15]§10.18): ?cinema=1 로 들어오거나 C 키로 토글.
// 무대 크기 감시가 setInterval로 돌고 있으므로(fitStageBox) 토글 후 한 번 불러 즉시 맞춘다.
// 시네마 = UI를 걷는 것 + **모니터 전체화면**(브라우저 크롬까지 없앤다).
// requestFullscreen은 사용자 제스처 안에서만 허용되므로, 키/버튼에서 부를 때만 실제로 걸린다.
// ?cinema=1 자동 진입은 UI만 걷고 전체화면은 사용자가 C를 누를 때 붙는다 — 막히면 조용히 넘긴다.
function setCinema(on, gesture){
  document.body.classList.toggle('cinema', !!on);
  if (gesture){
    try {
      if (on && !document.fullscreenElement) document.documentElement.requestFullscreen();
      else if (!on && document.fullscreenElement) document.exitFullscreen();
    } catch(_){}
  }
  fitStageBox(); fitCanvas();
}
// 전체화면을 빠져나가도(F11·Esc) 시네마 레이아웃은 유지한다 — 시네마가 기본 상태이기 때문이다.
// 예전엔 여기서 setCinema(false)를 했는데, 기본이 시네마가 된 지금은 Esc 한 번에 기본값이
// 풀려 버린다. 시네마를 끄는 길은 '시네마 종료' 버튼 하나로 명시한다.
document.addEventListener('fullscreenchange', () => { fitStageBox(); fitCanvas(); });

// ── 시네마 기본 진입([15]§10.21) ─────────────────────────────────────────────
// requestFullscreen은 **사용자 제스처 안에서만** 허용된다. 그래서 두 단계로 나눈다:
//   ① 로드 즉시 시네마 레이아웃 — UI를 걷고 무대를 뷰포트에 꽉 채운다(제스처 불필요).
//   ② 첫 클릭/키 입력에 모니터 전체화면을 붙인다 — 한 번만 시도하고, 막히면 조용히 넘긴다.
// Photino 셸에는 브라우저 크롬이 없으므로 ①만으로도 이미 전체화면이다.
function attachFullscreen(){
  window.removeEventListener('pointerdown', attachFullscreen);
  window.removeEventListener('keydown', attachFullscreen);
  if (document.body.classList.contains('cinema') && !document.fullscreenElement){
    const p = document.documentElement.requestFullscreen();
    if (p && p.catch) p.catch(()=>{});
  }
}
if (_qs.get('cinema') !== '0'){
  setCinema(true);
  window.addEventListener('pointerdown', attachFullscreen);
  window.addEventListener('keydown', attachFullscreen);
}

// 컨트롤 자동 숨김 — 입력이 멎으면 물러난다. 컨트롤 위에 커서가 있는 동안은 타이머를 멈춘다
// (조작 중에 버튼이 사라지면 안 된다).
// 개발자 패널 토글 — ?dev=1 로도 열린다(스크립트 검증용)
function setDev(on){
  const b = document.body;
  b.classList.toggle('devon', on === undefined ? !b.classList.contains('devon') : !!on);
  fitStageBox(); fitCanvas();
}
if (_qs.get('dev') === '1') setDev(true);

const ctrlEl = document.getElementById('devbar');
let idleT = 0;
function wake(){
  document.body.classList.remove('idle');
  clearTimeout(idleT);
  idleT = setTimeout(()=> document.body.classList.add('idle'), 2600);
}
['pointermove','pointerdown','keydown','wheel'].forEach(ev =>
  window.addEventListener(ev, wake, {passive:true}));
ctrlEl.addEventListener('pointerenter', ()=>{ clearTimeout(idleT); document.body.classList.remove('idle'); });
ctrlEl.addEventListener('pointerleave', wake);
wake();
window.onkeydown = e=>{
  if(e.code==='Space'){ e.preventDefault(); document.getElementById('play').click(); }
  else if(e.code==='KeyC'){ setCinema(!document.body.classList.contains('cinema'), true); }
  else if(e.code==='KeyD'){ setDev(); }
  else if(e.code==='Escape' && document.body.classList.contains('cinema')){ setCinema(false, true); }
};

// 스프라이트 시트(있으면) + 매치 데이터 자동 로드 (http일 때만; file://에선 조용히 실패 → 실루엣/드롭)
loadDefaultSprites().finally(()=>
  fetch('viewer.json', {cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject()).then(load).catch(()=>{}));
requestAnimationFrame(tick);
</script>
