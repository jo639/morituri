<link rel="stylesheet" href="theme.css">
<style>
  /* 디자인 토큰(:root)은 theme.css가 단일 출처 */
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 var(--font-body); }
  #wrap{ max-width:920px; margin:0 auto; padding:10px; }
  #top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
  #title{ font-weight:700; color:#e0a878; }
  .team{ display:flex; gap:6px; flex-wrap:wrap; font-size:12px; }
  .chip{ padding:1px 7px; border-radius:5px; }
  .t0{ background:rgba(201,168,76,.18); color:#e9cf8f; border:1px solid rgba(201,168,76,.4); }
  .t1{ background:rgba(176,62,62,.18); color:#e0a0a0; border:1px solid rgba(176,62,62,.4); }
  canvas{ width:100%; height:auto; background:#140f09; border-radius:10px; display:block; }
  #ctl{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  button,select{ background:var(--panel); color:var(--ink); border:1px solid #4a3a26; border-radius:8px; padding:6px 12px; cursor:pointer; }
  #scrub{ flex:1; }
  #banner{ text-align:center; font-size:22px; font-weight:800; margin-top:8px; min-height:26px; }
  #drop{ padding:40px; text-align:center; color:var(--dim); }
</style>
<div id="wrap">
  <div id="top"><span id="title">🥊 패싸움</span>
    <div class="team" id="teamA"></div><span style="color:var(--dim)">VS</span><div class="team" id="teamB"></div></div>
  <canvas id="cv" width="900" height="460"></canvas>
  <div id="ctl">
    <button id="play">⏸ 일시정지</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select>
    <span id="clock">0.0s</span>
  </div>
  <div id="banner"></div>
  <div id="drop" hidden>melee.json 없음</div>
</div>
<script>
const VENUES={ street:{wall:'#2a2c33',f0:'#7c8391',f1:'#4a505c',ring:'rgba(30,34,42,.55)',label:'🍺 뒷골목'},
  bar:{wall:'#3a281c',f0:'#8a6a44',f1:'#5c4128',ring:'rgba(40,26,14,.5)',label:'🍺 선술집'},
  arena:{wall:'#5a4129',f0:'#e9cda2',f1:'#c49a6b',ring:'rgba(110,79,49,.4)',label:'🏛 콜로세움'} };
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const W=cv.width, H=cv.height, PAD=60;
const CX=W/2, CY=H*0.56, RX=W/2-PAD, RY=(W/2-PAD)*0.36;
let doc=null, frames=[], dur=0, t=0, playing=true, speed=1, last=0, R=9, V=VENUES.arena, revealed=false;

function proj(sx,sy){ return { x:CX+sx/R*RX, y:CY+sy/R*RY }; }
function mPx(){ return RX/R; }
const REACH={ SWORD:2.4,SPEAR:3.9,AXE:2.1,GREATSWORD:3.0,DUALBLADES:1.65,HAMMER:1.95,WHIP:4.5,SHIELD:2.25 };
function shade(hex,f){ const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255; return `rgb(${r*f|0},${g*f|0},${b*f|0})`; }
function poseColor(state){ if(state==='Guard')return'#6fa8dc'; if(state==='Stagger'||state==='HitStun'||state==='Down'||state==='GetUp')return'#9aa3af'; if(state==='Taunt')return'#ffd24a'; return null; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
// viewer.html 이식: FighterState별 자세 실루엣(스프라이트 없이도 윈드업/액티브/가드/스태거/다운)
function drawFighter(fx,fy,scale,state,facing,baseCol,reach){
  const col=poseColor(state)||baseCol, dark=shade(col.startsWith('#')?col:'#888888',0.62);
  ctx.save(); ctx.globalAlpha=.15; ctx.strokeStyle=col; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(fx,fy,reach*mPx(),reach*mPx()*(RY/RX),0,0,7); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha=.3; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(fx,fy,10*scale,4*scale,0,0,7); ctx.fill(); ctx.restore();
  if(state==='Down'){ ctx.fillStyle=col; ctx.strokeStyle=dark; ctx.lineWidth=1.5*scale;
    ctx.save(); ctx.translate(fx,fy-5*scale); ctx.scale(facing,1);
    roundRect(-20*scale,-5*scale,34*scale,10*scale,5*scale); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-22*scale,0,7*scale,0,7); ctx.fill(); ctx.stroke(); ctx.restore(); return; }
  const H0=80*scale; let lean=0,crouch=0;
  if(state==='HitStun'||state==='Stagger')lean=-facing*0.30;
  const cy=v=>v+crouch*H0*0.28, hip=cy(fy-H0*0.42), sh=cy(fy-H0*0.80), hd=cy(fy-H0*0.95), sx=fx+lean*16*scale;
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle=dark; ctx.lineWidth=5*scale;
  ctx.beginPath(); ctx.moveTo(fx,hip); ctx.lineTo(fx-6*scale,fy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx,hip); ctx.lineTo(fx+6*scale,fy); ctx.stroke();
  ctx.strokeStyle=dark; ctx.lineWidth=2*scale; ctx.fillStyle=col;
  const bw=11*scale,bx0=Math.min(fx,sx)-bw/2,bw2=bw+Math.abs(sx-fx);
  roundRect(bx0,sh,bw2,hip-sh,bw/2); ctx.fill(); ctx.stroke();
  let arm; switch(state){ case'Windup':arm=-2.3;break; case'Active':arm=0;break; case'Recovery':arm=0.5;break;
    case'Guard':arm=-1.2;break; case'Stagger':case'HitStun':arm=-2.6;break; default:arm=0.9; }
  const aL=(state==='Active'?22:16)*scale, ax=sx+facing*Math.cos(arm)*aL, ay=sh+Math.sin(arm)*aL;
  ctx.strokeStyle=col; ctx.lineWidth=4*scale; ctx.beginPath(); ctx.moveTo(sx,sh+2*scale); ctx.lineTo(ax,ay); ctx.stroke();
  const wl=(state==='Active'?reach*mPx()*0.6:16*scale);
  ctx.strokeStyle='#d8cdb8'; ctx.lineWidth=2.5*scale; ctx.globalAlpha=(state==='Active')?1:.85;
  ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(ax+facing*Math.cos(arm)*wl,ay+Math.sin(arm)*wl); ctx.stroke(); ctx.globalAlpha=1;
  ctx.fillStyle=col; ctx.strokeStyle=dark; ctx.lineWidth=2*scale;
  ctx.beginPath(); ctx.arc(sx+lean*4,hd,8.5*scale,0,7); ctx.fill(); ctx.stroke();
  if(state==='Active'){ ctx.save(); ctx.globalAlpha=.6; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.arc(ax+facing*Math.cos(arm)*wl,ay+Math.sin(arm)*wl,4*scale,0,7); ctx.stroke(); ctx.restore(); }
}

// ── 스프라이트 시스템 (viewer.html 이식, N인 일반화) ──
const _fcv=document.createElement('canvas'), _fctx=_fcv.getContext('2d');
let defaultSprite=null; const spriteSets={};
function spriteFor(weapon){ return spriteSets['WPN_'+weapon]||spriteSets[weapon]||defaultSprite; }
function poseFor(state,heavy){ switch(state){
  case 'Move':case 'Dodge':return 'walk'; case 'Guard':return 'guard';
  case 'Windup':return heavy?'heavy_windup':'light_attack';
  case 'Active':case 'Recovery':return heavy?'heavy_attack':'light_attack';
  case 'HitStun':case 'Stagger':return 'hurt'; case 'Down':case 'GetUp':return 'down';
  default:return 'idle'; } }
async function loadSpriteSet(jsonFile){
  try{
    const cfg=await (await fetch('sprites/'+jsonFile+'?'+Date.now())).json();
    const img=new Image(); await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src='sprites/'+cfg.image;});
    const anims={},imgCache={};
    for(const [name,a] of Object.entries(cfg.animations||{})){
      if(!imgCache[a.image]){ const ai=new Image(); await new Promise((res,rej)=>{ai.onload=res;ai.onerror=rej;ai.src='sprites/'+a.image;}); imgCache[a.image]=ai; }
      const holds=Array.isArray(a.holds)&&a.holds.length===a.frames.length?a.holds:null;
      anims[name]={img:imgCache[a.image],fps:a.fps||12,frames:a.frames,refH:a.refH,baseSpeed:a.baseSpeed||0,holds,holdTot:holds?holds.reduce((s,x)=>s+x,0):0};
    }
    return { img, frames:cfg.frames, srcFlip:cfg.facing==='left', anims };
  }catch(e){ return null; }
}
async function loadSprites(weapons){
  defaultSprite=await loadSpriteSet('sprites.json');
  for(const w of weapons){ const id='WPN_'+w; if(id in spriteSets)continue; spriteSets[id]=(await loadSpriteSet(id+'.json'))||defaultSprite; }
}
function drawGround(fx,fy,scale,reach,col){
  ctx.save(); ctx.globalAlpha=.20; ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(fx,fy,16*scale,6*scale,0,0,7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha=.15; ctx.strokeStyle=col; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(fx,fy,reach*mPx(),reach*mPx()*(RY/RX),0,0,7); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha=.3; ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(fx,fy,10*scale,4*scale,0,0,7); ctx.fill(); ctx.restore();
}
function drawSprite(spr,fx,fy,scale,state,heavy,facing,ph,walkPhase,flash){
  let anim=null;
  if(spr.anims){
    if(state==='Move'||state==='Dodge') anim=spr.anims.walk_fwd||spr.anims.walk;
    else if(state==='Windup'||state==='Active'||state==='Recovery') anim=heavy?spr.anims.heavy_attack:spr.anims.light_attack;
    else if(state==='HitStun'||state==='Stagger') anim=spr.anims.hurt_heavy||spr.anims.hurt_light||spr.anims.hurt;
  }
  let fr,srcImg;
  if(anim?.frames?.length){
    let fi;
    if(ph!=null){
      if(anim.holds){ const target=ph*anim.holdTot; let acc=0,ix=0; for(ix=0;ix<anim.holds.length;ix++){acc+=anim.holds[ix]; if(target<acc)break;} fi=Math.min(anim.frames.length-1,ix); }
      else fi=Math.min(anim.frames.length-1,Math.max(0,Math.round(ph*(anim.frames.length-1))));
    } else if(walkPhase!=null){ fi=Math.floor(walkPhase)%anim.frames.length; }
    else fi=Math.floor(t*(anim.fps||12))%anim.frames.length;
    fr=anim.frames[fi]; srcImg=anim.img;
  } else { fr=spr.frames[poseFor(state,heavy)]||spr.frames.idle; srcImg=spr.img; }
  if(!fr) return false;
  const refH=(anim?.refH)||fr.refH||spr.frames.idle.h, k=(120*scale)/refH, w=fr.w*k, h=fr.h*k;
  const flip=(facing<0)!==spr.srcFlip;
  ctx.save(); ctx.translate(fx,fy); if(flip)ctx.scale(-1,1); ctx.imageSmoothingEnabled=true;
  ctx.drawImage(srcImg,fr.x,fr.y,fr.w,fr.h,-w/2,-h,w,h);
  if(flash>0){ const iw=Math.max(1,Math.ceil(w)),ih=Math.max(1,Math.ceil(h)); _fcv.width=iw; _fcv.height=ih;
    _fctx.drawImage(srcImg,fr.x,fr.y,fr.w,fr.h,0,0,w,h); _fctx.globalCompositeOperation='source-atop';
    _fctx.fillStyle='#fff'; _fctx.globalAlpha=Math.min(1,flash); _fctx.fillRect(0,0,iw,ih);
    _fctx.globalCompositeOperation='source-over'; _fctx.globalAlpha=1; ctx.drawImage(_fcv,-w/2,-h,w,h); }
  ctx.restore(); return true;
}

// ── N인 위상 사전계산: 공격/피격 구간 진행률 + 걷기 위상 (프레임 기반, 스크럽 안전) ──
let UPH=[], UWALK=[];   // [unit][frameIdx]
function buildPhases(){
  const nU=doc.Units.length, nF=frames.length; UPH=[]; UWALK=[];
  const grpOf=s=>(s==='Windup'||s==='Active'||s==='Recovery')?'atk':(s==='HitStun'||s==='Stagger')?'hurt':null;
  for(let j=0;j<nU;j++){
    const ph=new Array(nF).fill(null), wp=new Array(nF).fill(0);
    // 공격/피격 구간 진행률
    let i=0; while(i<nF){ const g=grpOf(frames[i].u[j].s); if(!g){i++;continue;}
      let e=i; while(e<nF&&grpOf(frames[e].u[j].s)===g)e++; const span=e-i;
      for(let m=i;m<e;m++) ph[m]=span<=1?0:(m-i)/(span-1); i=e; }
    // 걷기 위상 — Move일 때 이동거리 비례 누적(단조)
    let acc=0; for(let i2=1;i2<nF;i2++){ const a=frames[i2-1].u[j],b=frames[i2].u[j];
      if(b.s==='Move'||b.s==='Dodge'){ const d=Math.hypot(b.x-a.x,b.y-a.y); acc+=Math.max(0.15, d*3.0); } wp[i2]=acc; }
    UPH.push(ph); UWALK.push(wp);
  }
}
function frameIdxAt(time){ let i=0; while(i<frames.length-1&&frames[i+1].t<=time)i++; return i; }

async function boot(){
  try{ doc=await (await fetch('melee.json?t='+Date.now())).json(); }
  catch(e){ document.getElementById('drop').hidden=false; return; }
  frames=doc.Frames||[]; dur=frames.length?frames[frames.length-1].t:0;
  V=VENUES[doc.Venue]||VENUES.arena;
  R=Math.max(9, Math.ceil(Math.max(...frames.flatMap(f=>f.u.map(u=>Math.max(Math.abs(u.x),Math.abs(u.y)))))+1));
  document.getElementById('title').textContent = '🥊 패싸움 · '+V.label;
  const A=[],B=[]; (doc.Units||[]).forEach(u=>(u.Team===0?A:B).push(u.Name));
  document.getElementById('teamA').innerHTML = A.map(n=>`<span class="chip t0">${n}</span>`).join('');
  document.getElementById('teamB').innerHTML = B.map(n=>`<span class="chip t1">${n}</span>`).join('');
  buildPhases();
  await loadSprites([...new Set((doc.Units||[]).map(u=>u.Weapon))]);   // 무기별 스프라이트 확보
  t=0; playing=true; revealed=false; last=performance.now(); requestAnimationFrame(loop);
}

function frameAt(time){
  if(!frames.length) return null;
  const i=frameIdxAt(time);
  const a=frames[i], b=frames[Math.min(i+1,frames.length-1)];
  const span=Math.max(1e-3,b.t-a.t), k=Math.min(1,Math.max(0,(time-a.t)/span));
  return a.u.map((ua,j)=>{ const ub=b.u[j]||ua; return {   // 위치만 보간, 상태·방향은 현재 프레임
    x:ua.x+(ub.x-ua.x)*k, y:ua.y+(ub.y-ua.y)*k, h:ua.h, sp:ua.sp, s:ua.s, f:ua.f, hv:ua.hv, bl:ua.bl, ht:ua.ht, d:ua.d,
    fi:i, uj:j, team:doc.Units[j].Team, name:doc.Units[j].Name, weapon:doc.Units[j].Weapon }; });
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // 바닥
  ctx.save();
  ctx.fillStyle=V.wall; ctx.beginPath(); ctx.ellipse(CX,CY+4,RX+7,RY+7,0,0,7); ctx.fill();
  const grd=ctx.createRadialGradient(CX,CY-RY*.3,8,CX,CY,RX);
  grd.addColorStop(0,V.f0); grd.addColorStop(1,V.f1);
  ctx.fillStyle=grd; ctx.beginPath(); ctx.ellipse(CX,CY,RX,RY,0,0,7); ctx.fill();
  ctx.strokeStyle=V.wall; ctx.lineWidth=4; ctx.stroke();
  ctx.strokeStyle=V.ring; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(CX,CY,RX*.92,RY*.92,0,0,7); ctx.stroke();
  ctx.restore();

  const us=frameAt(t); if(!us) return;
  // 깊이 정렬(뒤→앞) — 앞쪽(y 큰) 나중에 그려 겹침 자연스럽게
  const order=us.map((u,i)=>i).sort((p,q)=>us[p].y-us[q].y);
  for(const i of order){
    const u=us[i], pp=proj(u.x,u.y), sc=0.62+(u.y/R+1)/2*0.42;
    const teamCol = u.team===0 ? '#c9a84c' : '#d96a5a';
    const reach = REACH[u.weapon]||2.4;
    const spr=spriteFor(u.weapon);
    const ph=UPH[u.uj]?UPH[u.uj][u.fi]:null, wp=UWALK[u.uj]?UWALK[u.uj][u.fi]:null;
    const flash=u.ht?0.8:0;
    let drawn=false;
    if(spr){ drawGround(pp.x,pp.y,sc,reach,teamCol);   // 팀색 글로우+사거리 링
      drawn=drawSprite(spr,pp.x,pp.y,sc,u.s,u.hv,u.f,ph,(u.s==='Move'||u.s==='Dodge')?wp:null,flash); }
    if(!drawn) drawFighter(pp.x, pp.y, sc, u.s, u.f, teamCol, reach);   // 스프라이트 없으면 자세 실루엣
    // 이름 + HP바 + 스태미나 + 출혈 (머리 위)
    const topY = pp.y - 120*sc - 6*sc;
    ctx.save(); ctx.textAlign='center'; ctx.font=`bold ${Math.round(10*sc)}px system-ui`;
    const nw=ctx.measureText(u.name).width+8;
    ctx.fillStyle='rgba(15,10,6,.6)'; roundRect(pp.x-nw/2-2,topY-2,nw+4,12*sc,3); ctx.fill();
    ctx.fillStyle=teamCol; ctx.fillText(u.name,pp.x,topY+8*sc);
    if(!u.d){
      ctx.fillStyle='#0c0f14'; ctx.fillRect(pp.x-16*sc,topY+11*sc,32*sc,4*sc);
      ctx.fillStyle=u.h>.3?'#7ec97e':'#e07070'; ctx.fillRect(pp.x-16*sc,topY+11*sc,32*sc*u.h,4*sc);
      ctx.fillStyle='#0c0f14'; ctx.fillRect(pp.x-16*sc,topY+16*sc,32*sc,2.5*sc);
      ctx.fillStyle='#d9b15a'; ctx.fillRect(pp.x-16*sc,topY+16*sc,32*sc*(u.sp||0),2.5*sc);
      if(u.bl>0){ ctx.font=`${Math.round(9*sc)}px system-ui`; ctx.fillText('🩸'.repeat(u.bl),pp.x,topY-4*sc); }
    }
    ctx.restore();
  }
}

function loop(now){
  const dt=Math.min(.1,(now-last)/1000); last=now;
  if(playing){ t+=dt*speed; if(t>=dur){ t=dur; playing=false; reveal(); } }
  document.getElementById('scrub').value=dur?t/dur*1000:0;
  document.getElementById('clock').textContent=t.toFixed(1)+'s';
  document.getElementById('play').textContent=playing?'⏸ 일시정지':'▶ 재생';
  draw();
  requestAnimationFrame(loop);
}
function reveal(){ if(revealed||!doc)return; revealed=true;
  const w=doc.Result.WinningTeam;
  const names=(doc.Units||[]).filter(u=>u.Team===w).map(u=>u.Name).join('·');
  document.getElementById('banner').innerHTML = `<span style="color:${w===0?'#e9cf8f':'#e0a0a0'}">${w===0?'🏆 우리 편 승리':'💢 패배'} — ${names}</span>`;
  if(window.parent!==window) window.parent.postMessage({matchEnded:true},'*');
}
document.getElementById('play').onclick=()=>{ if(t>=dur)t=0,revealed=false,document.getElementById('banner').textContent=''; playing=!playing; };
document.getElementById('scrub').oninput=e=>{ t=e.target.value/1000*dur; playing=false; if(t<dur){revealed=false;document.getElementById('banner').textContent='';} };
document.getElementById('speed').onchange=e=>speed=parseFloat(e.target.value);
boot();
</script>
