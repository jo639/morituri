<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MORITURI</title>
<style>
  :root{ --bg:#231a12; --panel:#2f2418; --panel2:#3a2d1d; --ink:#f0e6d6; --dim:#a89576; --gold:#c9a84c;
         --a:#5b9be0; --b:#e0685f; --grn:#8fc98f; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,"Segoe UI","Malgun Gothic",sans-serif;
        display:flex; flex-direction:column; }
  button{ font:inherit; cursor:pointer; }
  /* ── 상단 바 ── */
  #top{ display:flex; align-items:center; gap:12px; padding:8px 16px; background:var(--panel);
        border-bottom:1px solid #4a3a26; flex:0 0 auto; }
  #logo{ font-weight:800; letter-spacing:1px; color:var(--gold); cursor:pointer; }
  nav{ display:flex; gap:2px; }
  nav button{ background:none; border:none; color:var(--dim); padding:6px 12px; border-radius:7px; }
  nav button.on{ background:#3a2d1d; color:var(--ink); font-weight:700; }
  #gold{ color:var(--gold); font-weight:700; }
  #status{ margin-left:auto; color:var(--dim); font-size:12px; }
  #next{ background:var(--gold); color:#231a12; border:none; font-weight:800; padding:7px 16px; border-radius:8px; }
  #next:disabled{ opacity:.4; cursor:default; }
  /* ── 화면 ── */
  #screens{ flex:1 1 auto; position:relative; min-height:0; }
  .screen{ position:absolute; inset:0; display:none; overflow:auto; }
  .screen.on{ display:block; }
  .screen > .pad{ padding:16px; max-width:1100px; margin:0 auto; }
  iframe{ width:100%; height:100%; border:0; background:var(--bg); }
  h2{ font-size:13px; color:var(--gold); margin:20px 0 8px; letter-spacing:.5px; border-bottom:1px solid #4a3a26; padding-bottom:4px; }
  .note{ color:var(--dim); font-size:12px; }
  .err{ color:var(--b); font-size:12px; min-height:16px; }
  /* 배너(수입) */
  #incomeBar{ display:none; margin:10px 0; padding:8px 14px; background:var(--panel2); border-left:3px solid var(--gold);
              border-radius:7px; font-size:13px; }
  /* 관전 */
  #watchbar{ position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:12px;
             padding:6px 16px; background:rgba(35,26,18,.92); border-bottom:1px solid #4a3a26; z-index:5; }
  #watchbar .card{ font-weight:700; }
  #watchbar .tag{ font-size:11px; color:var(--gold); border:1px solid var(--gold); border-radius:4px; padding:0 6px; }
  #watchbar button{ margin-left:auto; background:#3a2d1d; color:var(--ink); border:1px solid #4a3a26; padding:4px 12px; border-radius:7px; }
  #watch iframe{ padding-top:36px; }
  /* 카드 그리드 */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:12px; }
  .fc{ background:var(--panel); border-radius:11px; padding:12px 14px; border-top:3px solid var(--gold); }
  .fc.ai{ border-top-color:#5a4a32; }
  .fc h3{ margin:0; font-size:16px; display:flex; align-items:center; gap:6px; }
  .fc h3 .old{ color:var(--b); font-size:11px; }
  .fc .bd{ color:var(--dim); font-size:11px; margin:2px 0 6px; }
  .fc .row{ display:flex; justify-content:space-between; font-size:12px; padding:1px 0; }
  .fc .row b{ color:var(--gold); font-weight:600; }
  .chips{ margin-top:5px; }
  .chip{ display:inline-block; font-size:10px; background:rgba(120,170,90,.18); color:#9bd17a; border-radius:3px; padding:0 5px; margin:1px 3px 0 0; }
  .chip.tac{ background:rgba(91,155,224,.15); color:#9bc4ec; cursor:default; }
  .chip.tac.cur{ outline:1px solid var(--a); font-weight:700; }
  .chip.hid{ background:rgba(160,140,110,.15); color:var(--dim); }
  /* 스탯 훈련 그리드 */
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px 10px; margin-top:6px; font-size:12px; }
  .stats .st{ display:flex; justify-content:space-between; align-items:center; gap:4px; }
  .stats .st span{ color:var(--dim); }
  .stats .st button{ background:#4a3a26; border:none; color:var(--gold); border-radius:4px; padding:0 6px; font-size:12px; line-height:18px; }
  .cap{ height:6px; background:#0c0f14; border-radius:3px; margin-top:6px; overflow:hidden; }
  .cap > i{ display:block; height:100%; background:linear-gradient(90deg,#8a6a2a,var(--gold)); }
  /* 시설 */
  .fac{ display:flex; gap:10px; flex-wrap:wrap; }
  .fac .f{ flex:1 1 240px; background:var(--panel); border-radius:10px; padding:10px 12px; }
  .fac .f b{ color:var(--gold); }
  .fac .f button{ margin-top:6px; background:#4a3a26; border:none; color:var(--ink); border-radius:6px; padding:4px 10px; }
  /* 영입 */
  #gachaBtn{ background:var(--gold); color:#231a12; border:none; font-weight:800; padding:9px 20px; border-radius:9px; }
  .cand{ border-top-color:var(--a); }
  .cand .recruit{ margin-top:8px; width:100%; background:#3a5a3a; border:none; color:#d6f0d6; font-weight:700; padding:6px; border-radius:7px; }
  /* 전술 모달 */
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:60; }
  .modal.on{ display:flex; }
  .mbox{ background:var(--panel); border:1px solid #4a3a26; border-radius:14px; padding:20px 22px; width:min(560px,92vw); }
  .mbox h3{ margin:0 0 4px; color:var(--gold); }
  .mbox .vsline{ font-size:13px; color:var(--dim); margin-bottom:12px; }
  .tacbtn{ display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid #4a3a26;
           color:var(--ink); border-radius:9px; padding:9px 12px; margin-top:8px; }
  .tacbtn:hover{ border-color:var(--gold); }
  .tacbtn b{ color:var(--gold); }
  .tacbtn .d{ font-size:11px; color:var(--dim); }
  .rrow{ display:flex; gap:8px; align-items:baseline; padding:3px 0; font-size:13px; }
  .rrow span:first-child{ min-width:110px; color:var(--dim); }
  .rrow b{ color:var(--gold); }
  .rrow .d{ font-size:11px; color:var(--dim); }
  /* 메뉴 */
  #menu{ position:fixed; inset:0; background:radial-gradient(circle at 50% 42%, #2a2016, #16100a);
         display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; z-index:50; }
  #menu h1{ font-size:52px; letter-spacing:10px; color:var(--gold); margin:0 0 4px; font-weight:800; }
  #menu .tag{ color:var(--dim); letter-spacing:3px; font-size:12px; margin-bottom:28px; }
  #menu button{ width:240px; padding:12px; font-size:15px; font-weight:700; border-radius:9px;
                border:1px solid #4a3a26; background:var(--panel); color:var(--ink); }
  #menu button:hover{ border-color:var(--gold); }
  #menu .info{ color:var(--dim); font-size:12px; margin-top:20px; }
</style>
</head>
<body>
<div id="top">
  <span id="logo">⚔ MORITURI</span>
  <nav>
    <button data-s="league" class="on">리그</button>
    <button data-s="ludus">루두스</button>
    <button data-s="market">영입</button>
    <button data-s="roster">로스터</button>
    <button data-s="watch">관전</button>
  </nav>
  <span id="ludus" title="루두스 등급" style="color:var(--gold);font-weight:700;font-size:12px"></span>
  <span id="gold">💰 —</span>
  <span id="status">—</span>
  <button id="next">다음 경기 ▶</button>
  <button id="cfgBtn" title="설정" style="background:none;border:none;color:var(--dim);font-size:16px">⚙</button>
</div>

<div id="screens">
  <div class="screen on" id="league">
    <div class="pad" style="padding-bottom:0"><div id="incomeBar"></div></div>
    <iframe id="leagueF" src="league.html" style="height:calc(100% - 0px)"></iframe>
  </div>

  <div class="screen" id="ludus"><div class="pad">
    <div id="repBox" style="background:var(--panel);border-radius:11px;padding:12px 16px;margin-bottom:14px;border-top:3px solid var(--gold)"></div>
    <h2>내 루두스 <span class="note" id="ludusNote"></span></h2>
    <div class="grid" id="myGrid"></div>
    <h2>시설</h2>
    <div class="fac" id="facRow"></div>
    <h2>🏆 챔피언십 컵 <span class="note">(정규시즌 후 상위 4인 토너먼트)</span></h2>
    <div id="cupBox"></div>
    <h2>🎖 업적</h2>
    <div id="achGrid" style="display:flex;flex-wrap:wrap;gap:8px"></div>
    <div class="err" id="ludusErr"></div>
  </div></div>

  <div class="screen" id="market"><div class="pad">
    <h2>검투사 시장 <span class="note" id="marketNote"></span></h2>
    <button id="gachaBtn">🎲 뽑기</button>
    <span class="note">  후보 3명 — 무기·성격·전술 하나만 공개. 천부·잠재력·특성은 영입해야 안다.</span>
    <div class="err" id="marketErr"></div>
    <div class="grid" id="candGrid" style="margin-top:12px"></div>
  </div></div>

  <div class="screen" id="roster"><div class="pad">
    <h2>리그 로스터 <span class="note">(공개 정보)</span></h2>
    <div class="grid" id="rosterGrid"></div>
  </div></div>

  <div class="screen" id="watch">
    <div id="watchbar"><span class="card" id="watchCard">—</span><span class="tag" id="watchTag" hidden>이벤트</span>
      <button id="skipBtn" hidden onclick="fireResult()">⏭ 결과 보기</button>
      <button onclick="go('league')">리그로 →</button></div>
    <iframe id="watchF" src="about:blank"></iframe>
  </div>
</div>

<div class="modal" id="tacModal"><div class="mbox">
  <h3 id="tmTitle">전술 지시</h3>
  <div class="vsline" id="tmVs"></div>
  <div id="tmOpts"></div>
</div></div>

<div class="modal" id="seasonModal"><div class="mbox">
  <h3 id="ssTitle" style="font-size:22px; color:var(--gold)">—</h3>
  <div class="vsline" id="ssChamp"></div>
  <div class="vsline" id="ssCup"></div>
  <div id="ssAch"></div>
  <table style="width:100%; border-collapse:collapse; font-size:13px; margin:6px 0" id="ssTable"></table>
  <div id="ssMoney" class="rrow"></div>
  <div id="ssAging"></div>
  <div id="ssStory" class="rrow"></div>
  <button class="tacbtn" style="text-align:center; margin-top:12px" onclick="$('seasonModal').classList.remove('on'); go('league')">다음 시즌으로 →</button>
</div></div>

<div class="modal" id="profModal"><div class="mbox" style="max-width:560px">
  <div id="profBody"></div>
  <button class="tacbtn" style="text-align:center; margin-top:12px" onclick="$('profModal').classList.remove('on')">닫기</button>
</div></div>

<div class="modal" id="cfgModal"><div class="mbox">
  <h3 style="color:var(--gold)">⚙ 설정</h3>
  <div class="rrow" style="margin-top:8px"><span>관전 기본 배속</span>
    <select id="cfgSpeed" style="background:var(--panel2);color:var(--ink);border:1px solid #4a3a26;border-radius:6px;padding:3px 8px">
      <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option>
    </select></div>
  <div class="rrow"><span>승자 미리 표시</span>
    <label><input type="checkbox" id="cfgSpoiler"> <span class="d">관전 시작부터 승자 공개 (기본: 재생 완료 후 공개)</span></label></div>
  <div class="rrow"><span>효과음</span>
    <label><input type="checkbox" id="cfgSound" checked> <span class="d">타격·KO·함성 (합성음)</span></label></div>
  <div class="rrow"><span>단축키</span><span class="d">Space/N = 다음 경기 · 1~5 = 탭 전환</span></div>
  <div style="display:flex; gap:8px; margin-top:14px">
    <button class="tacbtn" style="flex:1; text-align:center" onclick="$('menu').style.display='flex'; $('cfgModal').classList.remove('on')">메인 메뉴</button>
    <button class="tacbtn" style="flex:1; text-align:center" onclick="$('cfgModal').classList.remove('on')">닫기</button>
  </div>
</div></div>

<div class="modal" id="resModal"><div class="mbox">
  <h3 id="resTitle" style="font-size:24px">—</h3>
  <div class="vsline" id="resVs"></div>
  <div id="resBody"></div>
  <div style="display:flex; gap:8px; margin-top:14px">
    <button class="tacbtn" style="flex:1; text-align:center" onclick="watchReplay()">🎬 리플레이 관전</button>
    <button class="tacbtn" style="flex:1; text-align:center" onclick="closeResult()">확인</button>
  </div>
</div></div>

<div id="menu">
  <h1>MORITURI</h1>
  <div class="tag">MORITURI TE SALUTANT — 곧 죽을 자들이 경례합니다</div>
  <button id="mCont">계속하기</button>
  <button id="mNew">새 커리어</button>
  <div class="info" id="mInfo">—</div>
</div>

<script>
const WPN={SWORD:'검',SPEAR:'창',AXE:'도끼',GREATSWORD:'대검',DUALBLADES:'쌍검',HAMMER:'망치',WHIP:'채찍',SHIELD:'방패'};
const PER={CALM:'냉철',RECKLESS:'충동',ARROGANT:'오만',HONORABLE:'고결',COWARD:'겁쟁이',SHOWMAN:'쇼맨',OPPORTUNIST:'기회주의',CRUEL:'잔혹',BOLD:'대담',WARY:'신중'};
const TAC={BALANCED:'균형',PRESSURE:'압박',COUNTER:'카운터',ZONER:'견제',BRAWLER:'난전',DEFENDER:'방어',DECISION:'결단',HUNTER:'사냥꾼',GAMBLER:'도박',EVADER:'회피'};
const TACD={BALANCED:'범용 만능형',PRESSURE:'근접 압박 — 카이터 사냥',COUNTER:'거리 유지·후딜 반격',ZONER:'최장거리 견제',BRAWLER:'초근접 난타',DEFENDER:'가드 중심 수비',DECISION:'신중한 판정 노림',HUNTER:'약해진 사냥감 추적',GAMBLER:'고위험 도박',EVADER:'회피 중심'};
const w=k=>WPN[k]||k, p=k=>PER[k]||k, t=k=>TAC[k]||k;
const $=id=>document.getElementById(id);
const epi=arr=>(arr&&arr.length)?`<div class="chips" style="margin:2px 0 4px">${arr.map(x=>`<span class="chip" style="background:rgba(201,168,76,.16);color:var(--gold);border:1px solid rgba(201,168,76,.4)">${x}</span>`).join('')}</div>`:'';
let st=null;

// ── 선수 상세(서사) 창 ──
async function openProfile(id){
  const f = await api('/api/fighter',{id});
  if (f.error) return;
  const S=f.Stats, axes=[['ATK',S.Atk],['DEF',S.Def],['HP',S.Hp],['SPD',S.Spd],['ASPD',S.Aspd],['RCT',S.Rct]];
  const rel = f.Relations.length ? f.Relations.map(r=>
    `<div class="row"><span>${r.RelIcon} <b style="color:var(--b)">${r.RelName}</b> — ${r.OppName}${r.OppIsMine?' <span class="chip">우리</span>':''}</span><b>${r.W}-${r.L} (${r.Enc}전)</b></div>`).join('')
    : '<div class="note">아직 특별한 인연이 없다.</div>';
  const chron = f.Chronicle.length ? f.Chronicle.map(c=>`<div class="rrow"><span class="d">${c}</span></div>`).join('') : '<div class="note">기록될 무용담이 아직 없다.</div>';
  $('profBody').innerHTML = `
    <h3 style="color:var(--gold);font-size:20px;margin:0">${f.Name}${f.IsPlayer?' <span class="chip">내 루두스</span>':''}</h3>
    ${epi(f.Epithets)}
    <div class="bd">${w(f.Weapon)} · ${p(f.Personality)} · ${f.Age}세 ${f.Aging?'<span class="old">노쇠</span>':''} · <b style="color:var(--gold)">${f.Talent}</b> / 잠재 ${f.Potential}</div>
    <div class="chips">${f.Traits.map(x=>`<span class="chip">${x}</span>`).join('')}${(f.Emotions||[]).map(x=>`<span class="chip" style="background:rgba(201,168,76,.18);color:var(--gold)">💭 ${x}</span>`).join('')}</div>
    <div class="stats" style="margin-top:8px">${axes.map(([a,v])=>`<div class="st"><span>${a}</span> ${v}</div>`).join('')}</div>
    <div class="row" style="margin-top:6px"><span>시즌 / 통산</span><b>${f.W}-${f.L}-${f.D} / ${f.CW}-${f.CL}-${f.CD} (KO ${f.CKoW})</b></div>
    <div class="row"><span>명성 / 인기 / 우승</span><b>${f.Fame} / ${f.Popularity} / 🏆${f.Titles}</b></div>
    <div class="row"><span>전술풀</span><b>${f.TacticPool.map(x=>t(x)+(x===f.Tactic?'●':'')).join(' · ')}</b></div>
    <h4 style="color:var(--gold);margin:12px 0 4px;font-size:12px">⚔ 관계</h4>${rel}
    <h4 style="color:var(--gold);margin:12px 0 4px;font-size:12px">📜 연대기</h4>${chron}`;
  $('profModal').classList.add('on');
}

function go(s){
  document.querySelectorAll('.screen').forEach(el=>el.classList.toggle('on', el.id===s));
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.s===s));
  if (s==='league') $('leagueF').src='league.html?t='+Date.now();
  if (s==='ludus') renderLudus();
  if (s==='market') renderMarket();
  if (s==='roster') renderRoster();
}
document.querySelectorAll('nav button').forEach(b=> b.onclick=()=>go(b.dataset.s));
$('logo').onclick=()=> $('menu').style.display='flex';

async function api(path, body){
  const r = await fetch(path, body!==undefined ? {method:'POST', body:JSON.stringify(body||{})} : {cache:'no-store'});
  return r.json();
}

async function refresh(){
  st = await api('/api/state');
  const S = st.Season;
  $('gold').textContent = `💰 ${st.Gold}` + (st.FreeGachas>0?` (무료뽑기 ${st.FreeGachas})`:'');
  const L = st.Ludus;
  $('ludus').textContent = L ? `🏛 ${L.TierName}` : '';
  $('ludus').title = L ? `루두스 명성 ${Math.round(L.Rep)}` + (L.NextTierName?` · 다음 등급 「${L.NextTierName}」까지 ${Math.max(0,Math.round(L.NextTierRep-L.Rep))}` : ' · 최고 등급') + ` · 수입 ×${L.IncomeMult.toFixed(2)}` : '';
  $('status').textContent = st.SeasonActive ? `시즌 ${S.SeasonNo} · ${S.Matches}/${S.TotalMatches}` : `시즌 ${S.SeasonNo} 종료 — 프리시즌`;
  const nm = st.NextMatch;
  $('next').textContent = !st.SeasonActive ? `🏛 시즌 ${S.SeasonNo + (S.Matches>0?1:0) || 1} 개막 ▶`
    : nm && nm.IsPlayerMatch ? `⚔ ${nm.IsEvent?'🎪 ':''}내 경기: ${nm.AName} vs ${nm.BName} ▶`
    : '▶▶ 다음 내 경기까지 진행';
  $('mInfo').textContent = `시즌 ${S.SeasonNo} · 내 선수 ${st.MyFighters.length}/${st.RosterCap} · 💰${st.Gold}`;
  return st;
}

// ── 다음 경기: 내 경기 = 전술 모달 → 결과 화면 / AI 경기 = 자동 시뮬(내 경기 직전 정지) ──
$('next').onclick = async ()=>{
  if (!st) await refresh();
  const nx=$('next'); nx.disabled=true;
  try{
    if (!st.SeasonActive){ await api('/api/next',{}); await refresh(); go('league'); return; }   // 개막
    const nm = st.NextMatch;
    if (nm && nm.IsPlayerMatch){ openTacModal(nm); return; }
    const r = await api('/api/simto',{});
    await refresh();
    if (r.seasonDone){ simNote = `▶▶ ${r.played}경기 자동 진행 · 시즌 종료`; showSeason(); }
    else { simNote = `▶▶ ${r.played}경기 자동 진행 · 다음은 내 경기`; go('league'); }
  } finally { nx.disabled=false; }
};
let simNote=null, pendingSeason=false;

// ── 시즌 요약 연출 (시즌 종료 시 — 챔피언·순위·정산·노화·서사) ──
function showSeason(){
  const s = st && st.LastSeason; if (!s) { go('league'); return; }
  $('ssTitle').textContent = `🏛 시즌 ${s.SeasonNo} 종료`;
  $('ssChamp').textContent = `👑 챔피언: ${s.Champion}` + (s.ChampionIsMine ? ' — 내 루두스의 영광!' : '');
  $('ssCup').textContent = s.CupChampion ? `🏆 컵 우승: ${s.CupChampion}` + (s.CupChampionMine ? ' — 내 루두스!' : '') : '';
  $('ssAch').innerHTML = (s.NewAchievements&&s.NewAchievements.length)
    ? `<div class="rrow" style="color:var(--gold)"><span>🎖 새 업적</span><b>${s.NewAchievements.join(' · ')}</b></div>` : '';
  $('ssTable').innerHTML = s.Standings.map(r=>
    `<tr style="${r.IsPlayer?'color:var(--gold);font-weight:700':''}">`+
    `<td style="padding:2px 8px 2px 2px">${r.Rank}</td><td>${r.Name}${r.Rank===1?' 👑':''}</td>`+
    `<td style="text-align:right">${r.W}-${r.L}-${r.D}</td><td style="text-align:right; padding-left:10px">${r.Points}점</td></tr>`).join('');
  $('ssMoney').innerHTML = s.MyBestRank>0
    ? `<span>💰 정산</span><b>+${Math.round(s.RankBonus)}</b> <span class="d">(${s.MyBestRank}위 보너스)</span> <b>−${Math.round(s.Salary)}</b> <span class="d">(급여)</span> → <b>잔고 ${Math.round(s.GoldAfter)}</b>` : '';
  $('ssAging').innerHTML = (s.AgingNotes||[]).map(n=>`<div class="rrow"><span>⏳ 노화</span><span class="d">${n}</span></div>`).join('');
  $('ssStory').innerHTML = `<span>이번 시즌 서사</span><span class="d">복수 ${s.Revenge} · 이변 ${s.Upsets} · 대역전 ${s.Comebacks} · 최고 명성 ${s.TopFame}</span>`;
  $('seasonModal').classList.add('on');
}

// ── 설정 (localStorage 'mor_settings' — viewer.html이 배속·스포일러를 읽음) ──
const CFG = (()=>{ try{ return JSON.parse(localStorage.getItem('mor_settings'))||{}; }catch(e){ return {}; } })();
$('cfgSpeed').value = String(CFG.speed||1);
$('cfgSpoiler').checked = !!CFG.spoiler;
$('cfgSound').checked = CFG.sound !== false;   // 기본 켜짐
function saveCfg(){ localStorage.setItem('mor_settings',
  JSON.stringify({speed: parseFloat($('cfgSpeed').value), spoiler: $('cfgSpoiler').checked, sound: $('cfgSound').checked})); }
$('cfgSpeed').onchange = saveCfg;
$('cfgSpoiler').onchange = saveCfg;
$('cfgSound').onchange = saveCfg;
$('cfgBtn').onclick = ()=> $('cfgModal').classList.add('on');
$('cfgModal').onclick = e=>{ if(e.target===$('cfgModal')) $('cfgModal').classList.remove('on'); };
$('profModal').onclick = e=>{ if(e.target===$('profModal')) $('profModal').classList.remove('on'); };

// ── 단축키: Space/N = 다음 경기 · 1~5 = 탭 (모달·메뉴 열려있으면 무시) ──
window.addEventListener('keydown', e=>{
  if ($('menu').style.display !== 'none') return;   // 메뉴(초기 '' 포함) 열림 = 무시
  if (document.querySelector('.modal.on')) return;
  if (e.code === 'Space' || e.key === 'n' || e.key === 'N'){ e.preventDefault(); $('next').click(); }
  const tabs = ['league','ludus','market','roster','watch'];
  if (e.key >= '1' && e.key <= '5') go(tabs[+e.key - 1]);
});

function openTacModal(nm){
  $('tmTitle').textContent = (nm.Stage?nm.Stage+' — ':'전술 지시 — ') + nm.MyName;
  const o = nm.Opp;
  const relBadge = nm.MyRelation ? ` · <span style="color:var(--b);font-weight:700">${nm.MyRelation==='원수'?'⚔':nm.MyRelation==='공포'?'😨':nm.MyRelation==='라이벌'?'🔥':'🔗'} ${nm.MyRelation}${nm.MyRelation==='원수'?' — 복수전!':''}</span>` : '';
  const emo = (nm.MyEmotions&&nm.MyEmotions.length) ? `<div style="margin-top:3px">💭 <span style="color:var(--gold)">${nm.MyEmotions.join(', ')}</span> <span style="color:var(--dim);font-size:11px">상태로 출전</span></div>` : '';
  const hint = o ? `<div style="margin-top:3px;font-size:11px;color:var(--dim)">📐 상대는 ${nm.OppIsKiter?'장거리 카이터 — 파고드는 전술(압박·난전·사냥꾼)이 유리한 경향':'근접형 — 거리 유지·반격 전술(카운터·견제·방어)이 유리한 경향'}</div>` : '';
  $('tmVs').innerHTML = `상대: <b>${o.Name}</b> · ${w(o.Weapon)} · ${p(o.Personality)} · ${o.Age}세 · 통산 ${o.Career} · 명성 ${o.Fame}`
    + (nm.IsEvent?'  <span class="tag" style="border:1px solid var(--gold);color:var(--gold);border-radius:4px;padding:0 5px;font-size:11px">🎪 이벤트</span>':'')
    + `<div style="margin-top:3px">상대전적: <b style="color:var(--gold)">${nm.MyVsOpp||'첫 대결'}</b>${relBadge}</div>` + emo + hint;
  $('tmOpts').innerHTML = nm.MyPool.map(tc=>
    `<button class="tacbtn" onclick="pickTac('${tc}')"><b>${t(tc)}</b>${tc===nm.MyTactic?' <span class="d">(현재)</span>':''}<div class="d">${TACD[tc]||''}</div></button>`).join('');
  $('tacModal').classList.add('on');
}
window.pickTac = tc => { $('tacModal').classList.remove('on'); doPlay(tc); };
$('tacModal').onclick = e => { if(e.target===$('tacModal')) $('tacModal').classList.remove('on'); };

async function doPlay(tacticId){
  const nx=$('next'); nx.disabled=true;
  try{
    const m = await api('/api/next', tacticId?{tacticId}:{});
    await refresh();
    pendingSeason = !!m.SeasonCompleted;   // 마지막 경기였으면 결과 확인 후 시즌 요약 연출
    pendingResult = m;                     // 결과는 관전이 끝난 뒤에 (viewer가 matchEnded 통지)
    await openWatch(-1);                   // 방금 경기 라이브 관전 (승자 숨김)
  } finally { nx.disabled=false; }
}
let pendingResult = null;
function fireResult(){
  if (!pendingResult) return;
  const m = pendingResult; pendingResult = null;
  $('skipBtn').hidden = true;
  showResult(m);
}

// ── 결과 화면 (내 경기 종료 시 — 승/패 + 능력치·재화·인기 변경사항) ──
function showResult(m){
  const mine = m.Mine || [];
  const d0 = mine[0];
  const title = mine.length===2 ? `내전 종료 — ${m.Winner} 승리`
    : !d0 ? `${m.Winner} 승` : d0.Draw ? '무승부' : d0.Won ? '🏆 승리!' : '💀 패배';
  $('resTitle').textContent = title;
  $('resTitle').style.color = d0 && !d0.Draw ? (d0.Won ? 'var(--grn)' : 'var(--b)') : 'var(--gold)';
  $('resVs').textContent = `R${m.Round} · ${m.A} vs ${m.B} → ${m.Winner} (${m.Reason})` + (m.IsEvent?'  [🎪 이벤트]':'');
  const sign = v => (v>=0?'+':'')+Math.round(v*10)/10;
  $('resBody').innerHTML = mine.map(d=>`
    <div class="rrow"><b>${d.Name}</b> — ${d.Draw?'무승부':d.Won?'승리':'패배'}</div>
    ${d.Income>0?`<div class="rrow"><span>💰 수입</span><b>+${Math.round(d.Income)}</b> <span class="d">${d.IncomeNote}</span></div>`:''}
    ${d.GrowthAxis?`<div class="rrow"><span>📈 성장</span><b>${d.GrowthAxis.toUpperCase()} +0.5</b></div>`:'<div class="rrow"><span>📈 성장</span><span class="d">상한 도달</span></div>'}
    ${d.TrainingGained>0?`<div class="rrow"><span>🏋 훈련 포인트</span><b>+${d.TrainingGained}</b> <span class="d">(루두스에서 분배)</span></div>`:''}
    <div class="rrow"><span>⭐ 명성</span><b>${sign(d.FameDelta)}</b></div>
    <div class="rrow"><span>🔥 인기</span><b>${sign(d.PopDelta)}</b></div>
    ${d.Emotion?`<div class="rrow"><span>💭 감정</span><b>${d.Emotion}</b> <span class="d">(다음 경기에 영향)</span></div>`:''}
  `).join('<hr style="border-color:#4a3a26">') || '<div class="rrow d">내 선수 정보 없음</div>';
  $('resModal').classList.add('on');
}
window.closeResult = ()=>{ $('resModal').classList.remove('on');
  if (pendingSeason){ pendingSeason=false; showSeason(); } else go('league'); };
window.watchReplay = async ()=>{
  $('resModal').classList.remove('on');
  await openWatch(-1);
};
async function openWatch(idx){
  const r = await api('/api/watch',{idx});
  if (r.error) return;
  $('watchCard').textContent = `R${r.round} · ${r.a} vs ${r.b}`;
  $('watchTag').hidden = !r.isEvent;
  $('skipBtn').hidden = !pendingResult;   // 내 경기 관전 중에만 "결과 보기" 스킵 제공
  $('watchF').src = 'viewer.html?t='+Date.now();
  go('watch');
}
// viewer/리그 iframe 통신: 경기 목록 클릭=관전 · 재생 완료=결과창
window.addEventListener('message', e=>{
  if (!e.data) return;
  if (typeof e.data.watchIdx === 'number') openWatch(e.data.watchIdx);
  if (e.data.matchEnded) fireResult();    // 관전이 끝났다 — 이제 결과 화면
});
// 리그 진입 시 자동 진행 안내
const _go = go;
go = function(s){ _go(s);
  if (s==='league' && simNote){ $('incomeBar').style.display='block'; $('incomeBar').textContent = simNote; simNote=null; }
  else if (s==='league') $('incomeBar').style.display='none';
};

// ── 루두스 ──
function renderLudus(){
  if (!st) return;
  const L = st.Ludus;
  if (L){
    const pct = L.NextTierName ? Math.min(100, 100*L.Rep/L.NextTierRep) : 100;
    $('repBox').innerHTML = `<div style="display:flex;align-items:baseline;gap:10px">
        <b style="color:var(--gold);font-size:16px">🏛 ${L.TierName}</b>
        <span class="note">명성 ${Math.round(L.Rep)} · 경기 수입 ×${L.IncomeMult.toFixed(2)} · 영입 원석 품질 +${L.Tier}</span></div>
      <div class="cap" style="margin-top:8px"><i style="width:${pct}%"></i></div>
      <div class="note" style="margin-top:4px">${L.NextTierName?`다음 등급 「${L.NextTierName}」까지 ${Math.max(0,Math.round(L.NextTierRep-L.Rep))} 명성`:'최고 등급 달성 — 콜로세움의 지배자'}</div>`;
  }
  $('ludusNote').textContent = `(${st.MyFighters.length}/${st.RosterCap}명)`;
  $('myGrid').innerHTML = st.MyFighters.length ? st.MyFighters.map(f=>{
    const axes=[['Atk',f.Stats.Atk],['Def',f.Stats.Def],['Hp',f.Stats.Hp],['Spd',f.Stats.Spd],['Aspd',f.Stats.Aspd],['Rct',f.Stats.Rct]];
    const cap = Math.min(100, 100*f.BudgetUsed/f.PotentialBudget);
    return `<div class="fc"><h3><span style="cursor:pointer;text-decoration:underline dotted" onclick="openProfile('${f.Id}')" title="상세 보기">${f.Name}</span> ${f.Aging?'<span class="old">노쇠 — 상한 감소 중</span>':''}</h3>
      ${epi(f.Epithets)}
      <div class="bd">${w(f.Weapon)} · ${p(f.Personality)} · ${f.Age}세 · <b style="color:var(--gold)">${f.Talent}</b> / 잠재 ${f.Potential}</div>
      <div class="chips">${f.Traits.map(x=>`<span class="chip">${x}</span>`).join('')}${
        (f.Emotions||[]).map(x=>`<span class="chip" style="background:rgba(201,168,76,.18);color:var(--gold)" title="다음 경기에 영향">💭 ${x}</span>`).join('')}</div>
      <div class="chips" title="클릭 = 기본 전술 변경 (경기 직전 모달에서도 변경 가능)">${f.TacticPool.map(x=>
        `<span class="chip tac${x===f.Tactic?' cur':''}" style="cursor:pointer" onclick="setTac('${f.Id}','${x}')">${t(x)}</span>`).join('')}</div>
      <div class="stats">${axes.map(([a,v])=>`<div class="st"><span>${a==='Hp'?'HP':a.toUpperCase()}</span> ${Math.round(v)}
        ${f.TrainingPoints>0?`<button onclick="train('${f.Id}','${a}')">+</button>`:''}</div>`).join('')}</div>
      <div class="cap"><i style="width:${cap}%"></i></div>
      <div class="row"><span>성장 / 잠재력 상한</span><b>${f.BudgetUsed} / ${f.PotentialBudget}</b></div>
      <div class="row"><span>훈련 포인트</span><b>${f.TrainingPoints}</b></div>
      <div class="row"><span>시즌 / 통산</span><b>${f.W}-${f.L}-${f.D} / ${f.CW}-${f.CL}-${f.CD}</b></div>
      <div class="row"><span>명성 / 인기</span><b>${f.Fame} / ${f.Popularity}</b></div>
      ${!st.SeasonActive?`<button onclick="release('${f.Id}','${f.Name}')" style="margin-top:8px;width:100%;background:#4a2a26;border:none;color:#e0a89f;border-radius:6px;padding:4px">👋 방출</button>`:''}</div>`;
  }).join('') : '<div class="note">선수가 없다 — 영입 탭에서 뽑기로 시작하라.</div>';

  const facs=[['training','훈련장',st.TrainingLv,3,'3경기당 훈련 포인트 '+st.TrainingLv+'pt',[200,500]],
              ['medical','의무실',st.MedicalLv,3,'노화 감속 −'+(25*(st.MedicalLv-1))+'%',[200,500]],
              ['quarters','숙소',st.QuartersLv,2,'로스터 상한 '+st.RosterCap+'명',[300,600]]];
  $('facRow').innerHTML = facs.map(([id,nm,lv,max,eff,costs])=>{
    const step = id==='quarters'?lv:lv-1;
    const can = lv<max;
    return `<div class="f"><b>${nm}</b> Lv${lv}<div class="note">${eff}</div>
      ${can?`<button onclick="build('${id}')">증축 (💰${costs[step]})</button>`:'<div class="note">최대</div>'}</div>`;
  }).join('');

  const cup = st.Cup;
  if (cup && cup.length){
    const cell = (m,label)=>{
      const mine = id=>st.MyFighters.some(f=>f.Name===id);
      const nm = n => n ? `<span style="${n===m.Winner?'color:var(--gold);font-weight:700':''}${mine(n)?';text-decoration:underline':''}">${n||'—'}</span>` : '<span class="note">미정</span>';
      return `<div class="f" style="min-width:180px"><div class="note">${label}</div>${nm(m.A)} <span class="note">vs</span> ${nm(m.B)}${m.Winner?`<div style="margin-top:3px">➜ 🏆 <b style="color:var(--gold)">${m.Winner}</b></div>`:''}</div>`;
    };
    const sf = cup.filter(m=>m.Stage==='4강'), fin = cup.filter(m=>m.Stage==='결승');
    $('cupBox').innerHTML = `<div class="fac">${sf.map((m,i)=>cell(m,`4강 ${i+1}`)).join('')}${fin.map(m=>cell(m,'결승')).join('')}</div>`;
  } else {
    $('cupBox').innerHTML = '<div class="note">정규시즌이 끝나면 상위 4인이 토너먼트로 격돌한다.</div>';
  }

  $('achGrid').innerHTML = (st.Achievements||[]).map(a=>
    `<div class="chip" title="${a.Desc}" style="padding:6px 10px;${a.Unlocked?'background:rgba(201,168,76,.2);color:var(--gold);border:1px solid var(--gold)':'opacity:.45'}">${a.Unlocked?'🏅':'🔒'} ${a.Name}</div>`).join('');
}
window.train = async (id,axis)=>{
  const r = await api('/api/train',{id,axis});
  if (r.error){ $('ludusErr').textContent=r.error; return; }
  $('ludusErr').textContent=''; st=r; renderLudus(); refreshTop();
};
window.setTac = async (id,tacticId)=>{
  const r = await api('/api/tactic',{id,tacticId});
  if (r.error){ $('ludusErr').textContent=r.error; return; }
  $('ludusErr').textContent=''; st=r; renderLudus();
};
window.release = async (id,name)=>{
  if (!confirm(`${name}을(를) 방출할까? 관계·기록과 함께 떠난다.`)) return;
  const r = await api('/api/release',{id});
  if (r.error){ $('ludusErr').textContent=r.error; return; }
  $('ludusErr').textContent=''; st=r; renderLudus(); refreshTop();
};
window.build = async (fac)=>{
  const r = await api('/api/build',{facility:fac});
  if (r.error){ $('ludusErr').textContent=r.error; return; }
  $('ludusErr').textContent=''; st=r; renderLudus(); refreshTop();
};
function refreshTop(){ $('gold').textContent=`💰 ${st.Gold}`+(st.FreeGachas>0?` (무료뽑기 ${st.FreeGachas})`:''); }

// ── 영입 ──
function renderMarket(){
  if (!st) return;
  $('marketNote').textContent = `잔고 💰${st.Gold} · 뽑기 ${st.FreeGachas>0?'무료 '+st.FreeGachas+'회':'💰'+st.GachaCost}`;
  $('gachaBtn').disabled = st.MyFighters.length >= st.RosterCap;
  $('candGrid').innerHTML = st.Candidates.length ? st.Candidates.map(c=>
    `<div class="fc cand"><h3>${c.Name}</h3>
     <div class="bd">${w(c.Weapon)} · ${p(c.Personality)} · 전술 일부: <b>${t(c.RevealedTactic)}</b></div>
     <div class="chips"><span class="chip hid">천부 ???</span><span class="chip hid">잠재력 ???</span><span class="chip hid">특성 ???</span><span class="chip hid">전술 2종 ???</span></div>
     <button class="recruit" onclick="recruit(${c.Idx})">📜 영입</button></div>`).join('')
    : '<div class="note">후보 없음 — 뽑기를 돌려라.</div>';
}
$('gachaBtn').onclick = async ()=>{
  const r = await api('/api/gacha',{});
  if (r.error){ $('marketErr').textContent=r.error; return; }
  $('marketErr').textContent=''; st=r; renderMarket(); refreshTop();
};
window.recruit = async (idx)=>{
  const r = await api('/api/recruit',{idx});
  if (r.error){ $('marketErr').textContent=r.error; return; }
  $('marketErr').textContent=''; st=r; renderMarket(); refreshTop();
  go('ludus');   // 영입 → 전체 공개된 카드 확인
};

// ── 로스터 (리그 전체, 공개 정보) ──
function renderRoster(){
  if (!st) return;
  $('rosterGrid').innerHTML = [...st.Season.Fighters].sort((a,b)=>b.Points-a.Points||b.Fame-a.Fame).map(f=>
    `<div class="fc ${f.IsPlayer?'':'ai'}" style="cursor:pointer" onclick="openProfile('${f.Id}')" title="상세 보기">
     <h3>${f.Name}${f.IsPlayer?' <span class="chip">내 루두스</span>':''}</h3>
     ${epi(f.Epithets)}
     <div class="bd">${w(f.Weapon)} · ${p(f.Personality)} · ${f.Age}세</div>
     <div class="row"><span>시즌</span><b>${f.W}-${f.L}-${f.D} (승점 ${f.Points})</b></div>
     <div class="row"><span>통산</span><b>${f.CW}-${f.CL}-${f.CD}</b></div>
     <div class="row"><span>명성 / 인기</span><b>${f.Fame} / ${f.Popularity}</b></div></div>`).join('');
}

// ── 메뉴 ──
$('mCont').onclick = ()=> $('menu').style.display='none';
$('mNew').onclick = async ()=>{
  st = await api('/api/newcareer',{});
  await refresh();
  $('leagueF').src='league.html?t='+Date.now();
  $('menu').style.display='none';
  go('market');   // 새 커리어 = 영입부터
};

refresh();
</script>
</body>
</html>
